# The database URL, e.g. http://127.0.0.1:8428 or https://127.0.0.1:8427 .
# Defaults to: http://127.0.0.1:8428
# url=http(s)://<host>:<port>

# The username for HTTP basic authentication, e.g. when VictoriaMetrics runs with
# -httpAuth.username or behind vmauth or a reverse proxy.
# user=<user>

# The password for HTTP basic authentication.
# password=

# The bearer token to authenticate, e.g. for vmauth or a reverse proxy.
# Only used if no username is set.
# token=

# The prefix added to all metric names, e.g. openhab_ . Must be a valid metric name.
# Defaults to no prefix, the metric name starts with the item name.
# metricPrefix=

# The suffix added to all metric names. Set to _value to use data written by the
# InfluxDB persistence service to VictoriaMetrics or imported with vmctl.
# Defaults to no suffix.
# metricSuffix=

# The maximum number of distinct string states stored per item. String states are only
# stored for items with the metadata stringStates="true".
# Defaults to: 50
# maxStringStates=50

# Include the item category, type, label or unit (of items with a dimension) as tag.
# Defaults to: false
# addCategoryTag=false
# addTypeTag=false
# addLabelTag=false
# addUnitTag=false
