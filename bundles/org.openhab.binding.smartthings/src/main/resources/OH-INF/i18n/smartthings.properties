# add-on

addon.smartthings.name = Samsung Smartthings Binding
addon.smartthings.description = Direct local control of Samsung OCF appliances, including air conditioners, using authenticated CoAP over DTLS.

# thing types

thing-type.smartthings.localAppliance.label = Local Samsung OCF Appliance
thing-type.smartthings.localAppliance.description = Direct authenticated local control of a compatible Samsung appliance, including air conditioners. No SmartThings Hub is required.

# thing types config

thing-type.config.smartthings.localAppliance.deviceId.label = Expected Device UUID
thing-type.config.smartthings.localAppliance.deviceId.description = Optional expected appliance UUID. The authenticated device identity must match; otherwise the first authenticated identity is remembered for this Thing.
thing-type.config.smartthings.localAppliance.host.label = Appliance Address
thing-type.config.smartthings.localAppliance.host.description = Host name or IP address of the appliance on the local network.
thing-type.config.smartthings.localAppliance.keyStore.label = Client PKCS12 Key Store
thing-type.config.smartthings.localAppliance.keyStore.description = Absolute path on the openHAB server to a PKCS12 key store containing one authorized client private key and its certificate chain. Use either this mode or OwnerPSK.
thing-type.config.smartthings.localAppliance.keyStorePassword.label = Key Store Password
thing-type.config.smartthings.localAppliance.keyStorePassword.description = Password protecting the client PKCS12 key store and private key.
thing-type.config.smartthings.localAppliance.localPort.label = Local UDP Port
thing-type.config.smartthings.localAppliance.localPort.description = Local client UDP port. Zero selects a deterministic stable port. Use an explicit unused port if multiple Things would conflict.
thing-type.config.smartthings.localAppliance.ownerId.label = Owner UUID
thing-type.config.smartthings.localAppliance.ownerId.description = Owner UUID associated with an imported OwnerPSK. Not the device UUID.
thing-type.config.smartthings.localAppliance.ownerPsk.label = OwnerPSK
thing-type.config.smartthings.localAppliance.ownerPsk.description = Previously provisioned, authorized owner pre-shared key: 16 or 32 bytes encoded as hexadecimal. Use either this mode or a client key store.
thing-type.config.smartthings.localAppliance.port.label = Secure CoAP Port
thing-type.config.smartthings.localAppliance.port.description = Advertised DTLS port. Zero discovers the secure port from this host using public CoAP discovery.
thing-type.config.smartthings.localAppliance.refreshInterval.label = Refresh Interval
thing-type.config.smartthings.localAppliance.refreshInterval.description = Delay between local resource polls, in seconds.
thing-type.config.smartthings.localAppliance.serverFingerprint.label = Server Certificate SHA-256 Fingerprint
thing-type.config.smartthings.localAppliance.serverFingerprint.description = Explicitly trusted appliance leaf certificate fingerprint obtained through an authenticated, out-of-band source. Required with a client key store. Hexadecimal, with optional colon separators.
thing-type.config.smartthings.localAppliance.timeout.label = Request Timeout
thing-type.config.smartthings.localAppliance.timeout.description = Maximum duration of each discovery or authenticated CoAP request, in seconds.

# channel types

channel-type.smartthings.local-number-readonly.label = Appliance Number State
channel-type.smartthings.local-number-readonly.description = Read-only numeric resource state. No unit or range is inferred.
channel-type.smartthings.local-number.label = Appliance Number
channel-type.smartthings.local-number.description = Numeric resource state. Supported command values depend on live device capabilities.
channel-type.smartthings.local-power-readonly.label = Appliance Power State
channel-type.smartthings.local-power-readonly.description = Read-only power resource state in its protocol-defined unit.
channel-type.smartthings.local-power.label = Appliance Power
channel-type.smartthings.local-power.description = Power resource state in its protocol-defined unit.
channel-type.smartthings.local-string-readonly.label = Appliance Text State
channel-type.smartthings.local-string-readonly.description = Read-only text or JSON representation of a non-security resource.
channel-type.smartthings.local-string.label = Appliance Setting
channel-type.smartthings.local-string.description = Text resource state. Valid commands depend on live device capabilities; no fixed option list is assumed.
channel-type.smartthings.local-switch-readonly.label = Appliance Switch State
channel-type.smartthings.local-switch-readonly.description = Read-only boolean resource state.
channel-type.smartthings.local-switch.label = Appliance Switch
channel-type.smartthings.local-switch.description = Boolean resource state. Writes are accepted only when live appliance capabilities and Remote Control permit them.
channel-type.smartthings.local-temperature-readonly.label = Appliance Temperature State
channel-type.smartthings.local-temperature-readonly.description = Read-only temperature in the device-reported unit.
channel-type.smartthings.local-temperature.label = Appliance Temperature
channel-type.smartthings.local-temperature.description = Temperature in the device-reported unit. Writes require a valid advertised range and increment.
