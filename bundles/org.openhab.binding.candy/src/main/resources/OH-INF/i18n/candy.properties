# runtime diagnostics

config-error-host = Configure an appliance hostname or IP address without scheme, port, path or credentials.
config-error-key = The optional manual appliance key must contain exactly 16 printable ASCII characters without spaces.
config-error-account = Configure your simply-Fi username and password, or provide a manual appliance key in advanced settings.
config-error-appliance-id = The optional appliance ID may contain only letters, digits, underscores and hyphens, up to 128 characters.
account-error-authentication = Account login could not complete. Check your simply-Fi credentials and complete any required verification or consent in the manufacturer's application before retrying.
account-error-appliance = The selected appliance was not found in your account. Check the advanced appliance ID or leave it empty for automatic matching.
account-error-key = No supported appliance key was available from the account. Check that the washer is enrolled in simply-Fi; key retrieval will be retried.
account-error-key-match = None of the account keys decoded this washer's local status. Check the appliance address and account; key retrieval will be retried.
account-error-timeout = Account setup timed out. Check Internet access; the binding will retry automatically.
account-error-transport = Unable to read the simply-Fi account service. Check Internet access and service availability; the binding will retry automatically.
account-error-client = The account HTTP client is unavailable. Account setup will be retried.
account-error-response = The account service returned an unexpected response. Account setup will be retried.
account-error-redirect = Account login requested an unsupported destination. The login flow may have changed or require verification in the manufacturer's application.
config-error-interval = Refresh interval must be at least 15 seconds and request timeout must be between 1 and 10 seconds.
communication-error = Unable to read usable local washer status. Check network reachability and the existing appliance key.
communication-error-transport = Unable to connect to or receive status from the appliance. Check its hostname or IP address and network connection.
communication-error-timeout = The appliance did not respond within the configured request timeout. Check its network connection.
communication-error-http = The appliance returned an unsuccessful HTTP status. Verify that it supports the local simply-Fi status endpoint.
communication-error-client = The openHAB HTTP client is unavailable. Retry after the HTTP service becomes available.
communication-error-response = The appliance returned an invalid or unreadable status response. Check the existing appliance key and firmware compatibility.
protocol-error-empty = The appliance returned an empty status response.
protocol-error-hex = The appliance returned an invalid hexadecimal status response. Check its local protocol compatibility.
protocol-error-encoding = The decoded status is not valid UTF-8. Check the appliance key and firmware compatibility.
protocol-error-size = The status payload exceeds the supported protocol size limit.
protocol-error-key = The appliance key must contain exactly 16 printable ASCII characters without spaces.
protocol-error-json = The decoded status is not valid JSON. Check the appliance key and firmware compatibility.
protocol-error-wrapper = The decoded response does not contain the local washer status object. Check the appliance key and firmware compatibility.
protocol-error-fields = The response contains no usable washer status fields. Check firmware compatibility.

# catalog and command diagnostics

catalog-error-response = The server returned an unsupported or incomplete program catalog.
catalog-error-interface = Program control requires the verified Bianca appliance interface.
command-error-program = The program lacks supported command defaults or contains invalid parameters.

# actions

action.getPrograms.label = Get Programs
action.getPrograms.description = Read formatted JSON containing a localized summary and cached program IDs, labels, startability and server defaults.
action.getPrograms.outputLabel = Programs
action.getPrograms.outputDescription = Formatted JSON text with a localized message and a programs array of public program metadata.
action.refreshPrograms.label = Refresh Programs
action.refreshPrograms.description = Request server program options asynchronously; limited to one attempt every five minutes.
action.startProgram.label = Start Program
action.startProgram.description = Request a program start using server defaults. Requires enabled controls and a fresh device permission and readiness check.
action.startProgram.programIdLabel = Program ID
action.startProgram.programIdDescription = Exact ID of a cached program whose startable field is true.
action.stopProgram.label = Stop Program
action.stopProgram.description = Request stopping a running cycle or cancelling a delayed start. Requires enabled controls and a fresh device permission check.
action.getCatalogStatus.label = Get Catalog Status
action.getCatalogStatus.description = Read a localized description of the latest catalog status without a network request.
action.getCatalogStatus.outputLabel = Catalog Status
action.getLastCommandResult.label = Get Last Command Result
action.getLastCommandResult.description = Read a localized description of the latest asynchronous command result; sending alone does not confirm device acceptance.
action.getLastCommandResult.outputLabel = Last Command Result

# action feedback

action.result.outputLabel = Result
action.result.outputDescription = Localized information about the request. Queuing does not confirm device acceptance.
action.result.unavailable = The washer handler is unavailable. No request was queued.
action.result.programRequired = No start was requested. Choose a non-empty program ID from the cached program options.
action.result.programs = Read cached program options. Count: {0}.
action.result.refreshQueued = A program catalog refresh request was queued. Check catalog status for the outcome.
action.result.startQueued = A program start request was queued for validation. Check the last command result; washing has not yet been confirmed.
action.result.stopQueued = A stop request was queued for validation. Check the last command result; stopping has not yet been confirmed.
action.catalog.NOT_READY = The program catalog is not ready. A successful local washer read is required before loading server options.
action.catalog.ACCOUNT_REQUIRED = Configure simply-Fi account credentials to retrieve server program options.
action.catalog.LOADING = The server program catalog is being loaded.
action.catalog.READY = The cached program catalog is ready.
action.catalog.RATE_LIMITED = The catalog refresh was rate limited. Only one server attempt is allowed every five minutes.
action.catalog.FAILED = The server program catalog request failed. Previously loaded options, if any, remain available.
action.command.PENDING = The command is pending a fresh washer status and remote-permission check.
action.command.SENT = The command was sent. Device confirmation is still pending.
action.command.CONFIRMED = The washer reported the expected state and confirmed the command.
action.command.REJECTED = The command was rejected because it is unsupported or its parameters are invalid.
action.command.DISABLED = Washing controls are disabled. Enable them in the Thing configuration to allow start and stop requests.
action.command.BUSY = Another command or local request is active. The new command was not accepted.
action.command.INVALID_PROGRAM = The program is unavailable or cannot be started. Choose a supported cached program ID.
action.command.NOT_READY = The washer is not ready for a washing command, or no command result is available yet.
action.command.REMOTE_DISABLED = Remote operation is disabled on the washer. Enable physical remote-operation permission before requesting a command.
action.command.FAILED = Fresh washer status could not be read. No washing command was sent.
action.command.UNKNOWN = The command outcome is unknown. Check the washer before another request; the command will not be replayed automatically.
