# add-on

addon.livetennisapi.name = Live Tennis API Binding
addon.livetennisapi.description = Live tennis scores, next matches and rankings for tracked players and tournaments from the Live Tennis API.

# thing types

thing-type.livetennisapi.account.label = Live Tennis API Account
thing-type.livetennisapi.account.description = Provides access to the Live Tennis API with one API key. Polls the live match snapshot once per refresh interval and shares it with all player and tournament things of this bridge.
thing-type.livetennisapi.player.label = Tennis Player
thing-type.livetennisapi.player.description = Tracks one player (or doubles team): their live match state, their next scheduled match and their current ranking. Score channels list the tracked player first.
thing-type.livetennisapi.tournament.label = Tennis Tournament
thing-type.livetennisapi.tournament.description = Tracks one tournament of the catalogue: its metadata, how many of its matches are in progress and the state of the first listed live match.

# thing types config

thing-type.config.livetennisapi.account.apiKey.label = API Key
thing-type.config.livetennisapi.account.apiKey.description = API key for the Live Tennis API. A free key is self-serve at https://livetennisapi.com/subscribe/free.
thing-type.config.livetennisapi.account.refreshInterval.label = Refresh Interval
thing-type.config.livetennisapi.account.refreshInterval.description = How often to poll the live match snapshot in seconds. The default of 1800 s keeps the bridge plus one player thing within the free tier's daily quota; lower values need a paid tier.
thing-type.config.livetennisapi.player.detailRefreshEnabled.label = Refresh Player Detail
thing-type.config.livetennisapi.player.detailRefreshEnabled.description = Whether to refresh the next match and ranking for this player. Turn it off to track only the live match state (pushed by the bridge at no extra cost) and spend no quota of this thing's own, lowering the chance of hitting the daily limit.
thing-type.config.livetennisapi.player.detailRefreshInterval.label = Detail Refresh Interval
thing-type.config.livetennisapi.player.detailRefreshInterval.description = How often to refresh the next match and the ranking in seconds when detail refresh is enabled. Each cycle costs two API requests per player thing.
thing-type.config.livetennisapi.player.playerId.label = Player ID
thing-type.config.livetennisapi.player.playerId.description = The player's id in the Live Tennis API. Look it up with GET /players?search=name.
thing-type.config.livetennisapi.tournament.tournamentId.label = Tournament ID
thing-type.config.livetennisapi.tournament.tournamentId.description = The tournament's stable id in the Live Tennis API. Look it up with GET /tournaments?search=name.

# channel group types

channel-group-type.livetennisapi.live-match.label = Live Match
channel-group-type.livetennisapi.live-match.description = The tracked player's match currently in progress. All channels are UNDEF while the player has no live match.
channel-group-type.livetennisapi.next-match.label = Next Match
channel-group-type.livetennisapi.next-match.description = The tracked player's next scheduled match.
channel-group-type.livetennisapi.next-match.channel.opponent.label = Next Opponent
channel-group-type.livetennisapi.next-match.channel.opponent.description = Opponent in the next scheduled match
channel-group-type.livetennisapi.next-match.channel.round.label = Next Round
channel-group-type.livetennisapi.next-match.channel.round.description = Round of the next scheduled match
channel-group-type.livetennisapi.next-match.channel.tournament.label = Next Tournament
channel-group-type.livetennisapi.next-match.channel.tournament.description = Tournament of the next scheduled match
channel-group-type.livetennisapi.player-profile.label = Player Profile
channel-group-type.livetennisapi.player-profile.description = The tracked player's current ranking.
channel-group-type.livetennisapi.tournament-info.label = Tournament Info
channel-group-type.livetennisapi.tournament-info.description = Curated tournament metadata; individual values can be UNDEF where the catalogue has no curated entry.
channel-group-type.livetennisapi.tournament-info.channel.name.label = Name
channel-group-type.livetennisapi.tournament-info.channel.name.description = Name of the tournament
channel-group-type.livetennisapi.tournament-live.label = Live Matches
channel-group-type.livetennisapi.tournament-live.description = The tournament's matches currently in progress. Match channels show the first listed live match.
channel-group-type.livetennisapi.usage.label = API Usage
channel-group-type.livetennisapi.usage.description = The API key's own tier and daily usage. Reading it is quota-exempt.

# channel types

channel-type.livetennisapi.break-point.label = Break Point
channel-type.livetennisapi.break-point.description = ON while the current game stands at break point; never ON in a tiebreak; UNDEF when the score state does not allow deriving it
channel-type.livetennisapi.calls-today.label = Calls Today
channel-type.livetennisapi.calls-today.description = API calls made today with this key
channel-type.livetennisapi.category.label = Category
channel-type.livetennisapi.category.description = Tournament category where the catalogue states it unambiguously, e.g. grand_slam or atp_250
channel-type.livetennisapi.discipline.label = Discipline
channel-type.livetennisapi.discipline.description = Whether the match is singles or doubles; UNDEF when the feed states neither
channel-type.livetennisapi.discipline.state.option.singles = Singles
channel-type.livetennisapi.discipline.state.option.doubles = Doubles
channel-type.livetennisapi.match-count.label = Live Match Count
channel-type.livetennisapi.match-count.description = Number of this tournament's matches currently in progress
channel-type.livetennisapi.match-players.label = Players
channel-type.livetennisapi.match-players.description = Both participants of the featured live match, e.g. "Player One vs Player Two"
channel-type.livetennisapi.match-status.label = Match Status
channel-type.livetennisapi.match-status.description = Lifecycle status of the match
channel-type.livetennisapi.match-status.state.option.upcoming = Upcoming
channel-type.livetennisapi.match-status.state.option.live = Live
channel-type.livetennisapi.match-status.state.option.completed = Completed
channel-type.livetennisapi.match-status.state.option.cancelled = Cancelled
channel-type.livetennisapi.opponent.label = Opponent
channel-type.livetennisapi.opponent.description = Name of the opponent
channel-type.livetennisapi.points.label = Points
channel-type.livetennisapi.points.description = In-game points, e.g. "40-15" or "AD-40"
channel-type.livetennisapi.ranking-points.label = Ranking Points
channel-type.livetennisapi.ranking-points.description = The player's current ranking points
channel-type.livetennisapi.ranking.label = Ranking
channel-type.livetennisapi.ranking.description = The player's current singles or doubles ranking
channel-type.livetennisapi.remaining-today.label = Remaining Today
channel-type.livetennisapi.remaining-today.description = API calls remaining today within the daily quota
channel-type.livetennisapi.round.label = Round
channel-type.livetennisapi.round.description = Round of the match as stated by the feed
channel-type.livetennisapi.score-line.label = Score Line
channel-type.livetennisapi.score-line.description = Games per set, e.g. "6-4 3-2"
channel-type.livetennisapi.server-name.label = Server
channel-type.livetennisapi.server-name.description = Name of the player serving in the featured live match
channel-type.livetennisapi.serving.label = Serving
channel-type.livetennisapi.serving.description = ON while the tracked player is serving; UNDEF when no game is in progress
channel-type.livetennisapi.sets.label = Sets
channel-type.livetennisapi.sets.description = Sets won, e.g. "1-0"
channel-type.livetennisapi.start-time.label = Start Time
channel-type.livetennisapi.start-time.description = Scheduled start of the next match; UNDEF until the order of play assigns a time
channel-type.livetennisapi.surface.label = Surface
channel-type.livetennisapi.surface.description = Court surface of the tournament
channel-type.livetennisapi.surface.state.option.hard = Hard
channel-type.livetennisapi.surface.state.option.clay = Clay
channel-type.livetennisapi.surface.state.option.grass = Grass
channel-type.livetennisapi.tiebreak.label = Tiebreak
channel-type.livetennisapi.tiebreak.description = ON while a tiebreak is being played
channel-type.livetennisapi.tier.label = Tier
channel-type.livetennisapi.tier.description = Access tier of the API key (free, basic, pro or ultra)
channel-type.livetennisapi.tournament-name.label = Tournament
channel-type.livetennisapi.tournament-name.description = Name of the tournament

# thing status

offline.conf-error-missing-api-key = The 'apiKey' parameter must be configured.
offline.conf-error-invalid-api-key = The Live Tennis API rejected the configured API key.
offline.conf-error-invalid-refresh-interval = The refresh interval must be a positive number of seconds.
offline.conf-error-invalid-player-id = The 'playerId' parameter must be a positive player id.
offline.conf-error-player-not-found = No player with the configured 'playerId' exists on the Live Tennis API.
offline.conf-error-missing-tournament-id = The 'tournamentId' parameter must be configured.
offline.conf-error-tournament-not-found = No tournament with the configured 'tournamentId' exists on the Live Tennis API.
offline.comm-error-rate-limited = The API key's rate limit or daily quota is exhausted (HTTP 429).
