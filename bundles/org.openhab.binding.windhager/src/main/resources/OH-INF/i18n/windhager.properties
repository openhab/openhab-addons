# add-on

addon.windhager.name = Windhager Binding
addon.windhager.description = This is the binding for Windhager.

# thing types

thing-type.windhager.biowin2.label = BioWin 2
thing-type.windhager.biowin2.description = Windhager BioWin 2 heating system

# thing types config

thing-type.config.windhager.biowin2.hostname.label = Hostname
thing-type.config.windhager.biowin2.hostname.description = Hostname or IP address of the BioWin webserver
thing-type.config.windhager.biowin2.password.label = Password
