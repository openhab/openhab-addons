thing-type.config.windhager.biowin2.port.label = Port
thing-type.config.windhager.biowin2.port.description = Port of the BioWin webserver. Defaults to 80.
thing-type.config.windhager.biowin2.username.label = Username
thing-type.config.windhager.biowin2.username.description = Username for authenticating to the BioWin webserver

# channel types

channel-type.windhager.biowin-value.label = BioWin Value
channel-type.windhager.biowin-value.description = Reads a numeric value from the BioWin webserver using a configured OID.

# channel types config

channel-type.config.windhager.biowin-value.oid.label = OID
channel-type.config.windhager.biowin-value.oid.description = BioWin OID, for example 1/60/0/23/103/0.
channel-type.config.windhager.biowin-value.refreshInterval.label = Refresh Interval
channel-type.config.windhager.biowin-value.refreshInterval.description = How often this value is refreshed from the BioWin webserver.

