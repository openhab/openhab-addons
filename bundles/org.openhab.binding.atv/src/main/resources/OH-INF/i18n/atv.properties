# thing status

offline.no-identifier = A device identifier (MAC) is required.
offline.not-found = Device not found. Set the host manually if it is on a different subnet.
offline.asleep = Device is asleep. Send the power channel ON to wake it.
offline.pairing = Enter the PIN shown on the device in the "{0} Pairing PIN" field; it expires soon.
offline.pairing-failed = {0} pairing failed. The device now shows a new PIN - enter it in the "{0} Pairing PIN" field.
