# add-on

addon.atv.name = Apple TV Binding
addon.atv.description = Controls Apple TV and AirPlay devices over AirPlay, Companion, MRP, and RAOP.

# thing types

thing-type.atv.appletv.label = Apple TV
thing-type.atv.appletv.description = An Apple TV (tvOS) controlled over AirPlay and Companion, including the MediaRemote tunnel.
thing-type.atv.speaker.label = AirPlay Speaker
thing-type.atv.speaker.description = An AirPlay/RAOP audio device such as a HomePod or third-party AirPlay speaker.

# thing types config

thing-type.config.atv.appletv.airplayCredentials.label = AirPlay Credentials
thing-type.config.atv.appletv.airplayCredentials.description = Credentials obtained by pairing AirPlay. Populated automatically after pairing.
thing-type.config.atv.appletv.companionCredentials.label = Companion Credentials
thing-type.config.atv.appletv.companionCredentials.description = Credentials obtained by pairing Companion. Populated automatically after pairing.
thing-type.config.atv.appletv.host.label = Host
thing-type.config.atv.appletv.host.description = IP address of the Apple TV. Populated and kept current by discovery; set manually only for a static IP or a device on a different subnet.
thing-type.config.atv.appletv.macAddress.label = Identifier
thing-type.config.atv.appletv.macAddress.description = Unique device identifier (MAC). Set automatically by discovery.
thing-type.config.atv.appletv.name.label = Name
thing-type.config.atv.appletv.name.description = Friendly name presented to the device while pairing.
thing-type.config.atv.appletv.airplayPin.label = AirPlay Pairing PIN
thing-type.config.atv.appletv.airplayPin.description = PIN shown on the Apple TV for the AirPlay pairing step. Enter it to pair AirPlay (now-playing metadata and streaming).
thing-type.config.atv.appletv.companionPin.label = Companion Pairing PIN
thing-type.config.atv.appletv.companionPin.description = PIN shown on the Apple TV for the Companion pairing step. After AirPlay is paired the device shows a new, different PIN; enter it to pair Companion (remote, power and apps).
thing-type.config.atv.appletv.refreshInterval.label = Refresh Interval
thing-type.config.atv.appletv.refreshInterval.description = Fallback polling interval in seconds (0 disables; live push updates are used otherwise).
thing-type.config.atv.speaker.airplayCredentials.label = AirPlay Credentials
thing-type.config.atv.speaker.airplayCredentials.description = Credentials obtained by pairing AirPlay. Populated automatically after pairing.
thing-type.config.atv.speaker.host.label = Host
thing-type.config.atv.speaker.host.description = IP address of the speaker. Populated and kept current by discovery; set manually only for a static IP or a device on a different subnet.
thing-type.config.atv.speaker.macAddress.label = Identifier
thing-type.config.atv.speaker.macAddress.description = Unique device identifier (MAC). Set automatically by discovery.
thing-type.config.atv.speaker.name.label = Name
thing-type.config.atv.speaker.name.description = Friendly name presented to the device while pairing.
thing-type.config.atv.speaker.password.label = Password
thing-type.config.atv.speaker.password.description = Password for password-protected AirPlay speakers.
thing-type.config.atv.speaker.airplayPin.label = AirPlay Pairing PIN
thing-type.config.atv.speaker.airplayPin.description = PIN shown on the speaker for the AirPlay pairing step (for devices that require pairing).
thing-type.config.atv.speaker.raopPin.label = RAOP Pairing PIN
thing-type.config.atv.speaker.raopPin.description = PIN shown on the speaker for the RAOP audio pairing step (for devices that require pairing).
thing-type.config.atv.speaker.raopCredentials.label = RAOP Credentials
thing-type.config.atv.speaker.raopCredentials.description = Credentials obtained by pairing RAOP audio. Populated automatically after pairing.
thing-type.config.atv.speaker.refreshInterval.label = Refresh Interval
thing-type.config.atv.speaker.refreshInterval.description = Fallback polling interval in seconds (0 disables; live push updates are used otherwise).

