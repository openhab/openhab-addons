syntax = "proto2";
option java_package = "org.openhab.binding.atv.internal.client.protocols.mrp.dto";

import "atv/mrp/protobuf/ProtocolMessage.proto";

extend ProtocolMessage {
  optional RegisterForGameControllerEventsMessage registerForGameControllerEventsMessage = 27;
}

message RegisterForGameControllerEventsMessage {
  enum InputModeFlags {
    None = 0;
    Motion = 1;
    Buttons = 2;
    Digitizer = 3;
  }

  optional InputModeFlags inputModeFlags = 1;
}
