    component: div
    config:
      style:
        aspect-ratio: 250.94 / 601.14
        background-image: url(/static/widgets/apple-tv-remote.svg)
        background-repeat: no-repeat
        background-size: 100% 100%
        margin: 0 auto
        max-width: 100%
        position: relative
        touch-action: manipulation
        user-select: none
        width: =props.width || '260px'
    slots:
