<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 632" width="300" height="632" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="938">
      <stop offset="0"    stop-color="#f2f3f4"/>
      <stop offset="0.25" stop-color="#e6e7e9"/>
      <stop offset="0.55" stop-color="#d4d6d9"/>
      <stop offset="1"    stop-color="#b3b5b9"/>
    </linearGradient>
    <linearGradient id="bodyShade" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="270" y2="0">
      <stop offset="0"    stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="0.12" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.88" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <radialGradient id="clickpad" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0"   stop-color="#3a3a3d"/>
      <stop offset="0.45" stop-color="#1a1a1c"/>
      <stop offset="1"   stop-color="#040405"/>
    </radialGradient>
    <radialGradient id="clickInner" cx="0.42" cy="0.35" r="0.8">
      <stop offset="0"   stop-color="#2e2e31"/>
      <stop offset="0.6" stop-color="#161618"/>
      <stop offset="1"   stop-color="#0a0a0b"/>
    </radialGradient>
    <radialGradient id="btn" cx="0.4" cy="0.32" r="0.85">
      <stop offset="0"   stop-color="#303032"/>
      <stop offset="0.55" stop-color="#161618"/>
      <stop offset="1"   stop-color="#060607"/>
    </radialGradient>
    <linearGradient id="btnPill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#28282a"/>
      <stop offset="0.5" stop-color="#151517"/>
      <stop offset="1"   stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9cbce"/>
      <stop offset="1" stop-color="#eef0f2"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <style>
    /* Invisible-but-tappable hit targets sit on top of the artwork.
       Give them a :hover/:active style from your app, or wire click handlers by id. */
    .hit { fill: #000; fill-opacity: 0; pointer-events: all; cursor: pointer; }
    .hit:hover { fill-opacity: 0.14; }
    .hit:active { fill-opacity: 0.28; }
  </style>

  <!-- ===================== SIDE BUTTON ===================== -->
  <rect id="sideButton" class="hit" x="262" y="203" width="18" height="38" rx="9"/>
  <rect x="264" y="205" width="14" height="34" rx="7" fill="url(#side)" stroke="#a7a9ac" stroke-width="0.6" pointer-events="none"/>

  <!-- ===================== BODY ===================== -->
  <path d="M 30 618 L 30 86 A 62 62 0 0 1 92 24 L 208 24 A 62 62 0 0 1 270 86 L 270 618 Z"
        fill="#000000" opacity="0.10" filter="url(#soft)"/>
  <path d="M 30 615 L 30 82 A 62 62 0 0 1 92 20 L 208 20 A 62 62 0 0 1 270 82 L 270 615 Z"
        fill="url(#body)" stroke="#a9abae" stroke-width="1"/>
  <path d="M 30 615 L 30 82 A 62 62 0 0 1 92 20 L 208 20 A 62 62 0 0 1 270 82 L 270 615 Z"
        fill="url(#bodyShade)"/>

  <!-- ===================== MICROPHONE (non-interactive) ===================== -->
  <rect id="microphone" x="142" y="47" width="14" height="4.5" rx="2.25" fill="#8f9195"/>

  <!-- ===================== POWER ===================== -->
  <g pointer-events="none">
    <g transform="translate(216.5,54)">
      <circle r="17" fill="none" stroke="#7c7e82" stroke-width="2.4"/>
      <rect x="-3.2" y="-19" width="6.4" height="7" fill="url(#body)"/>
      <line x1="0" y1="-18" x2="0" y2="-4" stroke="#7c7e82" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </g>
  <circle id="powerButton" class="hit" cx="216.5" cy="54" r="24"/>

  <!-- ===================== CLICKPAD (artwork) ===================== -->
  <g pointer-events="none">
    <g transform="translate(150,192)">
      <circle r="104" fill="url(#clickpad)"/>
      <circle r="104" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>
      <circle r="65" fill="url(#clickInner)"/>
      <circle r="65" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
      <circle cx="0"   cy="-84" r="2.4" fill="#d7d7d9" opacity="0.85"/>
      <circle cx="0"   cy="84"  r="2.4" fill="#d7d7d9" opacity="0.85"/>
      <circle cx="-84" cy="0"   r="2.4" fill="#d7d7d9" opacity="0.85"/>
      <circle cx="84"  cy="0"   r="2.4" fill="#d7d7d9" opacity="0.85"/>
    </g>
  </g>
  <!-- Clickpad touch zones: 4 directional wedges (outer ring) + center select -->
  <path id="upButton"    class="hit" d="M 106.16 148.16 L 75.05 117.05 A 106 106 0 0 1 224.95 117.05 L 193.84 148.16 A 62 62 0 0 0 106.16 148.16 Z"/>
  <path id="rightButton" class="hit" d="M 193.84 148.16 L 224.95 117.05 A 106 106 0 0 1 224.95 266.95 L 193.84 235.84 A 62 62 0 0 0 193.84 148.16 Z"/>
  <path id="downButton"  class="hit" d="M 193.84 235.84 L 224.95 266.95 A 106 106 0 0 1 75.05 266.95 L 106.16 235.84 A 62 62 0 0 0 193.84 235.84 Z"/>
  <path id="leftButton"  class="hit" d="M 106.16 235.84 L 75.05 266.95 A 106 106 0 0 1 75.05 117.05 L 106.16 148.16 A 62 62 0 0 0 106.16 235.84 Z"/>
  <circle id="selectButton" class="hit" cx="150" cy="192" r="62"/>

  <!-- ===================== BACK ===================== -->
  <g pointer-events="none">
    <g transform="translate(92,353)">
      <circle r="40.5" fill="url(#btn)"/>
      <path d="M 7 -15 L -11 0 L 7 15" fill="none" stroke="#e9e9ea" stroke-width="4.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <circle id="backButton" class="hit" cx="92" cy="353" r="44"/>

  <!-- ===================== TV / HOME ===================== -->
  <g pointer-events="none">
    <g transform="translate(205,353)">
      <circle r="40.5" fill="url(#btn)"/>
      <rect x="-16" y="-13" width="32" height="22" rx="4.5" fill="none" stroke="#e9e9ea" stroke-width="4"/>
      <line x1="-7" y1="15" x2="7" y2="15" stroke="#e9e9ea" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
  <circle id="tvButton" class="hit" cx="205" cy="353" r="44"/>

  <!-- ===================== PLAY / PAUSE ===================== -->
  <g pointer-events="none">
    <g transform="translate(92,452)">
      <circle r="40.5" fill="url(#btn)"/>
      <g transform="translate(-4,0)">
        <path d="M -12 -12 L -12 12 L 6 0 Z" fill="#e9e9ea"/>
        <rect x="9" y="-12" width="4.2" height="24" rx="1.6" fill="#e9e9ea"/>
        <rect x="16.5" y="-12" width="4.2" height="24" rx="1.6" fill="#e9e9ea"/>
      </g>
    </g>
  </g>
  <circle id="playPauseButton" class="hit" cx="92" cy="452" r="44"/>

  <!-- ===================== MUTE ===================== -->
  <g pointer-events="none">
    <g transform="translate(92,551)">
      <circle r="40.5" fill="url(#btn)"/>
      <g transform="translate(2,0)">
        <path transform="translate(6.5,0)" d="M -18 -6 L -9 -6 L 1 -14 L 1 14 L -9 6 L -18 6 Z" fill="#e9e9ea"/>
        <line x1="-16" y1="-13" x2="14" y2="13" stroke="#e9e9ea" stroke-width="3.4" stroke-linecap="round"/>
      </g>
    </g>
  </g>
  <circle id="muteButton" class="hit" cx="92" cy="551" r="44"/>

  <!-- ===================== VOLUME ROCKER ===================== -->
  <g pointer-events="none">
    <g transform="translate(206,502)">
      <rect x="-33" y="-58" width="66" height="116" rx="33" fill="url(#btnPill)"/>
      <g transform="translate(0,-29)" stroke="#e9e9ea" stroke-width="4.4" stroke-linecap="round">
        <line x1="-11" y1="0" x2="11" y2="0"/>
        <line x1="0" y1="-11" x2="0" y2="11"/>
      </g>
      <line x1="-11" y1="29" x2="11" y2="29" stroke="#e9e9ea" stroke-width="4.4" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Volume split into two tappable halves -->
  <path id="volumeUpButton"   class="hit" d="M 173 502 L 173 477 A 33 33 0 0 1 239 477 L 239 502 Z"/>
  <path id="volumeDownButton" class="hit" d="M 173 502 L 173 527 A 33 33 0 0 0 239 527 L 239 502 Z"/>
</svg>
