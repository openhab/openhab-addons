# thing actions

action.getIdlePeriods.label = Get Idle Periods
action.getIdlePeriods.description = Reads the idle periods of the battery, one per line as name:days:mode:active:hh:mm-hh:mm.
action.setIdlePeriods.label = Set Idle Periods
action.setIdlePeriods.description = Replaces the whole list of idle periods of the battery and returns whether the device accepted it.
action.setIdlePeriods.periods.label = Periods
action.setIdlePeriods.periods.description = All periods, one per line as name:days:mode:active:hh:mm-hh:mm. An empty text removes all periods.
action.deleteIdlePeriod.label = Delete Idle Period
action.deleteIdlePeriod.description = Removes the idle period of the given name, keeps all others and returns whether the device accepted the change.
action.deleteIdlePeriod.name.label = Name
action.deleteIdlePeriod.name.description = The name of the idle period to remove.
action.setPowerMode.label = Set Power Mode
action.setPowerMode.description = Forces a battery mode for a number of poll cycles and returns whether the device accepted it.
action.setPowerMode.mode.label = Mode
action.setPowerMode.mode.description = auto, idle, charge, discharge or grid_charge.
action.setPowerMode.watts.label = Watts
action.setPowerMode.watts.description = Power for charge, discharge and grid_charge, ignored otherwise.
action.setPowerMode.cycles.label = Cycles
action.setPowerMode.cycles.description = Number of poll cycles the mode is held, ignored for auto.
action.fetchHistory.label = Fetch History
action.fetchHistory.description = Reads the yearly history of earlier years once and publishes it as time series on the year channels. Returns the number of years that had data, or -1 if the request was not valid or the device is not connected.
action.fetchPeriodHistory.label = Fetch Period History
action.fetchPeriodHistory.description = Reads the history of finished days, weeks, months or years once and publishes it as time series on the matching history channels. Returns the number of periods that had data, or -1 if the arguments were not valid or the device is not connected.
action.fetchPeriodHistory.period.label = Period
action.fetchPeriodHistory.period.description = day, week (Monday to Sunday), month or year.
action.fetchPeriodHistory.count.label = Count
action.fetchPeriodHistory.count.description = How many finished periods to go back, 1 to 400.
