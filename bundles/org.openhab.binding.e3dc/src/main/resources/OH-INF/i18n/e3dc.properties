# thing actions

action.getIdlePeriods.label = Get Idle Periods
action.getIdlePeriods.description = Reads the idle periods of the battery, one per line as name:days:mode:active:hh:mm-hh:mm.
action.setIdlePeriods.label = Set Idle Periods
action.setIdlePeriods.description = Replaces the whole list of idle periods of the battery and returns whether the device accepted it.
action.setIdlePeriods.periods.label = Periods
action.setIdlePeriods.periods.description = All periods, one per line as name:days:mode:active:hh:mm-hh:mm. An empty text removes all periods.
action.fetchHistory.label = Fetch History
action.fetchHistory.description = Reads the yearly history of earlier years once and publishes it as time series on the year channels. Returns the number of years that had data, or -1 if the request was not valid or the device is not connected.
action.fetchHistory.fromYear.label = From Year
action.fetchHistory.fromYear.description = First year to fetch, 2000 or later.
action.fetchHistory.toYear.label = To Year
action.fetchHistory.toYear.description = Last year to fetch, at most the year before the running one.
action.fetchAllHistory.label = Fetch All History
action.fetchAllHistory.description = Reads the yearly history from the configured history start year to the last completed year once and publishes it as time series. Returns the number of years that had data, or -1 if no start year is set or the device is not connected.
channel-group-type.e3dc.statistics-group.label = Statistics
channel-group-type.e3dc.statistics-group.description = Figures about the load the connection puts on the device
channel-type.e3dc.statistics-loop-ratio.label = Loop Ratio
channel-type.e3dc.statistics-loop-ratio.description = Time the device was occupied by this connection during the last poll, in percent of the refresh interval
channel-type.e3dc.statistics-loop-ratio-average.label = Loop Ratio Average
channel-type.e3dc.statistics-loop-ratio-average.description = Average loop ratio over the last 20 polls
channel-type.e3dc.statistics-loop-ratio-peak.label = Loop Ratio Peak
channel-type.e3dc.statistics-loop-ratio-peak.description = Highest loop ratio of the last 20 polls
channel-type.e3dc.statistics-poll-duration.label = Poll Duration
channel-type.e3dc.statistics-poll-duration.description = Time the last request spent on the wire, from sending to the complete answer
channel-type.e3dc.statistics-device-wait.label = Device Wait
channel-type.e3dc.statistics-device-wait.description = Time the device needed to start its answer to the last request
channel-type.e3dc.statistics-dispatch-time.label = Dispatch Time
channel-type.e3dc.statistics-dispatch-time.description = Time openHAB needed to hand the answer of the last poll to the things
channel-type.e3dc.statistics-answer-size.label = Answer Size
channel-type.e3dc.statistics-answer-size.description = Size of the answer to the last request
