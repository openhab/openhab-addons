# add-on

addon.chatgpt.name = ChatGPT Binding
addon.chatgpt.description = Integrates with OpenAI API-compatible AI services for AI-powered chat and smart home control.

# thing types

thing-type.chatgpt.account.label = OpenAI Account
thing-type.chatgpt.account.description = Account at OpenAI that is used for accessing the ChatGPT API.

# thing types config

thing-type.config.chatgpt.account.apiKey.label = API Key
thing-type.config.chatgpt.account.apiKey.description = API key to access the account
thing-type.config.chatgpt.account.baseUrl.label = API Base URL
thing-type.config.chatgpt.account.baseUrl.description = The base URL of the OpenAI API-compatible service.
thing-type.config.chatgpt.account.baseUrl.option.https\://api.anthropic.com/v1 = Anthropic
thing-type.config.chatgpt.account.baseUrl.option.https\://api.deepseek.com = DeepSeek
thing-type.config.chatgpt.account.baseUrl.option.https\://api.llmbase.ai/v1 = LLMBase
thing-type.config.chatgpt.account.baseUrl.option.https\://api.mistral.ai/v1 = Mistral
thing-type.config.chatgpt.account.baseUrl.option.https\://api.openai.com/v1 = OpenAI
thing-type.config.chatgpt.account.baseUrl.option.https\://openrouter.ai/api/v1 = OpenRouter
thing-type.config.chatgpt.account.baseUrl.option.https\://api.x.ai = SpaceXAI
thing-type.config.chatgpt.account.group.authentication.label = Authentication & API
thing-type.config.chatgpt.account.group.connection.label = Connection
thing-type.config.chatgpt.account.group.hli.label = HLI Configuration
thing-type.config.chatgpt.account.group.hli.description = Configures the used model and its behavior. Applies to the Human Language Interpreter and as a default for all channels.
thing-type.config.chatgpt.account.maxModelTurns.label = Maximum Model Turns
thing-type.config.chatgpt.account.maxModelTurns.description = The maximum number of interaction turns with the model allowed in a single request to prevent infinite loops and excess resource usage.
thing-type.config.chatgpt.account.maxTokens.label = Max Tokens
thing-type.config.chatgpt.account.maxTokens.description = The maximum number of tokens that can be generated in the chat completion.
thing-type.config.chatgpt.account.model.label = Model
thing-type.config.chatgpt.account.model.description = ID of the model to use.
thing-type.config.chatgpt.account.reasoningEffort.label = Reasoning Effort
thing-type.config.chatgpt.account.reasoningEffort.description = Controls effort on reasoning for reasoning models. Higher values result in more reasoning tokens and higher latency before returning a response.
thing-type.config.chatgpt.account.reasoningEffort.option.none = None
thing-type.config.chatgpt.account.reasoningEffort.option.low = Low
thing-type.config.chatgpt.account.reasoningEffort.option.medium = Medium
thing-type.config.chatgpt.account.reasoningEffort.option.high = High
thing-type.config.chatgpt.account.reasoningEffort.option.xhigh = Extra High
thing-type.config.chatgpt.account.reasoningEffort.option.max = Max
thing-type.config.chatgpt.account.requestTimeout.label = Request Timeout
thing-type.config.chatgpt.account.requestTimeout.description = Timeout in seconds for chat API requests. Used as default for all channels.
thing-type.config.chatgpt.account.temperature.label = Temperature
thing-type.config.chatgpt.account.temperature.description = What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
thing-type.config.chatgpt.account.topP.label = TopP
thing-type.config.chatgpt.account.topP.description = An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered. We generally recommend altering this or temperature but not both.

