# add-on

addon.millheat.name = Millheat Binding
addon.millheat.description = This is the binding for Mill Heat Wi-Fi enabled heaters, using the Mill cloud service. See https://www.millheat.com/mill-wifi/

# thing types

thing-type.millheat.account.label = Mill Heating API
thing-type.millheat.account.description = This bridge represents the gateway to Mill Heating API
thing-type.millheat.heater.label = Wi-Fi Enabled Heater
thing-type.millheat.home.label = Home
thing-type.millheat.room.label = Room with one or more Wi-Fi enabled heaters

# thing types config

thing-type.config.millheat.account.password.label = Password
thing-type.config.millheat.account.password.description = Your Millheat app password
thing-type.config.millheat.account.refreshInterval.label = Refresh Interval
thing-type.config.millheat.account.refreshInterval.description = Specifies the refresh time in seconds for polling updates from the Mill cloud service. The account is limited to 2500 requests per hour in total, and each cycle costs roughly one request per house plus one per room
thing-type.config.millheat.account.username.label = Username
thing-type.config.millheat.account.username.description = Your Millheat app username (email)
thing-type.config.millheat.heater.heaterId.label = Heater ID
thing-type.config.millheat.heater.heaterId.description = Device UUID as issued by the Mill cloud API. Use auto discovery to find this value; numeric IDs from older configurations are not valid
thing-type.config.millheat.heater.macAddress.label = MAC Address
thing-type.config.millheat.heater.macAddress.description = Either MAC address or heaterId is required
thing-type.config.millheat.heater.power.label = Heating Power
thing-type.config.millheat.heater.power.description = No longer used. The Mill cloud API reports measured power directly, so the Energy Usage channel no longer needs a nominal value
thing-type.config.millheat.home.homeId.label = Home ID
thing-type.config.millheat.home.homeId.description = House UUID as issued by the Mill cloud API. Use auto discovery to find this value; numeric IDs from older configurations are not valid
thing-type.config.millheat.room.roomId.label = Room ID
thing-type.config.millheat.room.roomId.description = Room UUID as issued by the Mill cloud API. Use auto discovery to find this value; numeric IDs from older configurations are not valid

