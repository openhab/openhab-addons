# thing types config

thing-type.config.mqtt.awtrix-app.appname.label = App Name
thing-type.config.mqtt.awtrix-app.appname.description = Name of the app
thing-type.config.mqtt.awtrix-app.useButtons.label = Button Controlled
thing-type.config.mqtt.awtrix-app.useButtons.description = Activate if the app can be controlled by the user. The select button locks on current app and the app will emit subsequent button events until the appLockTimeout of the bridge is reached. Every button press before the timeout will reset timeout.
thing-type.config.mqtt.awtrix-clock.appLockTimeout.label = App Selection Timeout
thing-type.config.mqtt.awtrix-clock.appLockTimeout.description = Timeout in seconds until selected apps return control and the app rotation continues.
thing-type.config.mqtt.awtrix-clock.basetopic.label = Base Topic
thing-type.config.mqtt.awtrix-clock.basetopic.description = Base topic as configured in the Awtrix Light device.
thing-type.config.mqtt.awtrix-clock.discoverDefaultApps.label = Discover Built-in Apps
thing-type.config.mqtt.awtrix-clock.discoverDefaultApps.description = Currently changing settings for the built-in default apps is not implemented. It is therefore recommended to ignore them during app discovery.
thing-type.config.mqtt.awtrix-clock.lowBatteryThreshold.label = Low Battery Threshold
thing-type.config.mqtt.awtrix-clock.lowBatteryThreshold.description = Threshold for issuing a low battery warning.
thing-type.config.mqtt.awtrix-ng-app.appname.label = App Name
thing-type.config.mqtt.awtrix-ng-app.appname.description = Name of the app on the clock, 1 to 32 letters, digits, - or _.
thing-type.config.mqtt.awtrix-ng-app.useButtons.label = Button Controlled
thing-type.config.mqtt.awtrix-ng-app.useButtons.description = Activate if the user can control the app with the buttons of the clock. The select button locks the clock on the app, and the app then reports the buttons until the app selection timeout of the clock thing has passed. Every button press restarts the timeout.
thing-type.config.mqtt.awtrix-ng-clock.appLockTimeout.label = App Selection Timeout
thing-type.config.mqtt.awtrix-ng-clock.appLockTimeout.description = Timeout until a selected app returns control and the app rotation continues.
thing-type.config.mqtt.awtrix-ng-clock.basetopic.label = Base Topic
thing-type.config.mqtt.awtrix-ng-clock.basetopic.description = MQTT prefix of the clock, as shown in its MQTT settings. By default this is the 12 character MAC address of the clock.
thing-type.config.mqtt.awtrix-ng-clock.discoverDefaultApps.label = Discover Built-in Apps
thing-type.config.mqtt.awtrix-ng-clock.discoverDefaultApps.description = Also offer the built-in apps of the clock (Time, Date, Temperature, Humidity, Battery). Their look is set with the settings channels of the clock, and an app created for one of them would be pushed under the same name.

