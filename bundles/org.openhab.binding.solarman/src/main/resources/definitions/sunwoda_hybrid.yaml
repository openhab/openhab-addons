      - name: "Daily Consumption"
        class: "energy"
        state_class: "measurement"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x002A, 0x0029]

      - name: "Total Consumption"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x002C, 0x002B]

  - group: Inverter
    items:
      - name: "Active Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x014A]

      - name: "Reactive Power"
        class: "reactive_power"
        state_class: "measurement"
        uom: "var"
        scale: 1
        rule: 2
        registers: [0x014B]

      - name: "Apparent Power"
        class: "apparent_power"
        state_class: "measurement"
        uom: "VA"
        scale: 1
        rule: 2
        registers: [0x014C]

      - name: "L1 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
