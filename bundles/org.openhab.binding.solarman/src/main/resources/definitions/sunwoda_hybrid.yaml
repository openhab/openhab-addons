# Sunwoda hybrid three-phase inverter (tested: SW10KH3UT) via Solarman LSW-5 stick
# Register map reverse-engineered 2026-10-23 by correlating local reads with Solarman cloud data.
# All values are input registers (function code 0x04).

requests:
  - start: 0x000D
    end: 0x0038
    mb_functioncode: 0x04
  - start: 0x0053
    end: 0x005D
    mb_functioncode: 0x04
  - start: 0x0138
    end: 0x0198
    mb_functioncode: 0x04
  - start: 0x01A4
    end: 0x01AE
    mb_functioncode: 0x04
  - start: 0x0262
    end: 0x0264
    mb_functioncode: 0x04

parameters:
  - group: Solar
    items:
      - name: "PV1 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0181]

      - name: "PV1 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0182]

      - name: "PV1 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x0183]

      - name: "PV2 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0184]

      - name: "PV2 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0185]

      - name: "PV2 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 1
        registers: [0x0186]

      - name: "Daily Production"
        class: "energy"
        state_class: "measurement"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x000E, 0x000D]

      - name: "Total Production"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0010, 0x000F]

  - group: Battery
    items:
      - name: "SOC"
        class: "battery"
        state_class: "measurement"
        uom: "%"
        scale: 1
        rule: 1
        registers: [0x01A6]

      - name: "Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x01A4]

      - name: "Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x01AC]

      - name: "Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x01AE]

      - name: "BMS Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0262]

      - name: "BMS SOC"
        class: "battery"
        state_class: "measurement"
        uom: "%"
        scale: 1
        rule: 1
        registers: [0x0263]

      - name: "BMS SOH"
        class: "battery"
        state_class: "measurement"
        uom: "%"
        scale: 1
        rule: 1
        registers: [0x0264]

      - name: "Daily Charge"
        class: "energy"
        state_class: "measurement"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0032, 0x0031]

      - name: "Total Charge"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0034, 0x0033]

      - name: "Daily Discharge"
        class: "energy"
        state_class: "measurement"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0036, 0x0035]

      - name: "Total Discharge"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0038, 0x0037]

  - group: Grid
    items:
      - name: "L1 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0162]

      - name: "L2 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0163]

      - name: "L3 Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
        rule: 1
        registers: [0x0164]

      - name: "L1 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0153]

      - name: "L2 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
