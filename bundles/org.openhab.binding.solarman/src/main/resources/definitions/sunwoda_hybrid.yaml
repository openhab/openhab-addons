      - name: "DC Event Code"
        class: ""
        state_class: ""
        uom: ""
        scale: 1
        rule: 1
        registers: [0x0167]

      - name: "EMS Event Code"
        class: ""
        state_class: ""
        uom: ""
        scale: 1
        rule: 1
        registers: [0x005D]
