      - name: "L3 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0155]

      - name: "L1 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0156]

      - name: "L2 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0157]

      - name: "L3 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0158]

      - name: "Total Reactive Power"
        class: "reactive_power"
        state_class: "measurement"
        uom: "var"
        scale: 1
        rule: 2
        registers: [0x0160]

      - name: "Total Apparent Power"
        class: "apparent_power"
        state_class: "measurement"
        uom: "VA"
        scale: 1
        rule: 2
        registers: [0x0161]

      - name: "Frequency"
        class: "frequency"
        state_class: "measurement"
        uom: "Hz"
        scale: 0.01
        rule: 1
        registers: [0x013B]

      - name: "Daily Energy Exported"
        class: "energy"
        state_class: "measurement"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0022, 0x0021]

      - name: "Total Energy Exported"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0024, 0x0023]

      - name: "Daily Energy Imported"
        class: "energy"
        state_class: "measurement"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0026, 0x0025]

      - name: "Total Energy Imported"
        class: "energy"
        state_class: "total_increasing"
        uom: "kWh"
        scale: 0.1
        rule: 3
        registers: [0x0028, 0x0027]

  - group: Load
    items:
      - name: "Total Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0198]

      - name: "L1 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x016B]

      - name: "L2 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x016C]

      - name: "L3 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x016D]

      - name: "L1 Current"
        class: "current"
        state_class: "measurement"
        uom: "A"
        scale: 0.1
        rule: 1
        registers: [0x0168]

      - name: "L2 Current"
        class: "current"
