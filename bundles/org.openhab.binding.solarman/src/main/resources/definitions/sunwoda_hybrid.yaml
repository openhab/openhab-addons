      - name: "L1 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0141]

      - name: "L2 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0142]

      - name: "L3 Power"
        class: "power"
        state_class: "measurement"
        uom: "W"
        scale: 1
        rule: 2
        registers: [0x0143]

      - name: "DC Bus Positive Voltage"
        class: "voltage"
        state_class: "measurement"
        uom: "V"
        scale: 0.1
