# add-on

addon.yioremote.name = YIOremote Binding
addon.yioremote.description = This is the binding for YIOremote.

# thing types

thing-type.yioremote.yioRemoteDock.label = YIO Remote Dock
thing-type.yioremote.yioRemoteDock.description = YIO Remote Dock thing

# thing types config

thing-type.config.yioremote.yioRemoteDock.accessToken.label = Access Token
thing-type.config.yioremote.yioRemoteDock.accessToken.description = Authentication token of the YIO Dock. The original dock firmware uses 0, docks with an individual token show it on their web page (http://dock-ip/).
thing-type.config.yioremote.yioRemoteDock.host.label = Network Address
thing-type.config.yioremote.yioRemoteDock.host.description = Network address of the YIO Remote Dock.

# channel group types

channel-group-type.yioremote.input.label = Inputs
channel-group-type.yioremote.input.description = Channels used for input
channel-group-type.yioremote.output.label = Outputs
channel-group-type.yioremote.output.description = Channels used for output

# channel types

channel-type.yioremote.receiverswitch.label = Receiver Switch
channel-type.yioremote.receiverswitch.description = Enable/disable the IR receiver diode/function.
channel-type.yioremote.status.label = Status
channel-type.yioremote.status.description = Status of the YIO Dock. If the receiver is on, the recognized IR code is displayed; otherwise the send status of the last IR code is displayed.

# thing actions

action.sendIRCode.label = Send IR Code
action.sendIRCode.description = Sends an IR code via the YIO Remote Dock.
action.sendIRCode.IRCode.label = IR Code
action.sendIRCode.IRCode.description = The IR code to send, e.g. 3;0x20DF40BF;32;0

# thing status descriptions

offline.conf-error-no-host = The network address of the YIO Dock is not configured.
offline.conf-error-invalid-host = The network address {0} is not valid.
offline.conf-error-authentication-failed = The YIO Dock rejected the access token: {0}
offline.comm-error-connection-failed = Could not connect to the YIO Dock: {0}
offline.comm-error-connection-closed = The connection to the YIO Dock was closed.
offline.comm-error-no-authentication = The YIO Dock did not complete the authentication in time.
offline.comm-error-no-response = The YIO Dock did not answer the heartbeat.
