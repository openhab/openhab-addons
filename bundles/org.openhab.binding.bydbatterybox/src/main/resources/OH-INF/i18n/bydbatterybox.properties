# thing status descriptions

offline.no-hostname = No hostname configured.
offline.invalid-interval = Invalid interval or timeout configured.
offline.unreachable = The battery cannot be reached.
offline.busy = The battery rejected the connection. Another client (BYD app, Be Connect) is probably connected.
offline.timeout = The battery did not answer in time.
offline.not-ready = The battery is busy and did not provide data.
offline.protocol = The battery sent an invalid reply.

