# thing types config

thing-type.config.bydbatterybox.hv-premium.connectionTimeout.label = Connection Timeout
thing-type.config.bydbatterybox.hv-premium.connectionTimeout.description = Seconds to wait for the battery to connect and to answer.
thing-type.config.bydbatterybox.hv-premium.detailInterval.label = Cell Detail Interval
thing-type.config.bydbatterybox.hv-premium.detailInterval.description = Seconds between two measurements of the cell voltages and temperatures. 0 turns them off. Rounded up to a multiple of the refresh interval.
thing-type.config.bydbatterybox.hv-premium.eventLogInterval.label = Event Log Interval
thing-type.config.bydbatterybox.hv-premium.eventLogInterval.description = Seconds between two readings of the event logs, at least 150. 0 turns them off. Rounded up to a multiple of the refresh interval.
thing-type.config.bydbatterybox.hv-premium.hostname.label = Hostname
thing-type.config.bydbatterybox.hv-premium.hostname.description = Hostname or IP address of the battery, or of the forwarding host.
thing-type.config.bydbatterybox.hv-premium.port.label = Port
thing-type.config.bydbatterybox.hv-premium.port.description = Port of the battery.
thing-type.config.bydbatterybox.hv-premium.readExtendedCells.label = Read Cells 129-160
thing-type.config.bydbatterybox.hv-premium.readExtendedCells.description = Also reads cells 129-160 of towers with 5 modules, using a second measurement of about 3 seconds per tower. Without it, these cells are reported as undefined.
thing-type.config.bydbatterybox.hv-premium.refreshInterval.label = Refresh Interval
thing-type.config.bydbatterybox.hv-premium.refreshInterval.description = Seconds between two status readings.

