# add-on

addon.bydbatterybox.name = BYD Battery-Box Binding
addon.bydbatterybox.description = This is the binding for the BYD Battery-Box Premium HVS/HVM home batteries. It reads status, cell voltages, cell temperatures and event logs over the local network interface.

