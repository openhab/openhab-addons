# thing status descriptions

offline.conf-error.incomplete = Client ID, client secret, API key and redirect URI must be configured.
offline.authorization-pending = Open the page {0} of your openHAB server (e.g. http://openhab:8080{0}) to authorize openHAB to access your Volvo account.
offline.conf-error.no-vin = The VIN of the vehicle must be configured.
offline.conf-error.invalid-refresh-interval = The refresh interval must be at least 1 minute and must not exceed the maintenance refresh interval.
offline.conf-error.unknown-vin = The vehicle is not connected to the Volvo account or access to it was not granted.
