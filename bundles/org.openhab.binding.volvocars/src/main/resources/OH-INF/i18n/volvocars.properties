# add-on

addon.volvocars.name = Volvo Cars Binding
addon.volvocars.description = This binding integrates Volvo cars using the official Volvo Cars Connected Vehicle, Energy and Location APIs.

# thing types

thing-type.volvocars.account.label = Volvo Cars Account
thing-type.volvocars.account.description = Volvo ID account accessed through an application registered on the Volvo Cars developer portal
thing-type.volvocars.vehicle.label = Volvo Vehicle
thing-type.volvocars.vehicle.description = A vehicle connected to the Volvo ID account

# thing types config

thing-type.config.volvocars.account.clientId.label = Client ID
thing-type.config.volvocars.account.clientId.description = Client ID of the application registered on the Volvo Cars developer portal.
thing-type.config.volvocars.account.clientSecret.label = Client Secret
thing-type.config.volvocars.account.clientSecret.description = Client secret of the application registered on the Volvo Cars developer portal.
thing-type.config.volvocars.account.apiKey.label = API Key
thing-type.config.volvocars.account.apiKey.description = VCC API key of the application, sent as vcc-api-key header with every request.
thing-type.config.volvocars.account.redirectUri.label = Redirect URI
thing-type.config.volvocars.account.redirectUri.description = Redirect URI exactly as registered for the application, e.g. http://openhab:8080/volvocars.
thing-type.config.volvocars.account.scopes.label = Scopes
thing-type.config.volvocars.account.scopes.description = Space separated list of OAuth scopes to request. Leave empty to request all scopes supported by the binding. Only request scopes that are enabled for the application.
thing-type.config.volvocars.vehicle.vin.label = VIN
thing-type.config.volvocars.vehicle.vin.description = Vehicle Identification Number of the vehicle.
thing-type.config.volvocars.vehicle.refreshInterval.label = Refresh Interval
thing-type.config.volvocars.vehicle.refreshInterval.description = Interval in minutes to refresh doors, windows, engine, fuel, battery, trip and location data.
thing-type.config.volvocars.vehicle.slowRefreshInterval.label = Maintenance Refresh Interval
thing-type.config.volvocars.vehicle.slowRefreshInterval.description = Interval in minutes to refresh rarely changing maintenance data like service and warning information. Must not be shorter than the refresh interval.
thing-type.config.volvocars.vehicle.engineRunTime.label = Engine Run Time
thing-type.config.volvocars.vehicle.engineRunTime.description = Duration in minutes the engine keeps running after a remote start.

