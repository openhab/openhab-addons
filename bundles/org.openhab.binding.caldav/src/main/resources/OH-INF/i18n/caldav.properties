# Sync channels and values
channel-type.caldav.last-sync.label = Last Synchronization
channel-type.caldav.last-sync.description = Time of the last complete successful synchronization.
channel-type.caldav.sync-status.label = Synchronization Status
channel-type.caldav.sync-status.description = Current synchronization status of the calendar.
