thing-type.config.caldav.calendar.rangeEndOffset.label = End Offset
thing-type.config.caldav.calendar.rangeEndOffset.description = Offset defining the last included day of the output range.
thing-type.config.caldav.calendar.rangeStartOffset.label = Start Offset
thing-type.config.caldav.calendar.rangeStartOffset.description = Offset at which the output range begins. Negative values select past days.

