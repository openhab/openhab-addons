channel-type.caldav.current-uid.label = Current Event UID
channel-type.caldav.current-uid.description = UID of the currently active event.
channel-type.caldav.current-title.label = Current Event Title
channel-type.caldav.current-title.description = Title of the currently active event.
channel-type.caldav.current-description.label = Current Event Description
channel-type.caldav.current-description.description = Description of the currently active event.
channel-type.caldav.current-location.label = Current Event Location
channel-type.caldav.current-location.description = Location of the currently active event.
channel-type.caldav.current-start.label = Current Event Start
channel-type.caldav.current-start.description = Start time of the currently active event.
channel-type.caldav.current-end.label = Current Event End
channel-type.caldav.current-end.description = End time of the currently active event.
channel-type.caldav.current-all-day.label = Current Event All Day
channel-type.caldav.current-all-day.description = Indicates whether the currently active event is an all-day event.
channel-type.caldav.current-organizer.label = Current Event Organizer
channel-type.caldav.current-organizer.description = Organizer of the currently active event.
channel-type.caldav.current-categories.label = Current Event Categories
channel-type.caldav.current-categories.description = Categories of the currently active event.

