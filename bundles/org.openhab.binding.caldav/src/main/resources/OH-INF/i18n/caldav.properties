# add-on

addon.caldav.name = CalDAV Binding
addon.caldav.description = Connects openHAB directly to CalDAV servers and exposes calendar events from configurable time ranges.

# thing types

thing-type.caldav.account.label = CalDAV Account
thing-type.caldav.account.description = Connects to a CalDAV server, discovers available calendar collections and manages synchronization.
thing-type.caldav.calendar.label = CalDAV Calendar
thing-type.caldav.calendar.description = Represents one CalDAV calendar collection and provides event instances from the configured time range.

