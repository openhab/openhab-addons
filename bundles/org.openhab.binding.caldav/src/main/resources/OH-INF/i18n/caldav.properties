thing-type.config.caldav.account.url.label = CalDAV URL
thing-type.config.caldav.account.url.description = Starting URL for CalDAV discovery. Its meaning depends on the selected discovery mode.
thing-type.config.caldav.account.username.label = Username
thing-type.config.caldav.account.username.description = Optional username used to authenticate with the CalDAV server.
thing-type.config.caldav.account.verifyCertificate.label = Verify Certificate
thing-type.config.caldav.account.verifyCertificate.description = Verifies the TLS certificate of the CalDAV server. Disabling this is not recommended.
