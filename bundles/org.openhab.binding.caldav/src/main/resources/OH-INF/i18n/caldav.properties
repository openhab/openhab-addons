# Add-on
addon.caldav.name = CalDAV Binding
addon.caldav.description = Connects openHAB directly to CalDAV servers and exposes calendar events from configurable time ranges.

# Thing types
thing-type.caldav.account.label = CalDAV Account
thing-type.caldav.account.description = Connects to a CalDAV server, discovers available calendar collections and manages synchronization.
thing-type.caldav.calendar.label = CalDAV Calendar
thing-type.caldav.calendar.description = Represents one CalDAV calendar collection and provides event instances from the configured time range.

# Config groups
config.group.connection.label = Connection
config.group.connection.description = Connection and authentication settings.
config.group.discovery.label = Discovery
config.group.discovery.description = Calendar discovery settings.
config.group.synchronization.label = Synchronization
config.group.synchronization.description = Synchronization frequency and local synchronization range.
config.group.advanced.label = Advanced
config.group.advanced.description = Advanced options.
config.group.calendar.label = Calendar
config.group.calendar.description = Calendar collection settings.
config.group.range.label = Time Range
config.group.range.description = Defines which event instances are exposed by the calendar thing.

# Account config
config.account.url.label = CalDAV URL
config.account.url.description = CalDAV service endpoint for AUTO discovery, or the collection URL to scan directly in DIRECT mode.
config.account.username.label = Username
config.account.username.description = Optional username used to authenticate with the CalDAV server.
config.account.password.label = Password
config.account.password.description = Optional password or application password used to authenticate with the CalDAV server.
config.account.authType.label = Authentication
config.account.authType.description = Authentication method used for the CalDAV server.
config.account.authType.option.AUTO = Automatic
config.account.authType.option.BASIC = Basic Authentication
config.account.authType.option.DIGEST = Digest Authentication
config.account.requestTimeout.label = Request Timeout
config.account.requestTimeout.description = Maximum time in seconds to wait for a server response.
config.account.verifyCertificate.label = Verify Certificate
config.account.verifyCertificate.description = Verifies the TLS certificate of the CalDAV server. Disabling this is not recommended.
config.account.discoveryMode.label = Discovery Mode
config.account.discoveryMode.description = AUTO resolves the current-user-principal and calendar-home-set properties; DIRECT lists Calendar Collections directly at the configured URL.
config.account.discoveryMode.option.AUTO = Automatic
config.account.discoveryMode.option.DIRECT = Direct
config.account.refreshInterval.label = Refresh Interval
config.account.refreshInterval.description = Interval in seconds between synchronization checks.
config.account.syncMode.label = Synchronization Mode
config.account.syncMode.description = Selects the synchronization method. Automatic mode chooses the best method supported by the server.
config.account.syncMode.option.AUTO = Automatic
config.account.syncMode.option.SYNC_TOKEN = Sync Token
config.account.syncMode.option.ETAG = ETag
config.account.syncMode.option.FULL = Full Synchronization
config.account.maxPastDays.label = Past Sync Days
config.account.maxPastDays.description = Number of past days retained in the local synchronization window.
config.account.maxFutureDays.label = Future Sync Days
config.account.maxFutureDays.description = Number of future days retained in the local synchronization window.
config.account.readOnly.label = Read Only
config.account.readOnly.description = Must remain enabled. Calendar modifications are not supported.

# Calendar config
config.calendar.path.label = Calendar Path
config.calendar.path.description = Path or URL of the CalDAV calendar collection.
config.calendar.rangeAnchor.label = Range Reference
config.calendar.rangeAnchor.description = Defines whether offsets are calculated from the start of the current day or from the current time.
config.calendar.rangeAnchor.option.TODAY = Today
config.calendar.rangeAnchor.option.NOW = Current Time
config.calendar.rangeStartOffset.label = Start Offset
config.calendar.rangeStartOffset.description = Offset at which the output range begins. Negative values select past days.
config.calendar.rangeEndOffset.label = End Offset
config.calendar.rangeEndOffset.description = Offset defining the last included day of the output range.
config.calendar.maxEvents.label = Maximum Events
config.calendar.maxEvents.description = Maximum number of event instances exposed for the configured time range.
config.calendar.includeCancelled.label = Include Cancelled Events
config.calendar.includeCancelled.description = Includes cancelled events in the output.

# Channel groups
channel-group-type.caldav.events.label = Events
channel-group-type.caldav.events.description = All events and effective range information.
channel-group-type.caldav.current.label = Current Event
channel-group-type.caldav.current.description = Information about the currently active event.
channel-group-type.caldav.next.label = Next Event
channel-group-type.caldav.next.description = Information about the next event.
channel-group-type.caldav.sync.label = Synchronization
channel-group-type.caldav.sync.description = Synchronization state and diagnostics.

# Events channels
channel-type.caldav.events-json.label = Calendar Events
channel-type.caldav.events-json.description = All event instances within the configured time range as a JSON array.
channel-type.caldav.event-count.label = Event Count
channel-type.caldav.event-count.description = Number of event instances within the configured time range.
channel-type.caldav.range-start.label = Range Start
channel-type.caldav.range-start.description = Effective start of the current output range.
channel-type.caldav.range-end.label = Range End
channel-type.caldav.range-end.description = Exclusive end of the current output range.
channel-type.caldav.events-truncated.label = Event List Truncated
channel-type.caldav.events-truncated.description = Indicates whether additional event instances were omitted because the configured maximum event count was reached.

