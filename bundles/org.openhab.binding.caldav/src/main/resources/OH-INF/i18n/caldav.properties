# Runtime status / error texts
offline.authentication = Authentication with the CalDAV server failed.
offline.communication = The CalDAV server is currently not reachable.
offline.configuration = The CalDAV configuration is invalid.
offline.calendar-not-found = The configured calendar collection could not be found.
offline.invalid-response = The CalDAV server returned an invalid or unsupported response.
error.sync-token-invalid = The synchronization token is no longer valid. A full synchronization will be performed.
