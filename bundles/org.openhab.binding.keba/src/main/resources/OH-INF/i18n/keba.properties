thing-type.config.keba.kecontact.ipAddress.label = Wallbox Network Address
thing-type.config.keba.kecontact.ipAddress.description = IP address or hostname of the wallbox, shared by Modbus TCP, UDP and REST
thing-type.config.keba.kecontact.modbusEnabled.label = Enable Modbus TCP
thing-type.config.keba.kecontact.modbusEnabled.description = Use Modbus TCP for measurements and commands when supported by the wallbox
thing-type.config.keba.kecontact.modbusIpAddress.label = Modbus Proxy Network Address
thing-type.config.keba.kecontact.modbusIpAddress.description = Optional Modbus proxy address; leave empty to connect directly to the wallbox
thing-type.config.keba.kecontact.password.label = REST Password
thing-type.config.keba.kecontact.password.description = Password required when REST is enabled
thing-type.config.keba.kecontact.port.label = Modbus Port
thing-type.config.keba.kecontact.refreshInterval.label = Fast Refresh Interval
thing-type.config.keba.kecontact.refreshInterval.description = Interval for fast Modbus values and primary UDP or REST operational data
thing-type.config.keba.kecontact.refreshIntervalSlow.label = Slow and Supplemental Refresh Interval
thing-type.config.keba.kecontact.refreshIntervalSlow.description = Interval for slow Modbus values and supplemental UDP or REST data
thing-type.config.keba.kecontact.restEnabled.label = Enable REST
thing-type.config.keba.kecontact.restEnabled.description = Use the authenticated HTTPS REST API when supported by the wallbox
thing-type.config.keba.kecontact.restPort.label = REST HTTPS Port
thing-type.config.keba.kecontact.restPort.description = HTTPS port of the wallbox REST API; the URL uses the common wallbox address
thing-type.config.keba.kecontact.udpDisplayOnly.label = Display Only
thing-type.config.keba.kecontact.udpDisplayOnly.description = Limit UDP to display commands without cyclic reports. Identification and command checks run only when a display command is sent.
thing-type.config.keba.kecontact.udpEnabled.label = Enable UDP
thing-type.config.keba.kecontact.udpEnabled.description = Use UDP for display commands and UDP-only data when supported by the wallbox
thing-type.config.keba.kecontact.unitId.label = Modbus Unit ID
thing-type.config.keba.kecontact.username.label = REST Username
thing-type.config.keba.kecontact.verifyCertificate.label = Verify TLS Certificate
thing-type.config.keba.kecontact.verifyCertificate.description = Verify the REST server certificate and hostname; disable explicitly for a trusted local self-signed wallbox

