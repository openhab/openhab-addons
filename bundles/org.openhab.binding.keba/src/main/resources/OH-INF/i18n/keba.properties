thing-type.config.keba.kecontact.udpIpAddress.label = UDP Network Address
thing-type.config.keba.kecontact.udpIpAddress.description = Direct wallbox address for UDP; leave empty to use the Modbus network address
thing-type.config.keba.kecontact.unitId.label = Modbus Unit ID
thing-type.config.keba.kecontact.username.label = REST Username
thing-type.config.keba.kecontact.verifyCertificate.label = Verify TLS Certificate
thing-type.config.keba.kecontact.verifyCertificate.description = Verify the REST server certificate and hostname; disable explicitly for a trusted local self-signed wallbox

# channel group types

channel-group-type.keba.kecontact-modbus.label = Modbus TCP
channel-group-type.keba.kecontact-modbus.description = Primary Modbus measurements and commands, including derived cable states
channel-group-type.keba.kecontact-modbus.channel.I1.label = Measured Current Phase 1
channel-group-type.keba.kecontact-modbus.channel.I1.description = Actual current drawn by the vehicle on phase 1, measured in amperes; not a current limit or setpoint.
channel-group-type.keba.kecontact-modbus.channel.I2.label = Measured Current Phase 2
channel-group-type.keba.kecontact-modbus.channel.I2.description = Actual current drawn by the vehicle on phase 2, measured in amperes; not a current limit or setpoint.
channel-group-type.keba.kecontact-modbus.channel.I3.label = Measured Current Phase 3
channel-group-type.keba.kecontact-modbus.channel.I3.description = Actual current drawn by the vehicle on phase 3, measured in amperes; not a current limit or setpoint.
channel-group-type.keba.kecontact-modbus.channel.U1.label = Voltage Phase 1
channel-group-type.keba.kecontact-modbus.channel.U1.description = Measured voltage of phase 1, in volts.
channel-group-type.keba.kecontact-modbus.channel.U2.label = Voltage Phase 2
channel-group-type.keba.kecontact-modbus.channel.U2.description = Measured voltage of phase 2, in volts.
channel-group-type.keba.kecontact-modbus.channel.U3.label = Voltage Phase 3
channel-group-type.keba.kecontact-modbus.channel.U3.description = Measured voltage of phase 3, in volts.
channel-group-type.keba.kecontact-modbus.channel.activatefastcharging.label = Activate Fast Charging
channel-group-type.keba.kecontact-modbus.channel.activatefastcharging.description = Send ON to activate fast charging on P40. Removed after a P30 model is identified.
channel-group-type.keba.kecontact-modbus.channel.cablestate.description = Raw charging-cable state from Modbus register 1004. The wallbox, vehicle and locked switches are derived from this value.
channel-group-type.keba.kecontact-modbus.channel.enableduser.description = Enable or disable charging. Commands use Modbus; availability readback comes from REST or UDP when available.
channel-group-type.keba.kecontact-modbus.channel.errorcode.label = Modbus Error Code
channel-group-type.keba.kecontact-modbus.channel.errorcode.description = Raw numeric wallbox error code from Modbus register 1006; zero means no error. Its encoding is different from REST error names and the two UDP error words.
channel-group-type.keba.kecontact-modbus.channel.failsafecurrentsetting.label = Failsafe Current Setting
channel-group-type.keba.kecontact-modbus.channel.failsafecurrentsetting.description = Charging-current limit applied after communication is lost, in amperes. This setting is separate from the normal charging-current setpoint.
channel-group-type.keba.kecontact-modbus.channel.failsafepersist.label = Persist Failsafe Settings
channel-group-type.keba.kecontact-modbus.channel.failsafepersist.description = Send ON to save the active EMS failsafe settings permanently on a P30 wallbox.
channel-group-type.keba.kecontact-modbus.channel.failsafetimeoutsetting.label = Failsafe Timeout Setting
channel-group-type.keba.kecontact-modbus.channel.failsafetimeoutsetting.description = Communication timeout after which the failsafe current is applied, in seconds. This is not the delayed UDP user-current timer.
channel-group-type.keba.kecontact-modbus.channel.fastchargingstatus.description = P40-only raw fast-charging status from Modbus register 1200. Removed after a P30 model is identified.
channel-group-type.keba.kecontact-modbus.channel.locked.description = Whether the charging plug is locked, derived from cable state when Modbus is available.
channel-group-type.keba.kecontact-modbus.channel.maxchargingcurrent.label = Offered Charging Current
channel-group-type.keba.kecontact-modbus.channel.maxchargingcurrent.description = Maximum charging current currently offered to the vehicle, from Modbus register 1100. The vehicle may draw less; I1, I2 and I3 report actual measured current.
channel-group-type.keba.kecontact-modbus.channel.maxsupportedcurrent.label = Hardware Current Limit
channel-group-type.keba.kecontact-modbus.channel.maxsupportedcurrent.description = Maximum current supported by the wallbox hardware, from Modbus register 1110. This is not the user setpoint or the current actually drawn by the vehicle.
channel-group-type.keba.kecontact-modbus.channel.phaseswitchsource.description = Communication source allowed to control phase switching: disabled, OCPP, REST, Modbus or UDP.
channel-group-type.keba.kecontact-modbus.channel.phaseswitchstate.description = Number of phases currently used by charging, normally one or three.
channel-group-type.keba.kecontact-modbus.channel.power.description = Total measured active charging power, in watts.
channel-group-type.keba.kecontact-modbus.channel.powerfactor.description = Measured charging power factor (cos phi), expressed as a percentage.
channel-group-type.keba.kecontact-modbus.channel.sessionconsumption.description = Energy delivered in the current charging session, in watt-hours.
channel-group-type.keba.kecontact-modbus.channel.sessionrfidtag.description = RFID tag used for the last charging session, represented by the hexadecimal Modbus RFID register. Only available when RFID is enabled.
channel-group-type.keba.kecontact-modbus.channel.setchargingcurrent.label = Charging Current Setpoint
channel-group-type.keba.kecontact-modbus.channel.setchargingcurrent.description = Requested charging-current limit sent to Modbus register 5004, in amperes. Use maxchargingcurrent to observe the current offered to the vehicle and I1, I2 and I3 for actual current.
channel-group-type.keba.kecontact-modbus.channel.setenergylimit.description = Energy limit for an already running or the next charging session. Send an energy quantity, for example in watt-hours.
channel-group-type.keba.kecontact-modbus.channel.state.description = Current operational state of the wallbox, read from Modbus register 1000.
channel-group-type.keba.kecontact-modbus.channel.totalconsumption.description = Total energy consumption reported by the wallbox meter, in watt-hours; added up after completed charging sessions.
channel-group-type.keba.kecontact-modbus.channel.triggerphaseswitch.description = Request a phase change: send 0 for one phase or 1 for three phases. This is not the REST toggle command.
channel-group-type.keba.kecontact-modbus.channel.unlockplug.description = Send ON to unlock the charging plug. Charging must be stopped before unlocking.
channel-group-type.keba.kecontact-modbus.channel.vehicle.description = Whether a vehicle is connected, derived from cable state when Modbus is available.
channel-group-type.keba.kecontact-modbus.channel.wallbox.description = Whether the cable is plugged into the wallbox, derived from cable state when Modbus is available.
channel-group-type.keba.kecontact-rest.label = REST API
channel-group-type.keba.kecontact-rest.description = Authenticated REST data and commands not supplied by Modbus
channel-group-type.keba.kecontact-rest.channel.authon.description = Whether charging authorization is enabled, reported by REST authorizationEnabled when available.
channel-group-type.keba.kecontact-rest.channel.dipswitchinterpretation.description = Named DIP-switch settings returned by the REST interpretation endpoint as a JSON object.
channel-group-type.keba.kecontact-rest.channel.dipswitchsettings.description = Raw JSON array of DIP-switch settings reported by REST. Null entries are preserved.
channel-group-type.keba.kecontact-rest.channel.error.label = REST Error Name
channel-group-type.keba.kecontact-rest.channel.error.description = Wallbox errorCode name reported by REST, for example TEMPERATURE_DERATING. This is complementary to, not numerically equivalent to, the Modbus error code.
channel-group-type.keba.kecontact-rest.channel.externalmeter.label = External Meter
channel-group-type.keba.kecontact-rest.channel.externalmeter.description = Whether the wallbox reports an external meter through REST hasExternalMeter; not an external-meter energy reading.
channel-group-type.keba.kecontact-rest.channel.input.label = REST X2 Active
channel-group-type.keba.kecontact-rest.channel.input.description = Raw x2active flag reported by the REST API. This is not assumed to be the UDP X1 enable-input signal; use udp#inputx1 for that physical input.
channel-group-type.keba.kecontact-rest.channel.maxphases.label = Maximum Phases
channel-group-type.keba.kecontact-rest.channel.maxphases.description = Maximum number of charging phases supported by the wallbox, reported by REST maxPhases.
channel-group-type.keba.kecontact-rest.channel.permanentlylocked.description = Enable or disable permanent plug locking through REST. This is a locking policy, not the current physical plug-lock state.
channel-group-type.keba.kecontact-rest.channel.phaseconfiguration.description = Configured phase order reported by REST phaseUsed, rather than just the number of active phases.
channel-group-type.keba.kecontact-rest.channel.reboot.label = Reboot
channel-group-type.keba.kecontact-rest.channel.reboot.description = Send ON to request a wallbox reboot through the REST API.
channel-group-type.keba.kecontact-rest.channel.reserved.label = Reserved
channel-group-type.keba.kecontact-rest.channel.reserved.description = Whether the wallbox has an active reservation, reported by the REST reserved field.
channel-group-type.keba.kecontact-rest.channel.reststate.description = Textual operational state reported by the REST API, for example CHARGING or READY_FOR_CHARGING. This retains REST state names alongside the numeric Modbus state.
channel-group-type.keba.kecontact-rest.channel.session.description = Whether a charging session is currently active, reported by REST sessionActive.
channel-group-type.keba.kecontact-rest.channel.sessionduration.description = Duration of the latest charging session, in seconds, from the REST session endpoint.
channel-group-type.keba.kecontact-rest.channel.sessionstart.description = Start time of the latest charging session returned by the REST session endpoint.
channel-group-type.keba.kecontact-rest.channel.start.label = Start Charging
channel-group-type.keba.kecontact-rest.channel.start.description = Send ON to request that the REST API starts a charging session.
channel-group-type.keba.kecontact-rest.channel.stop.label = Stop Charging
channel-group-type.keba.kecontact-rest.channel.stop.description = Send ON to request that the REST API stops the active charging session.
channel-group-type.keba.kecontact-rest.channel.temperature.description = Internal wallbox temperature from the REST meter data, in degrees Celsius.
channel-group-type.keba.kecontact-rest.channel.unlock.label = Unlock
channel-group-type.keba.kecontact-rest.channel.unlock.description = Send ON to request plug unlocking through the REST API.
channel-group-type.keba.kecontact-udp.label = UDP
channel-group-type.keba.kecontact-udp.description = Display commands and UDP-only wallbox data
channel-group-type.keba.kecontact-udp.channel.authenticate.description = Authenticate and start a charging session using an RFID tag and RFID class already accepted by the wallbox.
channel-group-type.keba.kecontact-udp.channel.authreq.description = Whether authentication is required before a charging session can begin.
channel-group-type.keba.kecontact-udp.channel.backend.description = Whether communication with the charging backend is present.
channel-group-type.keba.kecontact-udp.channel.bootflag.description = Raw UDP setBoot diagnostic value; its semantics are not documented in the UDP Programmer's Guide.
channel-group-type.keba.kecontact-udp.channel.currtimer.label = Delayed User Current Setpoint
channel-group-type.keba.kecontact-udp.channel.currtimer.description = Current that will replace the UDP user-current setpoint when currtimertimeout expires. This is the delayed currtime setting, not actual charging current.
channel-group-type.keba.kecontact-udp.channel.currtimertimeout.description = Remaining time before the delayed UDP user-current setpoint becomes active, in seconds.
channel-group-type.keba.kecontact-udp.channel.dipswitch1.label = DIP Switch Block 1
channel-group-type.keba.kecontact-udp.channel.dipswitch1.description = Raw hexadecimal value of DIP-switch block 1, including the UDP enable bit.
channel-group-type.keba.kecontact-udp.channel.dipswitch2.label = DIP Switch Block 2
channel-group-type.keba.kecontact-udp.channel.dipswitch2.description = Raw hexadecimal value of DIP-switch block 2.
channel-group-type.keba.kecontact-udp.channel.display.description = Transient wallbox display text sent through UDP on supported P30 models. The setDisplay rule action also allows display-duration limits.
channel-group-type.keba.kecontact-udp.channel.enabledsystem.description = Wallbox activation state imposed by the system, reported by UDP Enable sys. This is not the writable user enable command.
channel-group-type.keba.kecontact-udp.channel.error1.label = UDP Error Word 1
channel-group-type.keba.kecontact-udp.channel.error1.description = Raw UDP Error1 diagnostic value. Retained alongside Error2 for manufacturer troubleshooting; do not treat it as the Modbus numeric error code.
channel-group-type.keba.kecontact-udp.channel.error2.label = UDP Error Word 2
channel-group-type.keba.kecontact-udp.channel.error2.description = Raw UDP Error2 diagnostic value. Interpret together with Error1 using KEBA's error documentation.
channel-group-type.keba.kecontact-udp.channel.inputx1.label = X1 Enable Input
channel-group-type.keba.kecontact-udp.channel.inputx1.description = State of the physical X1 enable input, reported by the UDP Input field. This is separate from the REST x2active flag.
channel-group-type.keba.kecontact-udp.channel.maxpilotcurrentdutycyle.label = Control Pilot Duty Cycle
channel-group-type.keba.kecontact-udp.channel.maxpilotcurrentdutycyle.description = Duty cycle of the control pilot PWM signal, expressed as a percentage. This signal encodes the offered current; it is not a measured phase current.
channel-group-type.keba.kecontact-udp.channel.maxpresetcurrent.label = UDP User Current Setpoint
channel-group-type.keba.kecontact-udp.channel.maxpresetcurrent.description = User-requested maximum charging current, in amperes, read from Curr user and changed with the UDP curr command. It is a setpoint, not measured current.
channel-group-type.keba.kecontact-udp.channel.maxpresetcurrentrange.label = UDP User Current Setpoint (%)
channel-group-type.keba.kecontact-udp.channel.maxpresetcurrentrange.description = Percentage representation of maxpresetcurrent, mapped between 6 A and the hardware current limit. Both channels control the same UDP user-current setpoint.
channel-group-type.keba.kecontact-udp.channel.output.label = X2 Switched Output
channel-group-type.keba.kecontact-udp.channel.output.description = State of the physical X2 switched output. Send ON or OFF to control it through the UDP output command; X1 is the separate enable input.
channel-group-type.keba.kecontact-udp.channel.sessionid.description = Identifier of the last charging session from UDP report 100.
channel-group-type.keba.kecontact-udp.channel.sessionrfidclass.description = RFID authorization class used for the last charging session from UDP report 100.
channel-group-type.keba.kecontact-udp.channel.timequality.description = Wallbox clock synchronization quality reported by UDP timeQ, from 0 to 3.
channel-group-type.keba.kecontact-udp.channel.uptime.description = System uptime since the wallbox was last reset, in seconds.

# channel types

channel-type.keba.authenticate.label = Authenticate
channel-type.keba.authenticate.description = Authenticate and start a charging session
channel-type.keba.authon.label = Authentication Enabled
channel-type.keba.authon.description = Authentication enabled
channel-type.keba.authreq.label = Authentication Required
channel-type.keba.authreq.description = Authentication required
channel-type.keba.backend.label = Backend Communication Present
channel-type.keba.backend.description = Whether backend communication is present
channel-type.keba.bootflag.label = Boot Flag
channel-type.keba.bootflag.description = Raw value reported by report 1 as "setBoot"; not documented in the UDP Programmers Guide V2.05
channel-type.keba.current.label = Current
channel-type.keba.current.description = Current
channel-type.keba.current_settable.label = Preset Current
channel-type.keba.current_settable.description = Preset Current
channel-type.keba.currtimer.label = Delayed Preset Current
channel-type.keba.currtimer.description = Current that will replace the preset current once the delayed-current timeout expires, as set by the "currtime" command
channel-type.keba.currtimertimeout.label = Delayed Preset Current Timeout
channel-type.keba.currtimertimeout.description = Remaining time before the delayed preset current set by the "currtime" command is applied
channel-type.keba.dipswitch.label = DIP Switch Block
channel-type.keba.dipswitch.description = Raw hexadecimal DIP switch value reported by report 1; not documented in the UDP Programmers Guide V2.05, see the installation manual for the meaning of individual switches
channel-type.keba.display.label = Display
channel-type.keba.display.description = Text to show on the P30 Series C or X display
channel-type.keba.enabledsystem.label = Enabled (System)
channel-type.keba.enabledsystem.description = Activation state of the wallbox (System)
channel-type.keba.enableduser.label = Enabled (User)
channel-type.keba.enableduser.description = Activation state of the wallbox (User)
channel-type.keba.energy.label = Energy Session
channel-type.keba.energy.description = Power consumption
channel-type.keba.error1.label = Error Code 1
channel-type.keba.error1.description = Error code state, if in error. See the KeContact FAQ
channel-type.keba.error2.label = Error Code 2
channel-type.keba.error2.description = Error code state, if in error. See the KeContact FAQ
channel-type.keba.failsafecurrent.label = Failsafe Current
channel-type.keba.failsafecurrent.description = Failsafe Current (if network is lost)
channel-type.keba.failsafetimeout.label = Failsafe Timeout
channel-type.keba.failsafetimeout.description = Communication timeout before the failsafe current is applied
channel-type.keba.locked.label = Plug Lock
channel-type.keba.locked.description = Indicator if the plug is locked by the electrical vehicle
channel-type.keba.maxcurrent.label = Max. System Current
channel-type.keba.maxcurrent.description = Maximal System Current
channel-type.keba.modbus-cablestate.label = Cable State
channel-type.keba.modbus-cablestate.description = State of the charging cable
channel-type.keba.modbus-cablestate.state.option.0 = No cable plugged
channel-type.keba.modbus-cablestate.state.option.1 = Plugged into wallbox
channel-type.keba.modbus-cablestate.state.option.3 = Plugged into wallbox and locked
channel-type.keba.modbus-cablestate.state.option.5 = Plugged into wallbox and vehicle, not locked
channel-type.keba.modbus-cablestate.state.option.7 = Plugged into wallbox and vehicle, locked
