# add-on

addon.keba.name = Keba Binding
addon.keba.description = This is the binding for Keba EV Charging Stations

# thing types

thing-type.keba.kecontact.label = KeContact
thing-type.keba.kecontact.description = A KEBA wallbox using optional Modbus TCP, UDP and authenticated REST protocols
thing-type.keba.kecontact.channel.I1.label = Measured Current Phase 1
thing-type.keba.kecontact.channel.I1.description = Actual current drawn by the vehicle on phase 1, measured in amperes; not a current limit or setpoint.
thing-type.keba.kecontact.channel.I2.label = Measured Current Phase 2
thing-type.keba.kecontact.channel.I2.description = Actual current drawn by the vehicle on phase 2, measured in amperes; not a current limit or setpoint.
thing-type.keba.kecontact.channel.I3.label = Measured Current Phase 3
thing-type.keba.kecontact.channel.I3.description = Actual current drawn by the vehicle on phase 3, measured in amperes; not a current limit or setpoint.
thing-type.keba.kecontact.channel.U1.label = Voltage Phase 1
thing-type.keba.kecontact.channel.U1.description = Measured voltage of phase 1, in volts.
thing-type.keba.kecontact.channel.U2.label = Voltage Phase 2
thing-type.keba.kecontact.channel.U2.description = Measured voltage of phase 2, in volts.
thing-type.keba.kecontact.channel.U3.label = Voltage Phase 3
thing-type.keba.kecontact.channel.U3.description = Measured voltage of phase 3, in volts.
thing-type.keba.kecontact.channel.activatefastcharging.label = Activate Fast Charging
thing-type.keba.kecontact.channel.activatefastcharging.description = Send ON to activate fast charging on P40. Removed after a P30 model is identified.
thing-type.keba.kecontact.channel.authenticate.description = Authenticate and start a charging session using an RFID tag and RFID class already accepted by the wallbox.
thing-type.keba.kecontact.channel.authon.description = Whether charging authorization is enabled, reported by REST authorizationEnabled when available.
thing-type.keba.kecontact.channel.authreq.description = Whether authentication is required before a charging session can begin.
thing-type.keba.kecontact.channel.backend.description = Whether communication with the charging backend is present.
thing-type.keba.kecontact.channel.bootflag.description = Raw UDP setBoot diagnostic value; its semantics are not documented in the UDP Programmer's Guide.
thing-type.keba.kecontact.channel.cablestate.description = Raw charging-cable state from Modbus register 1004. The wallbox, vehicle and locked switches are derived from this value.
thing-type.keba.kecontact.channel.currtimer.label = Delayed User Current Setpoint
thing-type.keba.kecontact.channel.currtimer.description = Current that will replace the UDP user-current setpoint when currtimertimeout expires. This is the delayed currtime setting, not actual charging current.
thing-type.keba.kecontact.channel.currtimertimeout.description = Remaining time before the delayed UDP user-current setpoint becomes active, in seconds.
thing-type.keba.kecontact.channel.dipswitch1.label = DIP Switch Block 1
thing-type.keba.kecontact.channel.dipswitch1.description = Raw hexadecimal value of DIP-switch block 1, including the UDP enable bit.
thing-type.keba.kecontact.channel.dipswitch2.label = DIP Switch Block 2
thing-type.keba.kecontact.channel.dipswitch2.description = Raw hexadecimal value of DIP-switch block 2.
thing-type.keba.kecontact.channel.dipswitchinterpretation.description = Named DIP-switch settings returned by the REST interpretation endpoint as a JSON object.
thing-type.keba.kecontact.channel.dipswitchsettings.description = Raw JSON array of DIP-switch settings reported by REST. Null entries are preserved.
thing-type.keba.kecontact.channel.display.description = Transient wallbox display text sent through UDP on supported P30 models. The setDisplay rule action also allows display-duration limits.
thing-type.keba.kecontact.channel.enabledsystem.description = Wallbox activation state imposed by the system, reported by UDP Enable sys. This is not the writable user enable command.
thing-type.keba.kecontact.channel.enableduser.description = Enable or disable charging. Commands use Modbus; availability readback comes from REST or UDP when available.
thing-type.keba.kecontact.channel.error.label = REST Error Name
thing-type.keba.kecontact.channel.error.description = Wallbox errorCode name reported by REST, for example TEMPERATURE_DERATING. This is complementary to, not numerically equivalent to, the Modbus error code.
thing-type.keba.kecontact.channel.error1.label = UDP Error Word 1
thing-type.keba.kecontact.channel.error1.description = Raw UDP Error1 diagnostic value. Retained alongside Error2 for manufacturer troubleshooting; do not treat it as the Modbus numeric error code.
thing-type.keba.kecontact.channel.error2.label = UDP Error Word 2
thing-type.keba.kecontact.channel.error2.description = Raw UDP Error2 diagnostic value. Interpret together with Error1 using KEBA's error documentation.
thing-type.keba.kecontact.channel.errorcode.label = Modbus Error Code
thing-type.keba.kecontact.channel.errorcode.description = Raw numeric wallbox error code from Modbus register 1006; zero means no error. Its encoding is different from REST error names and the two UDP error words.
thing-type.keba.kecontact.channel.externalmeter.label = External Meter
thing-type.keba.kecontact.channel.externalmeter.description = Whether the wallbox reports an external meter through REST hasExternalMeter; not an external-meter energy reading.
thing-type.keba.kecontact.channel.failsafecurrent.label = Failsafe Current Setting
thing-type.keba.kecontact.channel.failsafecurrent.description = Charging-current limit applied after communication is lost, in amperes, reported by Modbus or UDP. This setting is separate from the normal charging-current setpoint.
thing-type.keba.kecontact.channel.failsafepersist.label = Persist Failsafe Settings
thing-type.keba.kecontact.channel.failsafepersist.description = Send ON to save the active EMS failsafe settings permanently on a P30 wallbox.
thing-type.keba.kecontact.channel.failsafetimeout.label = Failsafe Timeout Setting
thing-type.keba.kecontact.channel.failsafetimeout.description = Communication timeout after which the failsafe current is applied, in seconds, reported by Modbus or UDP. This is not the delayed UDP user-current timer.
thing-type.keba.kecontact.channel.fastchargingstatus.description = P40-only raw fast-charging status from Modbus register 1200. Removed after a P30 model is identified.
thing-type.keba.kecontact.channel.input.label = X1 Enable Input
thing-type.keba.kecontact.channel.input.description = State of the physical X1 enable input, reported by the UDP Input field. This is separate from the REST x2active flag.
thing-type.keba.kecontact.channel.locked.description = Whether the charging plug is locked, derived from cable state when Modbus is available.
thing-type.keba.kecontact.channel.maxphases.label = Maximum Phases
thing-type.keba.kecontact.channel.maxphases.description = Maximum number of charging phases supported by the wallbox, reported by REST maxPhases.
thing-type.keba.kecontact.channel.maxpilotcurrent.label = Offered Charging Current
thing-type.keba.kecontact.channel.maxpilotcurrent.description = Maximum charging current currently offered to the vehicle, reported by Modbus or UDP. The vehicle may draw less; I1, I2 and I3 report actual measured current.
thing-type.keba.kecontact.channel.maxpilotcurrentdutycyle.label = Control Pilot Duty Cycle
thing-type.keba.kecontact.channel.maxpilotcurrentdutycyle.description = Duty cycle of the control pilot PWM signal, expressed as a percentage. This signal encodes the offered current; it is not a measured phase current.
thing-type.keba.kecontact.channel.maxpresetcurrent.label = User Charging Current Setpoint
thing-type.keba.kecontact.channel.maxpresetcurrent.description = User-requested maximum charging current, in amperes. Commands use Modbus when available and otherwise use UDP. This is a setpoint, not measured current.
thing-type.keba.kecontact.channel.maxpresetcurrentrange.label = UDP User Current Setpoint (%)
thing-type.keba.kecontact.channel.maxpresetcurrentrange.description = Percentage representation of maxpresetcurrent, mapped between 6 A and the hardware current limit. Both channels control the same UDP user-current setpoint.
thing-type.keba.kecontact.channel.maxsystemcurrent.label = Hardware Current Limit
thing-type.keba.kecontact.channel.maxsystemcurrent.description = Maximum current supported by the wallbox hardware, reported by Modbus or UDP. This is not the user setpoint or the current actually drawn by the vehicle.
thing-type.keba.kecontact.channel.output.label = X2 Switched Output
thing-type.keba.kecontact.channel.output.description = State of the physical X2 switched output. Send ON or OFF to control it through the UDP output command; X1 is the separate enable input.
thing-type.keba.kecontact.channel.permanentlylocked.description = Enable or disable permanent plug locking through REST. This is a locking policy, not the current physical plug-lock state.
thing-type.keba.kecontact.channel.phaseconfiguration.description = Configured phase order reported by REST phaseUsed, rather than just the number of active phases.
thing-type.keba.kecontact.channel.phaseswitchsource.description = Communication source allowed to control phase switching: disabled, OCPP, REST, Modbus or UDP.
thing-type.keba.kecontact.channel.phaseswitchstate.description = Phase-switch state, 1 for single-phase or 3 for three-phase charging. Writable through Modbus or UDP; read-only through REST. Use togglephaseswitch for a REST phase toggle.
thing-type.keba.kecontact.channel.power.description = Total measured active charging power, in watts.
thing-type.keba.kecontact.channel.powerfactor.description = Measured charging power factor (cos phi), expressed as a percentage.
thing-type.keba.kecontact.channel.reboot.label = Reboot
thing-type.keba.kecontact.channel.reboot.description = Send ON to request a wallbox reboot through the REST API.
thing-type.keba.kecontact.channel.reserved.label = Reserved
thing-type.keba.kecontact.channel.reserved.description = Whether the wallbox has an active reservation, reported by the REST reserved field.
thing-type.keba.kecontact.channel.restinput.label = REST X2 Active
thing-type.keba.kecontact.channel.restinput.description = Raw x2active flag reported by the REST API. This is not assumed to be the UDP X1 enable-input signal; use input for that physical input.
thing-type.keba.kecontact.channel.reststate.description = Textual operational state reported by the REST API, for example CHARGING or READY_FOR_CHARGING. This retains REST state names alongside the numeric Modbus state.
thing-type.keba.kecontact.channel.session.description = Whether a charging session is currently active, reported by REST sessionActive.
thing-type.keba.kecontact.channel.sessionconsumption.description = Energy delivered in the current charging session, in watt-hours.
thing-type.keba.kecontact.channel.sessionduration.description = Duration of the latest charging session, in seconds, from the REST session endpoint.
thing-type.keba.kecontact.channel.sessionid.description = Identifier of the last charging session from UDP report 100.
thing-type.keba.kecontact.channel.sessionrfidclass.description = RFID authorization class used for the last charging session from UDP report 100.
thing-type.keba.kecontact.channel.sessionrfidtag.description = RFID tag used for the last charging session, represented by the hexadecimal Modbus RFID register. Only available when RFID is enabled.
thing-type.keba.kecontact.channel.sessionstart.description = Start time of the latest charging session returned by the REST session endpoint.
thing-type.keba.kecontact.channel.setenergylimit.description = Energy limit for an already running or the next charging session. Send an energy quantity, for example in watt-hours.
thing-type.keba.kecontact.channel.start.label = Start Charging
thing-type.keba.kecontact.channel.start.description = Send ON to request that the REST API starts a charging session.
thing-type.keba.kecontact.channel.state.description = Current operational state of the wallbox, read from Modbus register 1000.
thing-type.keba.kecontact.channel.stop.label = Stop Charging
thing-type.keba.kecontact.channel.stop.description = Send ON to request that the REST API stops the active charging session.
thing-type.keba.kecontact.channel.temperature.description = Internal wallbox temperature from the REST meter data, in degrees Celsius.
thing-type.keba.kecontact.channel.timequality.description = Wallbox clock synchronization quality reported by UDP timeQ, from 0 to 3.
thing-type.keba.kecontact.channel.togglephaseswitch.label = Toggle Phase Switch
thing-type.keba.kecontact.channel.togglephaseswitch.description = Send ON to toggle single-phase and three-phase charging through REST. OFF is ignored; the channel resets to OFF after a successful request. This does not select a target phase count.
thing-type.keba.kecontact.channel.totalconsumption.description = Total energy consumption reported by the wallbox meter, in watt-hours; added up after completed charging sessions.
thing-type.keba.kecontact.channel.unlock.label = Unlock
thing-type.keba.kecontact.channel.unlock.description = Send ON to request plug unlocking through the REST API.
thing-type.keba.kecontact.channel.unlockplug.description = Send ON to unlock the charging plug. Charging must be stopped before unlocking.
thing-type.keba.kecontact.channel.uptime.description = System uptime since the wallbox was last reset, in seconds.
thing-type.keba.kecontact.channel.vehicle.description = Whether a vehicle is connected, derived from cable state when Modbus is available.
thing-type.keba.kecontact.channel.wallbox.description = Whether the cable is plugged into the wallbox, derived from cable state when Modbus is available.

