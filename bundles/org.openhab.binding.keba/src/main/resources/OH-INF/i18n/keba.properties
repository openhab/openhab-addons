thing-type.config.keba.kecontact-rest.serialNumber.label = Wallbox Serial Number
thing-type.config.keba.kecontact-rest.serialNumber.description = Optional serial number. Leave empty to read it from the REST API; specify it to select a slave wallbox in a master/slave setup
thing-type.config.keba.kecontact-rest.username.label = Username
thing-type.config.keba.kecontact-rest.verifyCertificate.label = Verify TLS Certificate
thing-type.config.keba.kecontact-rest.verifyCertificate.description = Verify that the wallbox certificate is trusted by openHAB and matches the configured host
thing-type.config.keba.kecontact-udp.ipAddress.label = Network Address
thing-type.config.keba.kecontact-udp.ipAddress.description = Network address of the wallbox
thing-type.config.keba.kecontact-udp.refreshInterval.label = Refresh Interval
thing-type.config.keba.kecontact-udp.refreshInterval.description = Refresh interval in seconds; set to 0 to disable cyclic polling while keeping UDP commands such as setDisplay available
thing-type.config.keba.kecontact.baseUrl.label = REST API URL
thing-type.config.keba.kecontact.baseUrl.description = HTTPS URL of the wallbox REST API, for example https://192.168.0.10:8443; leave empty to disable REST probing
thing-type.config.keba.kecontact.group.modbus.label = Modbus TCP
thing-type.config.keba.kecontact.group.modbus.description = Primary connection for measurements and commands, including Modbus proxy connections
thing-type.config.keba.kecontact.group.polling.label = Shared Polling
thing-type.config.keba.kecontact.group.polling.description = Polling settings shared by the wallbox protocols
thing-type.config.keba.kecontact.group.rest.label = REST API
thing-type.config.keba.kecontact.group.rest.description = Optional authenticated connection for REST-only data
thing-type.config.keba.kecontact.group.udp.label = UDP
thing-type.config.keba.kecontact.group.udp.description = Direct wallbox access for display commands and UDP-only data
thing-type.config.keba.kecontact.ipAddress.label = Modbus Network Address
thing-type.config.keba.kecontact.ipAddress.description = Address of the wallbox Modbus endpoint or a Modbus proxy
thing-type.config.keba.kecontact.password.label = REST Password
thing-type.config.keba.kecontact.password.description = Password required when a REST API URL is configured
thing-type.config.keba.kecontact.port.label = Modbus Port
thing-type.config.keba.kecontact.refreshInterval.label = Fast Modbus Refresh Interval
thing-type.config.keba.kecontact.refreshInterval.description = Interval for linked fast Modbus values and baseline status
thing-type.config.keba.kecontact.refreshIntervalSlow.label = Slow and Supplemental Refresh Interval
