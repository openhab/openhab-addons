# add-on

addon.eyeonwater.name = EyeOnWater Binding
addon.eyeonwater.description = This is the binding for EyeOnWater.

# thing types

thing-type.eyeonwater.bridge.label = EyeOnWater Account Bridge
thing-type.eyeonwater.bridge.description = Manages connection, authentication, and discovery of meters for an EyeOnWater account
thing-type.eyeonwater.meter.label = EyeOnWater Water Meter
thing-type.eyeonwater.meter.description = Represents a physical water meter registered with EyeOnWater

# thing types config

thing-type.config.eyeonwater.bridge.hostname.label = Hostname
thing-type.config.eyeonwater.bridge.hostname.description = The EyeOnWater hostname (e.g. eyeonwater.com, eyeonwater.ca)
thing-type.config.eyeonwater.bridge.password.label = Password
thing-type.config.eyeonwater.bridge.password.description = The password for your EyeOnWater account
thing-type.config.eyeonwater.bridge.preferNewSearch.label = Prefer New Search API
thing-type.config.eyeonwater.bridge.preferNewSearch.description = When enabled, uses the modern search API endpoint instead of scraping the legacy dashboard
thing-type.config.eyeonwater.bridge.refreshInterval.label = Refresh Interval
thing-type.config.eyeonwater.bridge.refreshInterval.description = How often the bridge polls the API in minutes
thing-type.config.eyeonwater.bridge.username.label = Username
thing-type.config.eyeonwater.bridge.username.description = The email address or username for your EyeOnWater account
thing-type.config.eyeonwater.meter.meterId.label = Meter ID
thing-type.config.eyeonwater.meter.meterId.description = The physical ID / Serial Number of the meter
thing-type.config.eyeonwater.meter.meterUuid.label = Meter UUID
thing-type.config.eyeonwater.meter.meterUuid.description = The internal unique identifier (UUID) of the meter

# channel types

channel-type.eyeonwater.last-read-time.label = Last Read Time
channel-type.eyeonwater.last-read-time.description = The exact timestamp of the latest water meter reading
channel-type.eyeonwater.leak-alert.label = Leak Alert
channel-type.eyeonwater.leak-alert.description = Indicates whether an active leak alert has been raised by the meter
channel-type.eyeonwater.leak-flow-rate.label = Leak Flow Rate
channel-type.eyeonwater.leak-flow-rate.description = The rate of active water leak, if any, detected by the meter
channel-type.eyeonwater.low-battery.label = Low Battery Alert
channel-type.eyeonwater.low-battery.description = Indicates whether the meter battery is low
channel-type.eyeonwater.reading.label = Water Reading
channel-type.eyeonwater.reading.description = The latest total volume consumption reading reported by the meter
channel-type.eyeonwater.reverse-flow.label = Reverse Flow Alert
channel-type.eyeonwater.reverse-flow.description = Indicates whether reverse water flow is detected

# custom thing status

offline.bridge-config-missing = Username and Password must be provided.
offline.initialization-interrupted = Initialization interrupted
offline.meter-config-missing = Meter UUID and Meter ID must be provided.
offline.bridge-undefined = Parent bridge is not defined.
offline.bridge-not-initialized = Parent bridge is not initialized.
offline.communication-error = Communication error
offline.interrupted-polling = Interrupted polling
offline.unexpected-error = Unexpected error
offline.failed-initial-poll = Failed initial poll
offline.poll-interrupted = Poll interrupted
offline.unsupported-unit = Unsupported unit of measurement received.
