# add-on

addon.tailwind.name = TailWind Binding
addon.tailwind.description = Controls garage doors through the local API of TailWind smart garage controllers.

# thing types

thing-type.tailwind.iq3.label = TailWind iQ3
thing-type.tailwind.iq3.description = TailWind iQ3 smart garage controller, for up to three garage doors
thing-type.tailwind.iq3.group.door1.label = Door 1
thing-type.tailwind.iq3.group.door2.label = Door 2
thing-type.tailwind.iq3.group.door3.label = Door 3

# thing types config

thing-type.config.tailwind.iq3.door1PartialOpenTime.label = Door 1 Partial Open Time
thing-type.config.tailwind.iq3.door1PartialOpenTime.description = Time the door runs when it is opened partially
thing-type.config.tailwind.iq3.door2PartialOpenTime.label = Door 2 Partial Open Time
thing-type.config.tailwind.iq3.door2PartialOpenTime.description = Time the door runs when it is opened partially
thing-type.config.tailwind.iq3.door3PartialOpenTime.label = Door 3 Partial Open Time
thing-type.config.tailwind.iq3.door3PartialOpenTime.description = Time the door runs when it is opened partially
thing-type.config.tailwind.iq3.hostname.label = Hostname
thing-type.config.tailwind.iq3.hostname.description = IP address or host name of the controller, for example 192.168.1.50 or tailwind-30aea4801880.local
thing-type.config.tailwind.iq3.token.label = Local Control Key
thing-type.config.tailwind.iq3.token.description = The 6-digit Local Control Key of the controller, from the TailWind web dashboard

# channel group types

channel-group-type.tailwind.controller.label = Controller
channel-group-type.tailwind.door.label = Door

# channel types

channel-type.tailwind.command.label = Command
channel-type.tailwind.command.description = Sends a support command to the controller
channel-type.tailwind.command.state.option.identify = Identify (blink the LED)
channel-type.tailwind.command.state.option.reboot = Reboot
channel-type.tailwind.door-control.label = Control
channel-type.tailwind.door-control.description = Opens, partially opens or closes the door. The state is the current status of the door.
channel-type.tailwind.door-control.state.option.open = Open
channel-type.tailwind.door-control.state.option.partial = Open Partially
channel-type.tailwind.door-control.state.option.close = Close
channel-type.tailwind.door-disabled.label = Disabled
channel-type.tailwind.door-disabled.description = ON when the door is disabled in the TailWind app
channel-type.tailwind.door-locked.label = Locked
channel-type.tailwind.door-locked.description = ON when the controller has locked the door, so that it does not accept commands
channel-type.tailwind.door-status.label = Status
channel-type.tailwind.door-status.description = Whether the door is open or closed
channel-type.tailwind.door-status.state.option.open = Open
channel-type.tailwind.door-status.state.option.close = Closed
channel-type.tailwind.led-brightness.label = LED Brightness
channel-type.tailwind.led-brightness.description = Brightness of the status LED of the controller
channel-type.tailwind.night-mode.label = Night Mode
channel-type.tailwind.night-mode.description = ON when night mode is enabled in the TailWind app. In night mode the controller closes the doors automatically during the hours set in the app.
channel-type.tailwind.rssi.label = Wi-Fi Signal Strength
channel-type.tailwind.rssi.description = Strength of the Wi-Fi signal the controller receives
channel-type.tailwind.server-monitor.label = Server Connection Monitoring
channel-type.tailwind.server-monitor.description = When ON, the controller reboots itself if it loses its connection to the TailWind cloud server. Turn OFF to use the controller on a network without internet access. Requires firmware 10.61 or later.

# thing status descriptions

offline.conf-error.no-hostname = The hostname of the controller is not set.
offline.conf-error.no-token = The Local Control Key is not set.
offline.conf-error.token-rejected = The controller rejected the Local Control Key. Check it against the Local Control Key in the TailWind web dashboard.
offline.conf-error.no-primary-address = openHAB has no primary IPv4 address for the controller to send its status reports to. Set one in the network settings.
