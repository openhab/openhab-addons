# add-on

addon.evohome.name = evohome Binding
addon.evohome.description = The evohome binding controls the Honeywell evohome system.

# thing types

thing-type.evohome.account.label = evohome Account
thing-type.evohome.account.description = The evohome account is used to connect to your Total Connect Comfort (TCC) using your TCC username and password.
thing-type.evohome.display.label = evohome Display
thing-type.evohome.display.description = This represents the evohome control display.
thing-type.evohome.heatingzone.label = evohome Heating Zone
thing-type.evohome.heatingzone.description = This represents the evohome Heating Zone.

# thing types config

thing-type.config.evohome.account.group.auth.label = Authentication
thing-type.config.evohome.account.group.auth.description = Contains the settings needed to authenticate against the TCC service.
thing-type.config.evohome.account.password.label = Password
thing-type.config.evohome.account.password.description = Your TCC Password
thing-type.config.evohome.account.refreshInterval.label = Refresh Interval
thing-type.config.evohome.account.refreshInterval.description = The refresh interval to poll TCC (in seconds).
thing-type.config.evohome.account.scheduleRefreshInterval.label = Schedule Refresh
thing-type.config.evohome.account.scheduleRefreshInterval.description = Cache interval for linked heating zone schedules, in minutes. Schedule requests are separate from status polling and limited to one zone per status poll.
thing-type.config.evohome.account.username.label = Username
thing-type.config.evohome.account.username.description = Your TCC Username
thing-type.config.evohome.display.id.label = ID
thing-type.config.evohome.display.id.description = ID of the display
thing-type.config.evohome.display.name.label = Name
thing-type.config.evohome.display.name.description = Name of the display
thing-type.config.evohome.heatingzone.id.label = ID
thing-type.config.evohome.heatingzone.id.description = ID of the zone
thing-type.config.evohome.heatingzone.name.label = Name
thing-type.config.evohome.heatingzone.name.description = Name of the zone
thing-type.config.evohome.heatingzone.temporaryOverrideDuration.label = Temporary Override Duration
thing-type.config.evohome.heatingzone.temporaryOverrideDuration.description = Duration for temporary set point commands in minutes. 0 ends the override at the next scheduled switch point; a positive value sets a fixed duration.

# channel types

channel-type.evohome.lastSuccessfulUpdate.label = Last Successful Update
channel-type.evohome.lastSuccessfulUpdate.description = Time of the last successful retrieval of the installation status from TCC, not the sensor measurement time.
channel-type.evohome.setpoint.label = Set Point
channel-type.evohome.reset.label = Reset to Schedule
channel-type.evohome.reset.description = Send ON to select Auto and cancel all heating zone and hot water overrides on this controller.
channel-type.evohome.reset.command.option.ON = Reset to schedule
channel-type.evohome.setpoint.description = Gets or sets this zone's target temperature. An active temporary override keeps its expiry; other commands create a permanent override. 0 cancels the override.
channel-type.evohome.setpointstatus.label = Set Point Status
channel-type.evohome.setpointstatus.description = Gets or sets the zone override mode. FollowSchedule cancels the override; PermanentOverride or TemporaryOverride applies the current target temperature in that mode.
channel-type.evohome.setpointstatus.state.option.PermanentOverride = Permanent override
channel-type.evohome.setpointstatus.state.option.FollowSchedule = Follow schedule
channel-type.evohome.setpointstatus.state.option.TemporaryOverride = Temporary override
channel-type.evohome.systemMode.label = System Mode
channel-type.evohome.setpointuntil.label = Set Point Until
channel-type.evohome.setpointuntil.description = Expiry time of the active temporary zone override. Undefined when no temporary override is active.
channel-type.evohome.systemMode.description = Gets the system mode. Commands set a permanent mode. Auto preserves individual zone overrides; Reset also cancels them.
channel-type.evohome.systemModeUntil.label = System Mode Until
channel-type.evohome.systemModeUntil.description = Expiry reported by TCC for a temporary system mode. Undefined for a permanent mode or an unknown expiry.
channel-type.evohome.systemModePermanent.label = Permanent Mode
channel-type.evohome.systemModePermanent.description = ON when TCC reports a permanent system mode, OFF for a temporary mode, or undefined when unknown.
channel-type.evohome.systemMode.state.option.Auto = Normal
channel-type.evohome.systemMode.state.option.AutoWithEco = Eco
channel-type.evohome.systemMode.state.option.Away = Away
channel-type.evohome.systemMode.state.option.DayOff = Day off
channel-type.evohome.systemMode.state.option.HeatingOff = Off
channel-type.evohome.systemMode.state.option.Custom = Custom
channel-type.evohome.temperature.label = Temperature
channel-type.evohome.temperature.description = Current zone temperature
channel-type.evohome.temporarysetpoint.label = Temporary Set Point
channel-type.evohome.temporarysetpoint.description = Shows the current target temperature. Commands set a temporary target using the configured duration, two hours by default. Read the resulting mode and expiry from SetPointStatus and SetPointUntil.
channel-type.evohome.weeklySchedule.label = Weekly Schedule
channel-type.evohome.weeklySchedule.description = Weekly heating program in canonical JSON. Days are ordered Monday to Sunday; switch points use sorted local times and temperatures in Celsius.
channel-type.evohome.nextSwitchpoint.label = Next Switch Point
channel-type.evohome.nextSwitchpoint.description = Next switch point in the normal weekly heating program, calculated in the location's time zone. System modes and zone overrides do not alter this value.
channel-type.evohome.nextScheduledTemperature.label = Next Scheduled Temp
channel-type.evohome.nextScheduledTemperature.description = Target temperature at the next normal weekly program switch point. System modes and zone overrides are not applied to this value.
channel-type.evohome.scheduleLastUpdated.label = Schedule Updated
channel-type.evohome.scheduleLastUpdated.description = Time of the last successful retrieval of this zone's weekly heating program from TCC. Unchanged after a failed schedule request.

# actions

action.accepted.label = Accepted
action.accepted.description = Whether TCC accepted the command. Read the Thing channels to confirm the resulting state.
action.cancel.label = Cancel Zone Override
action.cancel.description = Cancels this zone's override and returns it to its schedule under the current system mode.
action.minutes.label = Duration
action.minutes.description = Override duration in minutes, from 1 to 1440.
action.nextSwitchpoint.label = Override Until Next Switch Point
action.nextSwitchpoint.description = Sets a temporary target temperature until the next switch point in this zone's weekly program.
action.permanent.label = Set Permanent Target Temperature
action.permanent.description = Sets a permanent zone override, replacing any active temporary override.
action.temperature.label = Target Temperature
action.temperature.description = Target temperature in degrees Celsius, within this zone's supported limits.
action.temporary.label = Override Until Date and Time
action.temporary.description = Sets a temporary zone override ending at the given date and time.
action.temporaryFor.label = Override for Duration
action.temporaryFor.description = Sets a temporary zone override for the given number of minutes.
action.until.label = Expiry
action.until.description = A future date and time with an explicit time zone or UTC offset.
action.systemMode.label = Set Permanent System Mode
action.systemMode.description = Sets a permanent controller mode. Auto preserves zone overrides; AutoWithReset cancels all overrides in this controller.
action.temporarySystemMode.label = Set Temporary System Mode
action.temporarySystemMode.description = Sets a controller mode until the given expiry, if the controller supports temporary operation in that mode.
action.temporarySystemModeFor.label = Set System Mode for Duration
action.temporarySystemModeFor.description = Sets a temporary controller mode for the given number of minutes, subject to the controller's supported modes and limits.
action.mode.label = System Mode
action.mode.description = A system mode supported by this controller, such as AutoWithEco, Away or DayOff.
action.systemMinutes.label = Duration
action.systemMinutes.description = System mode duration in minutes. Must be positive and supported by the controller.
