# add-on

addon.bmwcardata.name = BMW CarData Binding
addon.bmwcardata.description = This is the binding for BMW CarData, the official BMW Group service providing the telematic data of BMW and MINI vehicles to their owners.

# thing types

thing-type.bmwcardata.account.label = BMW CarData Account
thing-type.bmwcardata.account.description = Access to the vehicles of a BMW Group customer account via BMW CarData
thing-type.bmwcardata.vehicle.label = BMW CarData Vehicle
thing-type.bmwcardata.vehicle.description = A vehicle mapped to the BMW CarData account

# thing types config

thing-type.config.bmwcardata.account.brokerHost.label = Broker Host
thing-type.config.bmwcardata.account.brokerHost.description = Host name or IP address of the local MQTT broker. Required in bridge mode and for mirroring.
thing-type.config.bmwcardata.account.brokerPassword.label = Broker Password
thing-type.config.bmwcardata.account.brokerPort.label = Broker Port
thing-type.config.bmwcardata.account.brokerSecure.label = Use TLS
thing-type.config.bmwcardata.account.brokerSecure.description = Connect to the broker with TLS. The certificate of the broker is verified with the trust store of the Java runtime.
thing-type.config.bmwcardata.account.brokerUsername.label = Broker User Name
thing-type.config.bmwcardata.account.clientId.label = Client ID
thing-type.config.bmwcardata.account.clientId.description = The client ID created in the BMW CarData section of the MyBMW / MINI customer portal. The client needs the subscriptions "CarData API" and "CarData Streaming".
thing-type.config.bmwcardata.account.group.broker.label = Local Broker
thing-type.config.bmwcardata.account.group.broker.description = Local MQTT broker the bmw-mqtt-bridge publishes the CarData stream to, or the binding mirrors it to
thing-type.config.bmwcardata.account.group.rest.label = API Requests
thing-type.config.bmwcardata.account.group.rest.description = BMW allows 50 API requests per account and day
thing-type.config.bmwcardata.account.group.stream.label = Stream
thing-type.config.bmwcardata.account.group.stream.description = Receiving the CarData stream
thing-type.config.bmwcardata.account.mirrorToBroker.label = Mirror to Local Broker
thing-type.config.bmwcardata.account.mirrorToBroker.description = Republish the direct stream to the local MQTT broker in the topic format of the bmw-mqtt-bridge, so that other tools can use it. Ignored in bridge mode.
thing-type.config.bmwcardata.account.refreshInterval.label = Refresh Interval
thing-type.config.bmwcardata.account.refreshInterval.description = Hours between refreshes of all vehicle data via the CarData API, one request per vehicle. 0 disables the periodic refresh; the data is still refreshed two minutes after the start and after stream outages of five minutes or more.
thing-type.config.bmwcardata.account.requestBudget.label = Request Budget
thing-type.config.bmwcardata.account.requestBudget.description = Maximum number of CarData API requests the binding sends in 24 hours. BMW allows 50 requests per account and day; keep a reserve if other tools use the same account.
thing-type.config.bmwcardata.account.streamMode.label = Stream Mode
thing-type.config.bmwcardata.account.streamMode.description = Connect to the BMW streaming service directly, or receive the stream from a local MQTT broker the bmw-mqtt-bridge publishes to. BMW allows only one stream connection per account.
thing-type.config.bmwcardata.account.streamMode.option.direct = Direct
thing-type.config.bmwcardata.account.streamMode.option.bridge = bmw-mqtt-bridge
thing-type.config.bmwcardata.account.streaming.label = Streaming
thing-type.config.bmwcardata.account.streaming.description = Receive vehicle data pushed by the CarData streaming service. The data selected for the stream in the customer portal is updated as soon as the vehicle reports it.
thing-type.config.bmwcardata.account.topicPrefix.label = Topic Prefix
thing-type.config.bmwcardata.account.topicPrefix.description = Prefix of the bridge topics, the LOCAL_PREFIX configured in the bridge.
thing-type.config.bmwcardata.vehicle.dynamicChannels.label = Dynamic Channels
thing-type.config.bmwcardata.vehicle.dynamicChannels.description = Create a channel for each received data point without predefined channel, e.g. data selected for the stream in the customer portal.
thing-type.config.bmwcardata.vehicle.vin.label = Vehicle Identification Number
thing-type.config.bmwcardata.vehicle.vin.description = The 17 character VIN of the vehicle.

