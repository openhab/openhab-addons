# add-on

addon.transit.name = Transit Binding
addon.transit.description = This binding integrates public transit information and real-time departure details from the Transit API (v4).

# thing types

thing-type.transit.bridge.label = Transit Bridge
thing-type.transit.bridge.description = Bridge to connect to Transit API
thing-type.transit.journey.label = Journey
thing-type.transit.journey.description = Plans a trip between two places and shows the itinerary that arrives first
thing-type.transit.networkalerts.label = Network Alerts
thing-type.transit.networkalerts.description = Active service alerts of one or more transit networks
thing-type.transit.routedetails.label = Route Details
thing-type.transit.routedetails.description = Detailed information about a specific transit route
thing-type.transit.stop.label = Stop
thing-type.transit.stop.description = Represents a transit stop for monitoring upcoming departures
thing-type.transit.tripdetails.label = Trip Details
thing-type.transit.tripdetails.description = Detailed stop-by-stop schedule for a specific trip
thing-type.transit.vehicles.label = Vehicles
thing-type.transit.vehicles.description = Real-time positions of the vehicles of a route

