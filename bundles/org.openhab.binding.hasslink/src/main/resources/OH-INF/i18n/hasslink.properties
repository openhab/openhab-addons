# add-on

addon.hasslink.name = Home Assistant Link Binding
addon.hasslink.description = This binding brings Home Assistant devices and entities into openHAB, allowing you to treat Home Assistant's ecosystem as native openHAB Things and Items.

# thing types

thing-type.hasslink.device.label = Home Assistant Device / Entity
thing-type.hasslink.device.description = Mapped Home Assistant device, standalone entity, or custom entity container
thing-type.hasslink.server.label = Home Assistant Server
thing-type.hasslink.server.description = Persistent native WebSocket connection to Home Assistant Core

# thing types config

thing-type.config.hasslink.device.deviceId.label = Device ID
thing-type.config.hasslink.device.deviceId.description = The Home Assistant device identifier. All entities belonging to this device will be added as channels.
thing-type.config.hasslink.device.entityIds.label = Entity IDs
thing-type.config.hasslink.device.entityIds.description = Home Assistant custom standalone entity identifiers or glob patterns. Use this to add entities that do not belong to any device.
thing-type.config.hasslink.device.excludedDomains.label = Excluded Domains (Blacklist)
thing-type.config.hasslink.device.excludedDomains.description = Domains or glob patterns to exclude from creating channels on this Thing (e.g., update*, button*).
thing-type.config.hasslink.device.excludedEntities.label = Excluded Entities / Patterns (Blacklist)
thing-type.config.hasslink.device.excludedEntities.description = Specific Entity IDs or glob patterns (e.g., *battery*, *_rssi) to exclude from creating channels on this Thing.
thing-type.config.hasslink.device.excludedLabels.label = Excluded Labels (Blacklist)
thing-type.config.hasslink.device.excludedLabels.description = Exclude child entities matching these Home Assistant Labels/Tags or glob patterns from becoming channels.
thing-type.config.hasslink.device.group.filtering.label = Channel Filtering
thing-type.config.hasslink.device.group.filtering.description = Filter which Home Assistant child entities are created as channels on this Thing.
thing-type.config.hasslink.device.includedDomains.label = Included Domains (Whitelist)
thing-type.config.hasslink.device.includedDomains.description = Restrict created channels on this Thing to specific domains or glob patterns (e.g., switch, sensor*).
thing-type.config.hasslink.device.includedEntities.label = Included Entities / Patterns (Pinpoint Override)
thing-type.config.hasslink.device.includedEntities.description = Specific Entity IDs or glob patterns (e.g., sensor.*bed*, *_temperature) to explicitly allow as channels. Overrides domain and label rules above.
thing-type.config.hasslink.device.includedLabels.label = Included Labels (Whitelist)
thing-type.config.hasslink.device.includedLabels.description = Only create channels for child entities matching these Home Assistant Labels/Tags or glob patterns.
thing-type.config.hasslink.server.excludedAreas.label = Excluded Areas
thing-type.config.hasslink.server.excludedAreas.description = Home Assistant Area IDs or glob patterns to exclude from discovery.
thing-type.config.hasslink.server.excludedDomains.label = Excluded Domains
thing-type.config.hasslink.server.excludedDomains.description = Home Assistant domains or glob patterns to exclude from discovery.
thing-type.config.hasslink.server.excludedLabels.label = Excluded Labels
thing-type.config.hasslink.server.excludedLabels.description = Home Assistant Labels/Tags or glob patterns to ignore on entities or parent devices during discovery.
thing-type.config.hasslink.server.group.filtering.label = Entity & Device Filtering
thing-type.config.hasslink.server.group.filtering.description = Filter which Home Assistant entities and devices are discovered and imported as Things.
thing-type.config.hasslink.server.host.label = Hostname / IP
thing-type.config.hasslink.server.host.description = Plain hostname or IP address, without http:// or https://
thing-type.config.hasslink.server.ignoreIndependentEntities.label = Ignore Independent Entities
thing-type.config.hasslink.server.ignoreIndependentEntities.description = Exclude entities without a parent device (helpers, automations, person tracking) from Inbox discovery.
thing-type.config.hasslink.server.includedAreas.label = Included Areas
thing-type.config.hasslink.server.includedAreas.description = Only discover devices assigned to these Home Assistant Area IDs. Supports glob patterns (e.g., *bedroom*). Leave empty for all.
thing-type.config.hasslink.server.includedDomains.label = Included Domains
thing-type.config.hasslink.server.includedDomains.description = Only discover entities belonging to these domains (e.g., light, switch, climate). Supports glob patterns. Leave empty for all.
thing-type.config.hasslink.server.includedLabels.label = Included Labels
thing-type.config.hasslink.server.includedLabels.description = Only discover devices or entities matching these Home Assistant Labels/Tags or glob patterns (e.g., openhab*). Leave empty for all.
thing-type.config.hasslink.server.port.label = Port
thing-type.config.hasslink.server.secure.label = Secure Connection
thing-type.config.hasslink.server.token.label = Long-Lived Access Token
thing-type.config.hasslink.server.token.description = A Home Assistant Long-Lived Access Token, created under your Home Assistant user profile.

