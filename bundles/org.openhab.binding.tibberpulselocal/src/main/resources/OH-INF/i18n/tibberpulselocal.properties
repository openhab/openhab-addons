# add-on

addon.tibberpulselocal.name = Tibber Pulse Local Binding
addon.tibberpulselocal.description = Reads the live data of a Tibber Pulse from the Tibber bridge on the local network, without the Tibber cloud.

# thing types

thing-type.tibberpulselocal.bridge.label = Tibber Pulse Bridge
thing-type.tibberpulselocal.bridge.description = The Tibber bridge on the local network. It streams the readings of the connected Pulse devices.
thing-type.tibberpulselocal.meter.label = Tibber Pulse Meter
thing-type.tibberpulselocal.meter.description = The electricity meter read by one Tibber Pulse, identified by the device id of the Pulse.
thing-type.tibberpulselocal.meter.channel.current-l1.label = Current L1
thing-type.tibberpulselocal.meter.channel.current-l1.description = Current on phase L1.
thing-type.tibberpulselocal.meter.channel.current-l2.label = Current L2
thing-type.tibberpulselocal.meter.channel.current-l2.description = Current on phase L2.
thing-type.tibberpulselocal.meter.channel.current-l3.label = Current L3
thing-type.tibberpulselocal.meter.channel.current-l3.description = Current on phase L3.
thing-type.tibberpulselocal.meter.channel.power-l1.label = Power L1
thing-type.tibberpulselocal.meter.channel.power-l1.description = Active power on phase L1.
thing-type.tibberpulselocal.meter.channel.power-l2.label = Power L2
thing-type.tibberpulselocal.meter.channel.power-l2.description = Active power on phase L2.
thing-type.tibberpulselocal.meter.channel.power-l3.label = Power L3
thing-type.tibberpulselocal.meter.channel.power-l3.description = Active power on phase L3.
thing-type.tibberpulselocal.meter.channel.voltage-l1.label = Voltage L1
thing-type.tibberpulselocal.meter.channel.voltage-l1.description = Voltage on phase L1.
thing-type.tibberpulselocal.meter.channel.voltage-l2.label = Voltage L2
thing-type.tibberpulselocal.meter.channel.voltage-l2.description = Voltage on phase L2.
thing-type.tibberpulselocal.meter.channel.voltage-l3.label = Voltage L3
thing-type.tibberpulselocal.meter.channel.voltage-l3.description = Voltage on phase L3.

# thing types config

thing-type.config.tibberpulselocal.bridge.hostname.label = Hostname
thing-type.config.tibberpulselocal.bridge.hostname.description = Host name or IP address of the bridge, without scheme, port, or path.
thing-type.config.tibberpulselocal.bridge.password.label = Password
thing-type.config.tibberpulselocal.bridge.password.description = Password of the bridge web interface, printed as a code on the bridge label.
thing-type.config.tibberpulselocal.meter.deviceId.label = Device ID
thing-type.config.tibberpulselocal.meter.deviceId.description = Device id of the Pulse, 16 hexadecimal digits. Meters found on the stream of the bridge are offered in the inbox with their id.
thing-type.config.tibberpulselocal.meter.staleTimeout.label = Stale Timeout
thing-type.config.tibberpulselocal.meter.staleTimeout.description = Seconds without a valid reading after which the meter goes offline and its live values become undefined.

# channel types

channel-type.tibberpulselocal.energy-export.label = Energy Export
channel-type.tibberpulselocal.energy-export.description = Total energy fed into the grid. Keeps its last value when the meter goes stale.
channel-type.tibberpulselocal.energy-import.label = Energy Import
channel-type.tibberpulselocal.energy-import.description = Total energy drawn from the grid. Keeps its last value when the meter goes stale.
channel-type.tibberpulselocal.frequency.label = Frequency
channel-type.tibberpulselocal.frequency.description = Grid frequency.
channel-type.tibberpulselocal.last-update.label = Last Update
channel-type.tibberpulselocal.last-update.description = Time of the latest valid reading received for this meter.
channel-type.tibberpulselocal.last-update.state.pattern = %1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS
channel-type.tibberpulselocal.phase-current.label = Phase Current
channel-type.tibberpulselocal.phase-current.description = Current on one phase.
channel-type.tibberpulselocal.phase-power.label = Phase Power
channel-type.tibberpulselocal.phase-power.description = Active power on one phase.
channel-type.tibberpulselocal.phase-voltage.label = Phase Voltage
channel-type.tibberpulselocal.phase-voltage.description = Voltage on one phase.
channel-type.tibberpulselocal.power.label = Power
channel-type.tibberpulselocal.power.description = Net active power, positive when drawn from the grid and negative when fed into it.

# thing status descriptions

offline.conf-error.invalid-hostname = The host name of the bridge is not valid. Use a host name or IP address without scheme or path.
offline.conf-error.empty-password = No password is set for the bridge.
offline.conf-error.invalid-device-id = The device id is not valid. It must have 16 hexadecimal digits.
offline.conf-error.invalid-stale-timeout = The stale timeout must be at least 10 seconds.
offline.conf-error.no-bridge = No Tibber Pulse Bridge is associated with this meter.
offline.conf-error.password-rejected = The bridge rejected the password.
offline.comm-error.no-stream = The bridge firmware does not offer the stream.
offline.comm-error.http-status = The bridge answered with HTTP status {0}.
offline.comm-error.unreachable = The bridge could not be reached.
offline.comm-error.closed-by-bridge = The bridge closed the stream. Another client may have taken it.
offline.comm-error.silent = No data received from the bridge. Another client may hold the stream.
offline.comm-error.invalid-data = The bridge sent invalid data.
offline.comm-error.no-reading = No valid reading for {0} seconds.
