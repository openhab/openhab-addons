# thing types config

thing-type.config.solarmax.inverter.deviceAddress.label = Device Address
thing-type.config.solarmax.inverter.deviceAddress.description = Device address for devices connected serially (defaults to 1)
thing-type.config.solarmax.inverter.host.label = Host
thing-type.config.solarmax.inverter.host.description = Hostname or IP Address
thing-type.config.solarmax.inverter.offlineAfterFailures.label = Offline After Failures
thing-type.config.solarmax.inverter.offlineAfterFailures.description = Number of failed refreshes in a row after which the thing goes OFFLINE. Until then the channels keep their last values. (defaults to 3)
thing-type.config.solarmax.inverter.portNumber.label = Port Number
thing-type.config.solarmax.inverter.portNumber.description = Port Number (defaults to 12345)
thing-type.config.solarmax.inverter.refreshInterval.label = Refresh Interval
thing-type.config.solarmax.inverter.refreshInterval.description = Refresh Interval in seconds (defaults to 15)
thing-type.config.solarmax.inverter.retries.label = Retries
thing-type.config.solarmax.inverter.retries.description = How often a failed request (connection error, no or invalid response) is repeated within one refresh. A retry is skipped if it would not fit into the refresh interval. (defaults to 1)
thing-type.config.solarmax.inverter.retryDelay.label = Retry Delay
thing-type.config.solarmax.inverter.retryDelay.description = Pause in milliseconds before a failed request is repeated (defaults to 500)
thing-type.config.solarmax.inverter.timeout.label = Timeout
thing-type.config.solarmax.inverter.timeout.description = Timeout in milliseconds for connecting and for waiting for a response (defaults to 3000, as recommended by the MaxComm protocol description)

