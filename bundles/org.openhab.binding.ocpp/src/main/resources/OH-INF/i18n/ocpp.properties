# add-on

addon.ocpp.name = OCPP Binding
addon.ocpp.description = Connects OCPP 1.6-J chargers (EV charge points) to openHAB as an OCPP central system.

# thing types

thing-type.ocpp.chargepoint.label = OCPP Charge Point
thing-type.ocpp.chargepoint.description = A single charger identified by its OCPP charge point id.
thing-type.ocpp.connector.label = OCPP Connector
thing-type.ocpp.connector.description = A single connector (outlet) of a charger.
thing-type.ocpp.connector.channel.current-import-l1.label = Current L1
thing-type.ocpp.connector.channel.current-import-l2.label = Current L2
thing-type.ocpp.connector.channel.current-import-l3.label = Current L3
thing-type.ocpp.connector.channel.meter-start.label = Meter Start
thing-type.ocpp.connector.channel.meter-stop.label = Meter Stop
thing-type.ocpp.connector.channel.timestamp.label = Meter Timestamp
thing-type.ocpp.connector.channel.timestamp-start.label = Transaction Start Time
thing-type.ocpp.connector.channel.timestamp-stop.label = Transaction Stop Time
thing-type.ocpp.connector.channel.voltage-l1.label = Voltage L1
thing-type.ocpp.connector.channel.voltage-l2.label = Voltage L2
thing-type.ocpp.connector.channel.voltage-l3.label = Voltage L3
thing-type.ocpp.server.label = OCPP Server
thing-type.ocpp.server.description = OCPP 1.6-J central system endpoint. Chargers connect to ws://<host>:<port>/<chargePointId>.

# thing types config

thing-type.config.ocpp.chargepoint.chargePointId.label = Charge Point Id
thing-type.config.ocpp.chargepoint.chargePointId.description = The charger's OCPP identity — the path of the WebSocket URL it dials, without the leading slash (e.g. charger, or site/charger).
thing-type.config.ocpp.chargepoint.configSettleSeconds.label = Config Settle Seconds
thing-type.config.ocpp.chargepoint.configSettleSeconds.description = Delay after BootNotification before sending the configuration burst. Some chargers are not ready to answer ChangeConfiguration immediately.
thing-type.config.ocpp.chargepoint.heartbeat.label = Heartbeat Interval
thing-type.config.ocpp.chargepoint.heartbeat.description = Per-charger heartbeat interval returned on boot, overriding the server default. Also sizes the liveness window. 0 uses the server default.
thing-type.config.ocpp.chargepoint.meterless.label = Meter-less Charger
thing-type.config.ocpp.chargepoint.meterless.description = The charger has no internal meter; only the periodic clock-aligned emission is disabled and meter measurand configuration is skipped.
thing-type.config.ocpp.connector.connectorId.label = Connector Id
thing-type.config.ocpp.connector.connectorId.description = OCPP connector number (1..N).
thing-type.config.ocpp.connector.forceTxDefaultProfile.label = Force TxDefaultProfile
thing-type.config.ocpp.connector.forceTxDefaultProfile.description = Always send a TxDefaultProfile for the charge limit, even during a transaction. Needed for chargers that reject a TxProfile outside a transaction (e.g. Phoenix CHARX).
thing-type.config.ocpp.connector.hardwareMaxCurrentKey.label = Hardware Max Current Key
thing-type.config.ocpp.connector.hardwareMaxCurrentKey.description = Vendor ChangeConfiguration key backing the hardware maximum current channel. Empty disables that channel.
thing-type.config.ocpp.connector.meterValuesPollSeconds.label = Meter Values Poll Interval
thing-type.config.ocpp.connector.meterValuesPollSeconds.description = Poll this connector for MeterValues every N seconds via TriggerMessage. 0 disables polling.
thing-type.config.ocpp.connector.profileMinIntervalMs.label = Charging Profile Min Interval
thing-type.config.ocpp.connector.profileMinIntervalMs.description = Minimum spacing between SetChargingProfile sends. Rapid changes are coalesced. 0 disables.
thing-type.config.ocpp.connector.remoteStartTag.label = Remote Start Tag
thing-type.config.ocpp.connector.remoteStartTag.description = idTag used when starting a transaction via the charging channel.
thing-type.config.ocpp.connector.nominalVoltage.label = Nominal Voltage
thing-type.config.ocpp.connector.nominalVoltage.description = Line voltage used to convert an amperes charge limit to watts for a charger that only accepts a power limit. W = A x V x phases.
thing-type.config.ocpp.connector.phases.label = Phases
thing-type.config.ocpp.connector.phases.description = Phases assumed when converting the amperes charge limit to watts for a power-only charger: 1 for single-phase, 3 for three-phase.
thing-type.config.ocpp.connector.stuckStateRecovery.label = Stuck State Recovery
thing-type.config.ocpp.connector.stuckStateRecovery.description = Send an UnlockConnector if the connector stays in a transient state (Preparing/Finishing) too long. Off by default: those are normal states and unlocking is a physical side effect, so enable it only for a charger known to wedge there.
thing-type.config.ocpp.server.authPassword.label = Charger Password
thing-type.config.ocpp.server.authPassword.description = HTTP Basic authentication password chargers must present, with their charge point id as the username (OCPP security profile 1). Must be 16–20 visible ASCII characters — the OCPP library rejects other lengths before authentication even runs. Empty disables authentication — profile 0, for a trusted LAN only.
thing-type.config.ocpp.server.tlsKeystore.label = TLS Keystore
thing-type.config.ocpp.server.tlsKeystore.description = Path to a PKCS12 keystore holding the server's TLS certificate and key. When set, the OCPP endpoint runs over wss:// (TLS) instead of ws:// — OCPP security profile 2 with a Charger Password, or an encrypted profile 0 without. Empty leaves the endpoint plain.
thing-type.config.ocpp.server.tlsKeystorePassword.label = TLS Keystore Password
thing-type.config.ocpp.server.tlsKeystorePassword.description = Password for the TLS keystore (store and key password).
thing-type.config.ocpp.server.chargers.label = Permitted Chargers
thing-type.config.ocpp.server.chargers.description = Charge point id allow-list. Empty accepts any charger; otherwise unlisted chargers are rejected and closed.
thing-type.config.ocpp.server.clockAlignedDataInterval.label = Clock Aligned Data Interval
thing-type.config.ocpp.server.clockAlignedDataInterval.description = ClockAlignedDataInterval to configure. -1 leaves the charger unchanged.
thing-type.config.ocpp.server.disableRemoteTxAuthorization.label = Disable Remote Tx Authorization
thing-type.config.ocpp.server.disableRemoteTxAuthorization.description = Configure chargers with AuthorizeRemoteTxRequests=false so a RemoteStart needs no extra Authorize.
thing-type.config.ocpp.server.heartbeatInterval.label = Heartbeat Interval
thing-type.config.ocpp.server.heartbeatInterval.description = Heartbeat interval returned to chargers in the BootNotification response.
thing-type.config.ocpp.server.host.label = Bind Address
thing-type.config.ocpp.server.host.description = Local address to bind the WebSocket server to.
thing-type.config.ocpp.server.meterValueSampleInterval.label = Meter Value Sample Interval
thing-type.config.ocpp.server.meterValueSampleInterval.description = MeterValueSampleInterval to configure. -1 leaves the charger unchanged.
thing-type.config.ocpp.server.meterValuesData.label = Meter Values Data
thing-type.config.ocpp.server.meterValuesData.description = Comma-separated OCPP measurands to configure on chargers (MeterValuesSampledData/AlignedData). Empty leaves the charger unchanged.
thing-type.config.ocpp.server.pingInterval.label = Ping Interval
thing-type.config.ocpp.server.pingInterval.description = Seconds between server-driven WebSocket pings. A connection that does not answer with a pong within the interval is CLOSED — many chargers never answer pings, so leave this at 0 (disabled) unless you know yours does. Liveness is tracked via OCPP heartbeats regardless.
thing-type.config.ocpp.server.port.label = Port
thing-type.config.ocpp.server.port.description = TCP port the OCPP server listens on.
thing-type.config.ocpp.server.requestTimeoutSeconds.label = Request Timeout
thing-type.config.ocpp.server.requestTimeoutSeconds.description = Seconds before an unanswered request to a charger fails. The OCPP library itself never times a request out, so this bound is what keeps callers from waiting forever.
thing-type.config.ocpp.server.tags.label = Authorized Tags
thing-type.config.ocpp.server.tags.description = idTag whitelist. Empty accepts every tag; otherwise unknown tags are rejected.
thing-type.config.ocpp.server.vendorConfig.label = Vendor Configuration
thing-type.config.ocpp.server.vendorConfig.description = Extra ChangeConfiguration entries as key=value, applied on boot.

# channel types

channel-type.ocpp.availability.label = Available
channel-type.ocpp.availability.description = OCPP availability (Operative/Inoperative) via ChangeAvailability.
channel-type.ocpp.cable-connected.label = Cable Connected
channel-type.ocpp.cable-connected.description = Whether a vehicle cable is plugged in.
channel-type.ocpp.charge-limit.label = Charge Current Limit
channel-type.ocpp.charge-limit.description = Maximum charging current applied via SetChargingProfile.
channel-type.ocpp.power-limit.label = Charge Power Limit
channel-type.ocpp.power-limit.description = Maximum charging power. Used for a charger that only accepts a power limit; when set it overrides the current limit. Leave unset to use the charge current limit.
channel-type.ocpp.number-phases.label = Charging Phases
channel-type.ocpp.number-phases.description = Number of phases to charge on, sent in the charging profile; 0 clears the request so the charger uses its default. Only a charger that supports phase switching acts on it.
channel-type.ocpp.charge-point-status.label = Status
channel-type.ocpp.charge-point-status.description = OCPP connector status (Available, Preparing, Charging, SuspendedEV, ...).
channel-type.ocpp.charging.label = Charging Session
channel-type.ocpp.charging.description = ON while a transaction is active; command to start/stop remotely.
channel-type.ocpp.connected.label = Connected
channel-type.ocpp.connected.description = Whether the charger currently has an open session.
channel-type.ocpp.current-measure.label = Current
channel-type.ocpp.current-offered.label = Current Offered
channel-type.ocpp.current-offered.description = Current offered to the vehicle (MeterValues Current.Offered).
channel-type.ocpp.current-phase.label = Current
channel-type.ocpp.current-phase.description = Imported current on one phase (MeterValues Current.Import).
channel-type.ocpp.energy-active-import.label = Total Energy
channel-type.ocpp.energy-active-import.description = Energy register (MeterValues Energy.Active.Import.Register).
channel-type.ocpp.energy.label = Energy
channel-type.ocpp.frequency.label = Frequency
channel-type.ocpp.hardware-max-current.label = Hardware Max Current
channel-type.ocpp.hardware-max-current.description = Charger hardware current ceiling, written via a vendor ChangeConfiguration key.
channel-type.ocpp.id-tag.label = Id Tag
channel-type.ocpp.id-tag.description = The idTag of the active transaction.
channel-type.ocpp.last-seen.label = Last Seen
channel-type.ocpp.last-seen.description = Timestamp of the last contact from the charger (a message, or the session opening).
channel-type.ocpp.pause.label = Pause
channel-type.ocpp.pause.description = Pause charging (charging profile limit 0) without ending the transaction.
channel-type.ocpp.power-active-import.label = Active Power
channel-type.ocpp.power-active-import.description = Active power imported (MeterValues Power.Active.Import).
channel-type.ocpp.power-active.label = Active Power
channel-type.ocpp.power-factor.label = Power Factor
channel-type.ocpp.power-offered.label = Power Offered
channel-type.ocpp.power-offered.description = Power offered to the vehicle (MeterValues Power.Offered).
channel-type.ocpp.power-reactive.label = Reactive Power
channel-type.ocpp.reset.label = Reset
channel-type.ocpp.reset.description = Momentary — soft reset the charge point (Reset).
channel-type.ocpp.rpm.label = RPM
channel-type.ocpp.soc.label = State of Charge
channel-type.ocpp.temperature.label = Temperature
channel-type.ocpp.timestamp.label = Timestamp
channel-type.ocpp.transaction-id.label = Transaction Id
channel-type.ocpp.unlock.label = Unlock Connector
channel-type.ocpp.unlock.description = Momentary — unlock the connector (UnlockConnector).
channel-type.ocpp.voltage-measure.label = Voltage
channel-type.ocpp.voltage-phase.label = Voltage
channel-type.ocpp.voltage-phase.description = Voltage on one phase (MeterValues Voltage).
