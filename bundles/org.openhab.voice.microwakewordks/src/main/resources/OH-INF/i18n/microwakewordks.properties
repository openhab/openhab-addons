# add-on

addon.microwakewordks.name = microWakeWord Keyword Spotter
addon.microwakewordks.description = This voice service spots wake words offline with microWakeWord, the wake word detector of ESPHome voice devices.

# service

voice.config.microwakewordks.probabilityCutoff.label = Probability Cutoff
voice.config.microwakewordks.probabilityCutoff.description = Average probability above which the wake word counts as detected. Lower values detect the wake word more easily but cause more false detections. Leave empty to use the cutoff of the model.
