# add-on

addon.atagone.name = ATAG ONE Binding
addon.atagone.description = Integrates the ATAG ONE smart thermostat via its local LAN API, with no cloud connection or MQTT broker required. Auto-discovers devices via UDP broadcast on port 11000.

# thing types

thing-type.atagone.thermostat.label = ATAG ONE Thermostat
thing-type.atagone.thermostat.description = ATAG ONE smart thermostat — auto-discovered via UDP broadcast or configured manually.

# thing types config

thing-type.config.atagone.thermostat.clientId.label = Client ID
thing-type.config.atagone.thermostat.clientId.description = Stable pseudo-MAC used to identify this binding to the thermostat. Auto-generated on first pairing — leave blank.
thing-type.config.atagone.thermostat.hostname.label = Hostname
thing-type.config.atagone.thermostat.hostname.description = IP address or hostname of the ATAG ONE thermostat.
thing-type.config.atagone.thermostat.port.label = Port
thing-type.config.atagone.thermostat.port.description = Local API port (default 10000).
thing-type.config.atagone.thermostat.refreshInterval.label = Refresh Interval
thing-type.config.atagone.thermostat.refreshInterval.description = How often the thermostat is polled (seconds).

# channel group types

channel-group-type.atagone.alerts.label = Alerts
channel-group-type.atagone.alerts.description = Active device and boiler error codes.
channel-group-type.atagone.control.label = Operating Mode
channel-group-type.atagone.control.description = Active preset and timed modes (vacation, extend, fireplace).
channel-group-type.atagone.device.label = Device
channel-group-type.atagone.device.description = Thermostat hardware diagnostics — WiFi, power supply, and controller health.
channel-group-type.atagone.heating.label = Central Heating
channel-group-type.atagone.heating.description = Central heating circuit status and diagnostics.
channel-group-type.atagone.hotwater.label = Hot Water
channel-group-type.atagone.hotwater.description = Domestic hot water status and diagnostics.

# channel types

channel-type.atagone.average-outside-temperature.label = Average Outside Temperature
channel-type.atagone.average-outside-temperature.description = Weighted average outside temperature used by the regulation algorithm.
channel-type.atagone.boiler-errors.label = Boiler Errors
channel-type.atagone.boiler-errors.description = Active boiler error codes, comma-separated. Empty when there are none.
channel-type.atagone.boiler-return-temperature.label = Boiler Return Temperature
channel-type.atagone.boiler-return-temperature.description = Temperature of water returning to the boiler.
channel-type.atagone.boiler-temperature.label = Boiler Flow Temperature
channel-type.atagone.boiler-temperature.description = Temperature of water flowing out of the boiler.
channel-type.atagone.burner-target.label = Burner Target
channel-type.atagone.burner-target.description = What the burner is currently heating.
channel-type.atagone.burner-target.state.option.none = None
channel-type.atagone.burner-target.state.option.ch = Central Heating
channel-type.atagone.burner-target.state.option.dhw = Hot Water
channel-type.atagone.burning-hours.label = Burning Hours
channel-type.atagone.burning-hours.description = Total hours the burner has been running.
channel-type.atagone.ch-control-mode.label = Heating Control Type
channel-type.atagone.ch-control-mode.description = Whether heating is controlled by the room sensor or by an outdoor-temperature-driven curve (no room setpoint). A system-level setting — change it on the thermostat itself, not here.
channel-type.atagone.ch-control-mode.state.option.room = Room
channel-type.atagone.ch-control-mode.state.option.weather = Weather
channel-type.atagone.ch-return-temperature.label = Heating Circuit Return Temperature
channel-type.atagone.ch-return-temperature.description = Temperature of water returning from the heating circuit to the boiler.
channel-type.atagone.ch-setpoint.label = Boiler Target Water Temperature
channel-type.atagone.ch-setpoint.description = Water temperature the boiler is currently targeting for central heating. Reads 0 °C when there's no heating demand.
channel-type.atagone.ch-water-pressure.label = CH Water Pressure
channel-type.atagone.ch-water-pressure.description = Central heating circuit water pressure.
channel-type.atagone.ch-water-temperature.label = Heating Circuit Temperature
channel-type.atagone.ch-water-temperature.description = Temperature of the water circulating in the central heating circuit. Reads ambient temperature when the boiler is idle.
channel-type.atagone.device-errors.label = Device Errors
channel-type.atagone.device-errors.description = Active thermostat error codes, comma-separated. Empty when there are none.
channel-type.atagone.dhw-flow-rate.label = DHW Flow Rate
channel-type.atagone.dhw-flow-rate.description = Current hot water flow rate.
channel-type.atagone.dhw-target-temperature.label = Hot Water Target Temperature
channel-type.atagone.dhw-target-temperature.description = Target temperature for the hot water supply (taps and shower), reflecting whichever schedule period is currently active. Read-only: writing this field has no effect on the device — the actual user-settable value is the hot water schedule's base temperature, not exposed as a channel yet.
channel-type.atagone.dhw-temperature.label = Hot Water Temperature
channel-type.atagone.dhw-temperature.description = Current temperature of the hot water supply (taps and shower).
channel-type.atagone.extend-duration.label = Extend Duration
channel-type.atagone.extend-duration.description = Extra time added on top of the remaining schedule when extend mode starts, in whole hours — not a fixed session length. Setting this stores the value for next time; it does not start extend mode. Unlike holiday and fireplace, this value is kept after extend mode ends.
channel-type.atagone.extend-remaining.label = Extend Remaining
channel-type.atagone.extend-remaining.description = Time remaining in the current extend session.
channel-type.atagone.fireplace-duration.label = Fireplace Duration
channel-type.atagone.fireplace-duration.description = How long fireplace mode runs for, in whole hours. Setting this stores the duration for next time — it does not start fireplace mode. Resets to 1 hour each time fireplace mode ends. Ending fireplace mode requires a button press on the thermostat display.
channel-type.atagone.fireplace-remaining.label = Fireplace Remaining
channel-type.atagone.fireplace-remaining.description = Time remaining in the current fireplace session.
channel-type.atagone.flame.label = Flame
channel-type.atagone.flame.description = ON when the burner is actively firing.
channel-type.atagone.max-boiler-temperature.label = Maximum Boiler Temperature
channel-type.atagone.max-boiler-temperature.description = Maximum boiler water temperature limit.
channel-type.atagone.memory-allocation.label = Memory Allocation
channel-type.atagone.memory-allocation.description = Thermostat memory usage indicator, for diagnostics only.
channel-type.atagone.min-modulation-level.label = Minimum Modulation Level
channel-type.atagone.min-modulation-level.description = Minimum output level the burner can sustain.
channel-type.atagone.modulation-level.label = Modulation Level
channel-type.atagone.modulation-level.description = How hard the burner is currently working, as a percentage of its maximum output.
channel-type.atagone.outside-temperature.label = Outside Temperature (boiler estimate)
channel-type.atagone.outside-temperature.description = Outside temperature as estimated by the boiler. May be stale outside the heating season — use an independent sensor for reliable year-round readings.
channel-type.atagone.pcb-temperature.label = PCB Temperature
channel-type.atagone.pcb-temperature.description = Temperature inside the thermostat's circuit board.
channel-type.atagone.preset-mode-duration.label = Preset Mode Duration
channel-type.atagone.preset-mode-duration.description = Time remaining in the active timed mode (extend, holiday, or fireplace). Not shown in manual or auto mode.
channel-type.atagone.preset-mode.label = Preset Mode
channel-type.atagone.preset-mode.description = The thermostat's active mode. Set to auto to follow the schedule, or to holiday, extend, or fireplace to start that mode using its currently configured duration. Manual can only be set on the thermostat itself.
channel-type.atagone.preset-mode.state.option.manual = Manual
channel-type.atagone.preset-mode.state.option.auto = Auto
channel-type.atagone.preset-mode.state.option.holiday = Holiday / Vacation
channel-type.atagone.preset-mode.state.option.fireplace = Fireplace
channel-type.atagone.report-time.label = Report Time
channel-type.atagone.report-time.description = When the thermostat last reported data.
channel-type.atagone.resets.label = Controller Resets
channel-type.atagone.resets.description = Number of times the thermostat's controller has restarted.
channel-type.atagone.room-temperature.label = Room Temperature
channel-type.atagone.room-temperature.description = Room temperature measured by the thermostat's built-in sensor.
channel-type.atagone.shown-set-temperature.label = Displayed Setpoint
channel-type.atagone.shown-set-temperature.description = Setpoint currently shown on the thermostat's display.
channel-type.atagone.target-temperature.label = Target Temperature
channel-type.atagone.target-temperature.description = Room temperature setpoint for the currently active preset.
channel-type.atagone.time-to-target.label = Time to Target
channel-type.atagone.time-to-target.description = Estimated time until the room reaches the target temperature.
channel-type.atagone.vacation-duration.label = Vacation Duration
channel-type.atagone.vacation-duration.description = How long holiday mode runs for, in whole days. Setting this stores the duration for next time — it does not start holiday mode. Resets to 0 each time holiday mode ends.
channel-type.atagone.vacation-end.label = Vacation End
channel-type.atagone.vacation-end.description = When the current holiday period ends.
channel-type.atagone.vacation-remaining.label = Vacation Remaining
channel-type.atagone.vacation-remaining.description = Time remaining in the current holiday period.
channel-type.atagone.vacation-start.label = Vacation Start
channel-type.atagone.vacation-start.description = When the current holiday period started.
channel-type.atagone.vacation-temperature.label = Vacation Temperature
channel-type.atagone.vacation-temperature.description = Configured setpoint for holiday mode. Shows the active setpoint while holiday mode is running, otherwise the stored default. To change the live setpoint while any mode is active, use target-temperature instead — writing here has not been confirmed to take effect immediately.
channel-type.atagone.voltage.label = Supply Voltage
channel-type.atagone.voltage.description = Thermostat supply voltage.
channel-type.atagone.weather-status.label = Weather Status
channel-type.atagone.weather-status.description = Current weather condition reported by the thermostat.
channel-type.atagone.weather-status.state.option.sunny = Sunny
channel-type.atagone.weather-status.state.option.clear = Clear
channel-type.atagone.weather-status.state.option.rainy = Rainy
channel-type.atagone.weather-status.state.option.snowy = Snowy
channel-type.atagone.weather-status.state.option.hail = Hail
channel-type.atagone.weather-status.state.option.windy = Windy
channel-type.atagone.weather-status.state.option.fog = Fog
channel-type.atagone.weather-status.state.option.cloudy = Cloudy
channel-type.atagone.weather-status.state.option.partly-sunny = Partly Sunny
channel-type.atagone.weather-status.state.option.partly-cloudy = Partly Cloudy
channel-type.atagone.weather-status.state.option.pouring = Pouring
channel-type.atagone.weather-status.state.option.lightning = Lightning
channel-type.atagone.weather-status.state.option.hurricane = Hurricane
channel-type.atagone.weather-status.state.option.unknown = Unknown
channel-type.atagone.wifi-signal.label = WiFi Signal
channel-type.atagone.wifi-signal.description = WiFi signal strength. Closer to 0 is stronger.

