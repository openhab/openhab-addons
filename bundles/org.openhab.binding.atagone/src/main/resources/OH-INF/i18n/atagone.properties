# thing actions

action.activate-vacation.label = Activate Vacation
action.activate-vacation.description = Activates vacation/holiday mode immediately for the given duration.
action.activate-vacation.input.durationSeconds.label = Duration (s)
action.activate-vacation.input.durationSeconds.description = Vacation duration in seconds (must be a whole number of days).

action.activate-extend.label = Activate Extend
action.activate-extend.description = Activates extend mode immediately, additive to the time remaining until the next schedule boundary.
action.activate-extend.input.durationSeconds.label = Duration (s)
action.activate-extend.input.durationSeconds.description = Additional duration in seconds (must be a whole number of 15-minute increments).

action.activate-fireplace.label = Activate Fireplace
action.activate-fireplace.description = Activates fireplace mode immediately for the given duration.
action.activate-fireplace.input.durationSeconds.label = Duration (s)
action.activate-fireplace.input.durationSeconds.description = Fireplace duration in seconds (must be a whole number of hours).

action.set-ch-schedule-period.label = Set CH Schedule Period
action.set-ch-schedule-period.description = Sets or replaces one period in a weekday's CH schedule; rejected if the period overlaps another on the same weekday.
action.set-ch-schedule-period.input.weekday.label = Weekday
action.set-ch-schedule-period.input.weekday.description = Day of the week (monday..sunday).
action.set-ch-schedule-period.input.periodIndex.label = Period Index
action.set-ch-schedule-period.input.periodIndex.description = Zero-based index; equal to the current period count to append a new one.
action.set-ch-schedule-period.input.startMinutes.label = Start (min)
action.set-ch-schedule-period.input.startMinutes.description = Period start in minutes since midnight.
action.set-ch-schedule-period.input.endMinutes.label = End (min)
action.set-ch-schedule-period.input.endMinutes.description = Period end in minutes since midnight.
action.set-ch-schedule-period.input.temperatureCelsius.label = Temperature (°C)
action.set-ch-schedule-period.input.temperatureCelsius.description = Target temperature for this period.

action.clear-ch-schedule-period.label = Clear CH Schedule Period
action.clear-ch-schedule-period.description = Removes one period from a weekday's CH schedule, shifting later periods down.
action.clear-ch-schedule-period.input.weekday.label = Weekday
action.clear-ch-schedule-period.input.weekday.description = Day of the week (monday..sunday).
action.clear-ch-schedule-period.input.periodIndex.label = Period Index
action.clear-ch-schedule-period.input.periodIndex.description = Zero-based index of the period to remove.

action.set-dhw-schedule-period.label = Set DHW Schedule Period
action.set-dhw-schedule-period.description = Sets or replaces one period in a weekday's DHW schedule; rejected if the period overlaps another on the same weekday.
action.set-dhw-schedule-period.input.weekday.label = Weekday
action.set-dhw-schedule-period.input.weekday.description = Day of the week (monday..sunday).
action.set-dhw-schedule-period.input.periodIndex.label = Period Index
action.set-dhw-schedule-period.input.periodIndex.description = Zero-based index; equal to the current period count to append a new one.
action.set-dhw-schedule-period.input.startMinutes.label = Start (min)
action.set-dhw-schedule-period.input.startMinutes.description = Period start in minutes since midnight.
action.set-dhw-schedule-period.input.endMinutes.label = End (min)
action.set-dhw-schedule-period.input.endMinutes.description = Period end in minutes since midnight.
action.set-dhw-schedule-period.input.temperatureCelsius.label = Temperature (°C)
action.set-dhw-schedule-period.input.temperatureCelsius.description = Target temperature for this period.

action.clear-dhw-schedule-period.label = Clear DHW Schedule Period
action.clear-dhw-schedule-period.description = Removes one period from a weekday's DHW schedule, shifting later periods down.
action.clear-dhw-schedule-period.input.weekday.label = Weekday
action.clear-dhw-schedule-period.input.weekday.description = Day of the week (monday..sunday).
action.clear-dhw-schedule-period.input.periodIndex.label = Period Index
action.clear-dhw-schedule-period.input.periodIndex.description = Zero-based index of the period to remove.

action.set-ch-schedule.label = Set CH Schedule
action.set-ch-schedule.description = Replaces the CH schedule from a JSON object; weekdays omitted from the JSON are resent unchanged.
action.set-ch-schedule.input.json.label = Schedule JSON
action.set-ch-schedule.input.json.description = JSON with baseTemp and days matching the heating#schedule channel format.

action.set-dhw-schedule.label = Set DHW Schedule
action.set-dhw-schedule.description = Replaces the DHW schedule from a JSON object; weekdays omitted from the JSON are resent unchanged.
action.set-dhw-schedule.input.json.label = Schedule JSON
action.set-dhw-schedule.input.json.description = JSON with baseTemp and days matching the hotwater#schedule channel format.

action.cancel-mode.label = Cancel Mode
action.cancel-mode.description = Cancels any active timed preset and returns to schedule mode.
action.cancel-mode.output.label = Requires Physical Confirmation
action.cancel-mode.output.description = True if fireplace mode was active — the device requires a button press on the display to confirm the cancel.
