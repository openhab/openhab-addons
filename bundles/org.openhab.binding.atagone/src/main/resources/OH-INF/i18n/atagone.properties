# add-on

addon.atagone.name = ATAG ONE Binding
addon.atagone.description = Integrates the ATAG ONE smart thermostat via its local LAN API, with no cloud connection or MQTT broker required. Auto-discovers devices via UDP broadcast on port 11000.

# thing types

thing-type.atagone.thermostat.label = ATAG ONE Thermostat
thing-type.atagone.thermostat.description = ATAG ONE smart thermostat — auto-discovered via UDP broadcast or configured manually.

# thing types config

thing-type.config.atagone.thermostat.clientId.label = Client ID
thing-type.config.atagone.thermostat.clientId.description = Stable pseudo-MAC used to identify this binding to the thermostat. Auto-generated on first pairing — leave blank.
thing-type.config.atagone.thermostat.hostname.label = Hostname
thing-type.config.atagone.thermostat.hostname.description = IP address or hostname of the ATAG ONE thermostat.
thing-type.config.atagone.thermostat.port.label = Port
thing-type.config.atagone.thermostat.port.description = Local API port (default 10000).
thing-type.config.atagone.thermostat.refreshInterval.label = Refresh Interval
thing-type.config.atagone.thermostat.refreshInterval.description = How often the thermostat is polled (seconds).

