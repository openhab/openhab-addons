channel-type.atagone.extend-duration.label = Extend Duration
channel-type.atagone.extend-duration.description = Extra time added on top of the remaining schedule when extend mode starts — not a fixed session length. Setting this stores the value for next time; it does not start extend mode. Unlike holiday and fireplace, this value is kept after extend mode ends.
channel-type.atagone.extend-remaining.label = Extend Remaining
channel-type.atagone.extend-remaining.description = Time remaining in the current extend session.
channel-type.atagone.fireplace-duration.label = Fireplace Duration
channel-type.atagone.fireplace-duration.description = How long fireplace mode runs for. Setting this stores the duration for next time — it does not start fireplace mode. Resets to 1 hour each time fireplace mode ends. Ending fireplace mode requires a button press on the thermostat display.
