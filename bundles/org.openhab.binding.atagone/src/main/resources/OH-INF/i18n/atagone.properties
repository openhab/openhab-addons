channel-type.atagone.dhw-target-temperature.label = Hot Water Target Temperature
channel-type.atagone.dhw-target-temperature.description = Target temperature for the hot water supply (taps and shower), reflecting whichever schedule period is currently active.
channel-type.atagone.dhw-temperature.label = Hot Water Temperature
channel-type.atagone.dhw-temperature.description = Current temperature of the hot water supply (taps and shower).
channel-type.atagone.display-brightness.label = Display Brightness
