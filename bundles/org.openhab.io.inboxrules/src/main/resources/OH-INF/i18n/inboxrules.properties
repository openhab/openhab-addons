# add-on

addon.inboxrules.name = Inbox Rules
addon.inboxrules.description = Configurable automatic inbox approval system for openHAB.

# add-on config

io.config.inboxrules.enabled.label = Enable Inbox Rules
io.config.inboxrules.enabled.description = Enable or disable all inbox auto-approval rules and customizations.
io.config.inboxrules.rules.label = Auto-approve rules
io.config.inboxrules.rules.description = Rules are evaluated sequentially until a match is found. Prefix with <code>#</code> or <code>//</code> to disable a rule.<br> Syntax: <code>criteriaKey=value; actionKey=value</code> (supports <code>*</code> and <code>?</code> wildcards)<br> <b>Filters:</b> <code>thingUid</code>, <code>bridgeUid</code>, <code>label</code>, <code>representationProperty</code>, <code>propertyMatch</code>, <code>configMatch</code><br> <b>Actions:</b> <code>setLabel</code>, <code>setLocation</code>, <code>setProperties</code>, <code>setConfig</code> (optional post-approval customizations)<br> <b>Advanced:</b> Actions support interpolation (<code>${label}</code>, <code>${thingUID}</code>, <code>${bridgeUID}</code>, <code>${properties.name}</code>) and comma-separated values (e.g., <code>setProperties=room=Kitchen,source=${properties.id}</code>).<br> <b>Example:</b> <code>thingUid=hue:*; label=*Motion*; setLocation=Living Room; setLabel=${label} Sensor</code>
