# add-on

addon.jellyfin.name = Jellyfin Binding
addon.jellyfin.description = Binding for Jellyfin, the free and open-source media server. Integrates active client sessions for playback control and now-playing status.

# add-on config

addon.config.jellyfin.discoveryPort.label = Discovery Port
addon.config.jellyfin.discoveryPort.description = <p>UDP port used to broadcast discovery queries on the local network.</p> <p>This is the Jellyfin auto-discovery port (default <b>7359</b>), <em>not</em> the HTTP/HTTPS port used by the server for client connections.</p>
addon.config.jellyfin.discoveryTimeout.label = Discovery Timeout
addon.config.jellyfin.discoveryTimeout.description = <p>Maximum time (in milliseconds) to wait for discovery responses from servers on the network.</p> <p>Shorter timeouts make discovery faster but may miss slow or busy devices; longer timeouts increase discovery latency.</p>
addon.config.jellyfin.group.discovery.label = Discovery
addon.config.jellyfin.group.discovery.description = <p>Fine-tune Jellyfin server discovery behaviour on the local network.</p> <p>These settings only affect the UDP-based auto-discovery mechanism and do not change how the binding connects to the server over HTTP/HTTPS.</p>

# thing types

thing-type.jellyfin.client.label = Jellyfin Client
thing-type.jellyfin.client.description = <p>Represents a running Jellyfin client connected to a server.</p> <p>Each client corresponds to an active Jellyfin session (e.g. a browser tab, a TV app, or a mobile device). Channels allow controlling playback and receiving now-playing metadata.</p>
thing-type.jellyfin.server.label = Jellyfin Server
thing-type.jellyfin.server.description = <p>Represents a running Jellyfin server instance.</p> <p>The server bridge connects to the Jellyfin HTTP API and discovers active client sessions. Each discovered session becomes a <em>Jellyfin Client</em> thing.</p>

# thing types config

thing-type.config.jellyfin.client.group.images.label = Now Playing Images
thing-type.config.jellyfin.client.group.images.description = Download cover art for the item currently playing on this device.<br/> Each image type can be enabled independently. All types are disabled by default because image downloads add network load on every session update (every 30 seconds by default).<br/> <b>Supported image types:</b> <ul> <li><b>Primary</b> – Album/movie poster or main cover art</li> <li><b>Backdrop</b> – Full-resolution background/fanart</li> <li><b>Logo</b> – Transparent text or graphical logo</li> <li><b>Thumb</b> – Landscape thumbnail (episode still or wide-format preview)</li> <li><b>Disc</b> – CD, DVD or Blu-ray disc artwork</li> <li><b>Art</b> – ClearArt / transparent promotional artwork</li> <li><b>Banner</b> – Wide horizontal banner (TheTVDB-style)</li> </ul>
thing-type.config.jellyfin.client.imageArtEnabled.label = Enable Art Image
thing-type.config.jellyfin.client.imageArtEnabled.description = Download the ClearArt (transparent promotional artwork) for the item currently playing.<br/> When enabled, a <em>playing-item-image-art</em> channel is created automatically.
thing-type.config.jellyfin.client.imageArtWidth.label = Art Image Width
thing-type.config.jellyfin.client.imageArtWidth.description = Maximum width in pixels for the downloaded art image. Larger sizes provide better quality but consume more bandwidth and memory.
thing-type.config.jellyfin.client.imageArtWidth.option.128 = 128 px – Thumbnail
thing-type.config.jellyfin.client.imageArtWidth.option.256 = 256 px – Small
thing-type.config.jellyfin.client.imageArtWidth.option.512 = 512 px – Medium (default)
thing-type.config.jellyfin.client.imageArtWidth.option.1024 = 1024 px – Large
thing-type.config.jellyfin.client.imageBackdropEnabled.label = Enable Backdrop Image
thing-type.config.jellyfin.client.imageBackdropEnabled.description = Download the background fanart / backdrop image for the item currently playing. Typically a wide full-resolution scene image.<br/> When enabled, a <em>playing-item-image-backdrop</em> channel is created automatically.
thing-type.config.jellyfin.client.imageBackdropWidth.label = Backdrop Image Width
thing-type.config.jellyfin.client.imageBackdropWidth.description = Maximum width in pixels for the downloaded backdrop image. Larger sizes provide better quality but consume more bandwidth and memory.
thing-type.config.jellyfin.client.imageBackdropWidth.option.128 = 128 px – Thumbnail
thing-type.config.jellyfin.client.imageBackdropWidth.option.256 = 256 px – Small
thing-type.config.jellyfin.client.imageBackdropWidth.option.512 = 512 px – Medium (default)
thing-type.config.jellyfin.client.imageBackdropWidth.option.1024 = 1024 px – Large
thing-type.config.jellyfin.client.imageBannerEnabled.label = Enable Banner Image
thing-type.config.jellyfin.client.imageBannerEnabled.description = Download the wide horizontal banner (TheTVDB-style) for the item currently playing.<br/> When enabled, a <em>playing-item-image-banner</em> channel is created automatically.
thing-type.config.jellyfin.client.imageBannerWidth.label = Banner Image Width
thing-type.config.jellyfin.client.imageBannerWidth.description = Maximum width in pixels for the downloaded banner image. Larger sizes provide better quality but consume more bandwidth and memory.
thing-type.config.jellyfin.client.imageBannerWidth.option.128 = 128 px – Thumbnail
thing-type.config.jellyfin.client.imageBannerWidth.option.256 = 256 px – Small
thing-type.config.jellyfin.client.imageBannerWidth.option.512 = 512 px – Medium (default)
thing-type.config.jellyfin.client.imageBannerWidth.option.1024 = 1024 px – Large
thing-type.config.jellyfin.client.imageDiscEnabled.label = Enable Disc Image
thing-type.config.jellyfin.client.imageDiscEnabled.description = Download the CD, DVD or Blu-ray disc artwork for the item currently playing.<br/> When enabled, a <em>playing-item-image-disc</em> channel is created automatically.
thing-type.config.jellyfin.client.imageDiscWidth.label = Disc Image Width
thing-type.config.jellyfin.client.imageDiscWidth.description = Maximum width in pixels for the downloaded disc image. Larger sizes provide better quality but consume more bandwidth and memory.
thing-type.config.jellyfin.client.imageDiscWidth.option.128 = 128 px – Thumbnail
thing-type.config.jellyfin.client.imageDiscWidth.option.256 = 256 px – Small
thing-type.config.jellyfin.client.imageDiscWidth.option.512 = 512 px – Medium (default)
thing-type.config.jellyfin.client.imageDiscWidth.option.1024 = 1024 px – Large
thing-type.config.jellyfin.client.imageLogoEnabled.label = Enable Logo Image
thing-type.config.jellyfin.client.imageLogoEnabled.description = Download the transparent text or graphical logo for the item currently playing.<br/> When enabled, a <em>playing-item-image-logo</em> channel is created automatically.
thing-type.config.jellyfin.client.imageLogoWidth.label = Logo Image Width
thing-type.config.jellyfin.client.imageLogoWidth.description = Maximum width in pixels for the downloaded logo image. Larger sizes provide better quality but consume more bandwidth and memory.
thing-type.config.jellyfin.client.imageLogoWidth.option.128 = 128 px – Thumbnail
thing-type.config.jellyfin.client.imageLogoWidth.option.256 = 256 px – Small
thing-type.config.jellyfin.client.imageLogoWidth.option.512 = 512 px – Medium (default)
thing-type.config.jellyfin.client.imageLogoWidth.option.1024 = 1024 px – Large
thing-type.config.jellyfin.client.imagePrimaryEnabled.label = Enable Primary Image
thing-type.config.jellyfin.client.imagePrimaryEnabled.description = Download the primary cover art (album cover, movie poster, or main thumbnail) for the item currently playing.<br/> When enabled, a <em>playing-item-image-primary</em> channel is created automatically.
thing-type.config.jellyfin.client.imagePrimaryWidth.label = Primary Image Width
thing-type.config.jellyfin.client.imagePrimaryWidth.description = Maximum width in pixels for the downloaded primary image. Larger sizes provide better quality but consume more bandwidth and memory.
thing-type.config.jellyfin.client.imagePrimaryWidth.option.128 = 128 px – Thumbnail
thing-type.config.jellyfin.client.imagePrimaryWidth.option.256 = 256 px – Small
thing-type.config.jellyfin.client.imagePrimaryWidth.option.512 = 512 px – Medium (default)
thing-type.config.jellyfin.client.imagePrimaryWidth.option.1024 = 1024 px – Large
thing-type.config.jellyfin.client.imageThumbEnabled.label = Enable Thumb Image
thing-type.config.jellyfin.client.imageThumbEnabled.description = Download the landscape thumbnail (wide-format still or episode preview) for the item currently playing.<br/> When enabled, a <em>playing-item-image-thumb</em> channel is created automatically.
thing-type.config.jellyfin.client.imageThumbWidth.label = Thumb Image Width
thing-type.config.jellyfin.client.imageThumbWidth.description = Maximum width in pixels for the downloaded thumb image. Larger sizes provide better quality but consume more bandwidth and memory.
thing-type.config.jellyfin.client.imageThumbWidth.option.128 = 128 px – Thumbnail
thing-type.config.jellyfin.client.imageThumbWidth.option.256 = 256 px – Small
thing-type.config.jellyfin.client.imageThumbWidth.option.512 = 512 px – Medium (default)
thing-type.config.jellyfin.client.imageThumbWidth.option.1024 = 1024 px – Large
thing-type.config.jellyfin.client.serialNumber.label = Device ID
thing-type.config.jellyfin.client.serialNumber.description = The Jellyfin device ID as reported by the client application.
thing-type.config.jellyfin.server.discoverAndroidClients.label = Discover Android Clients
thing-type.config.jellyfin.server.discoverAndroidClients.description = Discover Jellyfin Android clients.<br/> Matches clients reporting as: <i>Jellyfin for Android</i>
thing-type.config.jellyfin.server.discoverAndroidTvClients.label = Discover Android TV Clients
thing-type.config.jellyfin.server.discoverAndroidTvClients.description = Discover Jellyfin Android TV clients.<br/> Matches clients reporting as: <i>Jellyfin for Android TV</i>
thing-type.config.jellyfin.server.discoverIosClients.label = Discover iOS Clients
thing-type.config.jellyfin.server.discoverIosClients.description = Discover iOS clients.<br/> Matches clients reporting as: <i>Jellyfin iOS</i>, <i>Swiftfin</i>, <i>Infuse</i>
thing-type.config.jellyfin.server.discoverKodiClients.label = Discover Kodi Clients
thing-type.config.jellyfin.server.discoverKodiClients.description = Discover Kodi clients.<br/> Matches clients reporting as: <i>JellyCon</i>, <i>Jellyfin for Kodi</i>
thing-type.config.jellyfin.server.discoverOtherClients.label = Discover Other Clients
thing-type.config.jellyfin.server.discoverOtherClients.description = Discover third-party clients not matched by any other category above.
thing-type.config.jellyfin.server.discoverRokuClients.label = Discover Roku Clients
thing-type.config.jellyfin.server.discoverRokuClients.description = Discover Roku clients.<br/> Matches clients reporting as: <i>Jellyfin for Roku</i>
thing-type.config.jellyfin.server.discoverWebClients.label = Discover Web Clients
thing-type.config.jellyfin.server.discoverWebClients.description = Discover Jellyfin Web clients.<br/> Matches clients reporting as: <i>Jellyfin Web</i>
thing-type.config.jellyfin.server.group.clientDiscoveryFilters.label = Client Discovery Filters
thing-type.config.jellyfin.server.group.clientDiscoveryFilters.description = Enable or disable automatic discovery for specific Jellyfin client categories.<br /> The category is determined by the client application name as reported to the Jellyfin server.<br /> <b>Note:</b> These settings only affect the openHAB Inbox; they do not remove already-discovered things.
thing-type.config.jellyfin.server.hostname.label = Hostname / IP Address
thing-type.config.jellyfin.server.hostname.description = Hostname or IP address of the Jellyfin server (e.g. <em>192.168.1.10</em> or <em>jellyfin.local</em>).
thing-type.config.jellyfin.server.path.label = Base Path
thing-type.config.jellyfin.server.path.description = <p>Optional URL path prefix when the Jellyfin server is hosted behind a reverse proxy at a sub-path.</p> <p>Example: <em>/jellyfin</em> if the server is reachable at <em>https://myhost/jellyfin</em>. Leave empty for root-hosted installations.</p>
thing-type.config.jellyfin.server.port.label = Port
thing-type.config.jellyfin.server.port.description = <p>HTTP or HTTPS port of the Jellyfin server.</p> <p>The default HTTP port is <b>8096</b>. When <em>Use HTTPS</em> is enabled, use the HTTPS port instead (typically <b>8920</b>).</p>
thing-type.config.jellyfin.server.refreshSeconds.label = Refresh Interval
thing-type.config.jellyfin.server.refreshSeconds.description = <p>How often (in seconds) the binding polls the Jellyfin server for the current playback state of all connected clients.</p> <p>Lower values provide more responsive state updates but increase server load. The default of <b>30 s</b> is suitable for most setups.</p>
thing-type.config.jellyfin.server.serverName.label = Server Name
thing-type.config.jellyfin.server.serverName.description = <p>Human-readable display name for this Jellyfin server.</p> <p>If left empty, the name is automatically retrieved from the server upon connection.</p>
thing-type.config.jellyfin.server.ssl.label = Use HTTPS (Experimental)
thing-type.config.jellyfin.server.ssl.description = <p><b>EXPERIMENTAL</b> — Connect to the Jellyfin server using HTTPS instead of plain HTTP.</p> <p>Enable this when the server is behind a reverse proxy with a valid TLS certificate. Make sure the <em>Port</em> is set to the corresponding HTTPS port.</p> <p>This feature has not been fully tested. Your feedback is welcome!</p>
thing-type.config.jellyfin.server.token.label = Access Token
thing-type.config.jellyfin.server.token.description = <p>API access token used to authenticate with the Jellyfin server.</p> <p>Generate a token in the Jellyfin web interface under <em>Dashboard → API Keys</em>. If left empty, the binding operates without authentication (only suitable for servers with public access enabled).</p>

# channel types

channel-type.jellyfin.browse-by-id-channel.label = Browse by ID
channel-type.jellyfin.browse-by-id-channel.description = Retrieve metadata or browse media based on the specified server ID.
channel-type.jellyfin.browse-by-terms-channel.label = Browse by Terms
channel-type.jellyfin.browse-by-terms-channel.description = Query the server for media matching the given search terms.
channel-type.jellyfin.media-audio-track-channel.label = Audio Track
channel-type.jellyfin.media-audio-track-channel.description = <p>Select the audio track for the current media item.</p> <p>Use the <b>zero-based stream index</b> to switch between available audio tracks (e.g., different languages or audio formats).</p> <p>Example: <b>0</b> for first track, <b>1</b> for second track, etc.</p>
channel-type.jellyfin.media-quality-channel.label = Streaming Quality
channel-type.jellyfin.media-quality-channel.description = <p>Set the maximum streaming bitrate to control video quality.</p> <p> Higher bitrates provide better quality but require more bandwidth: <ul> <li><b>140000</b> (140 Kbps): Low quality, minimal bandwidth</li> <li><b>500000</b> (500 Kbps): Medium quality, suitable for mobile</li> <li><b>1500000</b> (1.5 Mbps): High quality, SD streaming</li> <li><b>3000000</b> (3 Mbps): Very high quality, HD streaming</li> <li><b>8000000</b> (8 Mbps): Ultra quality, Full HD streaming</li> </ul> </p>
channel-type.jellyfin.media-quality-channel.state.option.140000 = Low (140 Kbps)
channel-type.jellyfin.media-quality-channel.state.option.500000 = Medium (500 Kbps)
channel-type.jellyfin.media-quality-channel.state.option.1500000 = High (1.5 Mbps)
channel-type.jellyfin.media-quality-channel.state.option.3000000 = Very High (3 Mbps)
channel-type.jellyfin.media-quality-channel.state.option.8000000 = Ultra (8 Mbps)
channel-type.jellyfin.media-repeat-channel.label = Repeat Mode
channel-type.jellyfin.media-repeat-channel.description = <p>Set the repeat mode for playback.</p> <p> <ul> <li><b>off</b>: Play queue once and stop</li> <li><b>one</b>: Repeat current item continuously</li> <li><b>all</b>: Repeat entire queue continuously</li> </ul> </p>
channel-type.jellyfin.media-repeat-channel.state.option.off = Off
channel-type.jellyfin.media-repeat-channel.state.option.one = Repeat One
channel-type.jellyfin.media-repeat-channel.state.option.all = Repeat All
channel-type.jellyfin.media-shuffle-channel.label = Shuffle
channel-type.jellyfin.media-shuffle-channel.description = <p>Toggle shuffle mode for the playback queue.</p> <p> <b>ON</b>: Items in the queue will play in random order.<br /> <b>OFF</b>: Items in the queue will play in sequential order. </p>
channel-type.jellyfin.media-stop-channel.label = Stop
channel-type.jellyfin.media-stop-channel.description = <p>Stop playback control.</p> <p>Send <b>ON</b> to stop playback. This ends playback and may reset the playback position depending on the client.</p> <p><b>Note:</b> Use the <em>media-control</em> channel for play, pause, next, previous, fast-forward, and rewind commands.</p>
channel-type.jellyfin.media-subtitle-channel.label = Subtitle
channel-type.jellyfin.media-subtitle-channel.description = <p>Select or disable the subtitle track for the current media item.</p> <p> Use the stream index to switch between available subtitle tracks: <ul> <li><b>-1</b>: Disable subtitles</li> <li><b>0</b>: First subtitle track</li> <li><b>1</b>: Second subtitle track</li> <li>etc.</li> </ul> </p>
channel-type.jellyfin.play-by-id-channel.label = Play by ID
channel-type.jellyfin.play-by-id-channel.description = Play a media item identified by the given server ID.
channel-type.jellyfin.play-by-terms-channel.label = Play by Terms
channel-type.jellyfin.play-by-terms-channel.description = Play media matching the given search terms (title, series, or other metadata).
channel-type.jellyfin.play-last-by-id-channel.label = Play Last by ID
channel-type.jellyfin.play-last-by-id-channel.description = Add the specified media ID to the end of the playback queue.
channel-type.jellyfin.play-last-by-terms-channel.label = Play Last by Terms
channel-type.jellyfin.play-last-by-terms-channel.description = Add the first media matching the terms to the end of the playback queue.
channel-type.jellyfin.play-next-by-id-channel.label = Play Next by ID
channel-type.jellyfin.play-next-by-id-channel.description = Add the specified media ID as the next item in the playback queue.
channel-type.jellyfin.play-next-by-terms-channel.label = Play Next by Terms
channel-type.jellyfin.play-next-by-terms-channel.description = Add the first media matching the terms as the next item in the playback queue.
channel-type.jellyfin.playing-item-episode-channel.label = Episode Number
channel-type.jellyfin.playing-item-episode-channel.description = Episode number of the currently playing episode (integer). Present only when item is an episode.
channel-type.jellyfin.playing-item-genres-channel.label = Genres
channel-type.jellyfin.playing-item-genres-channel.description = Comma-separated list of genres for the currently playing item.
channel-type.jellyfin.playing-item-id-channel.label = Playing Item ID
channel-type.jellyfin.playing-item-id-channel.description = Unique identifier of the item currently playing.
channel-type.jellyfin.playing-item-image-channel.label = Now Playing Image
channel-type.jellyfin.playing-item-image-channel.description = <p>Cover art image for the currently playing item.</p> <p>The image is fetched from the Jellyfin server and published as binary data. The image type (Primary, Backdrop, etc.) and maximum width are configurable per client.</p>
channel-type.jellyfin.playing-item-name-channel.label = Playing Item Name
channel-type.jellyfin.playing-item-name-channel.description = Name (title) of the item currently playing.
channel-type.jellyfin.playing-item-percentage-channel.label = Playback Percentage
channel-type.jellyfin.playing-item-percentage-channel.description = <p>Current playback position as a percentage (0–100%).</p> <p>Read the current position or send a percentage to seek. Values outside the 0–100 range are ignored.</p>
channel-type.jellyfin.playing-item-season-channel.label = Season Number
channel-type.jellyfin.playing-item-season-channel.description = Season number of the currently playing episode (integer). Present only when item is an episode.
channel-type.jellyfin.playing-item-season-name-channel.label = Season Name
channel-type.jellyfin.playing-item-season-name-channel.description = Season name for the currently playing item. Present only when the item is an episode.
channel-type.jellyfin.playing-item-second-channel.label = Playback Position
channel-type.jellyfin.playing-item-second-channel.description = <p>Current playback position.</p> <p>Read the current position or send a value (in seconds) to seek to that timestamp.</p>
channel-type.jellyfin.playing-item-series-name-channel.label = Series Name
channel-type.jellyfin.playing-item-series-name-channel.description = Series name for the currently playing item. Present only when the item is an episode.
channel-type.jellyfin.playing-item-total-seconds-channel.label = Total Duration
channel-type.jellyfin.playing-item-total-seconds-channel.description = Total duration of the currently playing item. Read-only.
channel-type.jellyfin.playing-item-type-channel.label = Item Type
channel-type.jellyfin.playing-item-type-channel.description = Media type of the currently playing item (e.g. Movie, Episode, Music).
channel-type.jellyfin.send-notification-channel.label = Send Notification
channel-type.jellyfin.send-notification-channel.description = Send a notification message to this client. The message is displayed as an overlay on the client's screen.

