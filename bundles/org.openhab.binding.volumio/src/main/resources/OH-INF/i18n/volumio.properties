# add-on

addon.volumio.name = Volumio Binding
addon.volumio.description = This is the binding for Volumio devices.

# thing types

thing-type.volumio.player.label = Volumio Device
thing-type.volumio.player.description = A Volumio device

# thing types config

thing-type.config.volumio.player.hostname.label = Hostname
thing-type.config.volumio.player.hostname.description = The hostname of your Volumio device
thing-type.config.volumio.player.port.label = Port
thing-type.config.volumio.player.port.description = The port of your Volumio device (default is 3000)
thing-type.config.volumio.player.protocol.label = Protocol
thing-type.config.volumio.player.protocol.description = The protocol of your Volumio device (default is http)
thing-type.config.volumio.player.protocol.option.http = http
thing-type.config.volumio.player.protocol.option.https = https
thing-type.config.volumio.player.timeout.label = Timeout
thing-type.config.volumio.player.timeout.description = Connection timeout in milliseconds (default is 5000)

# channel types

channel-type.volumio.add-to-favourites.label = Add to Favourites
channel-type.volumio.add-to-favourites.description = Send ON to add the current item to the Volumio favourites
channel-type.volumio.add-to-queue.label = Add to Queue
channel-type.volumio.add-to-queue.description = Add the item with the given URI to the end of the play queue
channel-type.volumio.album-art.label = Cover Art
channel-type.volumio.album-art.description = Cover Art for the currently played track
channel-type.volumio.album.label = Current Album
channel-type.volumio.album.description = Name of the album currently playing
channel-type.volumio.artist.label = Current Artist
channel-type.volumio.artist.description = Name of the artist currently playing
channel-type.volumio.audio-channels.label = Audio Channels
channel-type.volumio.audio-channels.description = Channel layout of the current item, as reported by Volumio
channel-type.volumio.bitdepth.label = Bit Depth
channel-type.volumio.bitdepth.description = Bit depth of the current item, as reported by Volumio
channel-type.volumio.clear-queue.label = Clear Queue
channel-type.volumio.clear-queue.description = Clear the current queue
channel-type.volumio.current-uri.label = Current URI
channel-type.volumio.current-uri.description = Unique URI of the item currently playing
channel-type.volumio.duration.label = Track Duration
channel-type.volumio.duration.description = Duration of the current track. 0 if the item has no duration, for example a web radio.
channel-type.volumio.enqueue-playlist.label = Enqueue Playlist
channel-type.volumio.enqueue-playlist.description = Add all tracks of the playlist with the given name to the play queue
channel-type.volumio.library-update.label = Library Update
channel-type.volumio.library-update.description = ON while Volumio is updating its music database
channel-type.volumio.mute.label = Mute
channel-type.volumio.mute.description = Mute or unmute the master volume
channel-type.volumio.play-file.label = Play File
channel-type.volumio.play-file.description = Play a file, located on your Volumio device at the given absolute path, e.g. "mnt/INTERNAL/song.mp3"
channel-type.volumio.play-playlist.label = Play Playlist
channel-type.volumio.play-playlist.description = Play a playlist identified by its name
channel-type.volumio.play-radiostream.label = Play Radio Stream
channel-type.volumio.play-radiostream.description = Play the given radio stream
channel-type.volumio.play-random.label = Random
channel-type.volumio.play-random.description = Activate random mode
channel-type.volumio.play-repeat.label = Repeat
channel-type.volumio.play-repeat.description = Activate repeat mode
channel-type.volumio.play-uri.label = Play URI
channel-type.volumio.play-uri.description = Play the stream at given URI
channel-type.volumio.player.label = Media Control
channel-type.volumio.player.description = Control the state of the Volumio Player
channel-type.volumio.queue-position.label = Queue Position
channel-type.volumio.queue-position.description = Position of the current track in the play queue, 0 for the first track
channel-type.volumio.queue-size.label = Queue Size
channel-type.volumio.queue-size.description = Number of tracks in the play queue
channel-type.volumio.remove-from-favourites.label = Remove from Favourites
channel-type.volumio.remove-from-favourites.description = Send ON to remove the current item from the Volumio favourites
channel-type.volumio.remove-from-queue.label = Remove from Queue
channel-type.volumio.remove-from-queue.description = Remove the track at the given position from the play queue, 0 for the first track
channel-type.volumio.repeat-single.label = Repeat Single
channel-type.volumio.repeat-single.description = ON if the current track is repeated in a loop
channel-type.volumio.samplerate.label = Sample Rate
channel-type.volumio.samplerate.description = Sample rate of the current item, as reported by Volumio
channel-type.volumio.seek.label = Seek
channel-type.volumio.seek.description = Jump to the given position in the current track. Plain numbers are interpreted as seconds. Write only.
channel-type.volumio.service.label = Playback Service
channel-type.volumio.service.description = Volumio service that plays the current item, for example mpd or spop
channel-type.volumio.stop-command.label = Stop
channel-type.volumio.stop-command.description = Sends a Stop command to stop the player. Use "stop" as string command.
channel-type.volumio.stop-command.state.option.stop = Stop
channel-type.volumio.streaming.label = Streaming
channel-type.volumio.streaming.description = ON if Volumio is playing a stream, for example a web radio
channel-type.volumio.system-command.label = Send System Command
channel-type.volumio.system-command.description = Sends a system command to shutdown or reboot the Volumio device. Use "shutdown" or "reboot" as string command.
channel-type.volumio.system-command.state.option.shutdown = Shutdown
channel-type.volumio.system-command.state.option.reboot = Reboot
channel-type.volumio.title.label = Current Title
channel-type.volumio.title.description = Title of the song currently playing
channel-type.volumio.track-type.label = Track Type
channel-type.volumio.track-type.description = Track type of the currently played track
channel-type.volumio.volume.label = Volume
channel-type.volumio.volume.description = Set or get the master volume
