# add-on

addon.parakeetstt.name = Parakeet Speech-to-Text
addon.parakeetstt.description = Parakeet STT uses parakeet.cpp to transcribe audio data to text using NVIDIA Parakeet and NeMo models.

# add-on config

voice.config.parakeetstt.backends.label = Backends
voice.config.parakeetstt.backends.description = Number of parallel CPU backend instances configured on the model.
voice.config.parakeetstt.decoder.label = Decoder
voice.config.parakeetstt.decoder.description = Decoder used for offline transcription. Leave at Default unless overriding a hybrid model.
voice.config.parakeetstt.decoder.option.DEFAULT = Default
voice.config.parakeetstt.decoder.option.CTC = CTC
voice.config.parakeetstt.decoder.option.TRANSDUCER = Transducer (RNNT / TDT)
voice.config.parakeetstt.group.model.label = Model
voice.config.parakeetstt.group.model.description = Select the Parakeet model and configure model loading behavior.
voice.config.parakeetstt.group.performance.label = CPU Performance
voice.config.parakeetstt.group.performance.description = Configure CPU threading and backend concurrency for model inference.
voice.config.parakeetstt.group.recognition.label = Audio Stream & Stopping Limits
voice.config.parakeetstt.group.recognition.description = Configure audio chunking and silence or duration timeouts for the audio stream.
voice.config.parakeetstt.group.transcription.label = Transcription Behavior
voice.config.parakeetstt.group.transcription.description = Configure transcription mode, decoder, language, and utterance handling.
voice.config.parakeetstt.group.vad.label = Voice Activity Detection
voice.config.parakeetstt.group.vad.description = Configure the Silero Voice Activity Detector used to detect and segment speech.
voice.config.parakeetstt.initSilenceSeconds.label = Initial Silence Seconds
voice.config.parakeetstt.initSilenceSeconds.description = Maximum initial seconds of silence before aborting recognition when no speech has started.
voice.config.parakeetstt.language.label = Language
voice.config.parakeetstt.language.description = Target language code (for example, 'en', 'de', 'es', 'fr') for multilingual models that support language selection. Defaults to the recognition locale if empty.
voice.config.parakeetstt.maxSeconds.label = Max Transcription Seconds
voice.config.parakeetstt.maxSeconds.description = Maximum duration of audio processed in a single recognition session.
voice.config.parakeetstt.maxSilenceSeconds.label = Max Silence Seconds
voice.config.parakeetstt.maxSilenceSeconds.description = Seconds of silence after speech that mark the end of an utterance.
voice.config.parakeetstt.minSpeechSeconds.label = Min Speech Seconds
voice.config.parakeetstt.minSpeechSeconds.description = Minimum duration of speech required to trigger a VAD speech start event.
voice.config.parakeetstt.mode.label = Transcription Mode
voice.config.parakeetstt.mode.description = Select the transcription mode. Automatic uses streaming when supported by the model and falls back to offline VAD-segmented batch transcription otherwise.
voice.config.parakeetstt.mode.option.AUTO = Automatic
voice.config.parakeetstt.mode.option.OFFLINE = Offline (VAD + Batch)
voice.config.parakeetstt.mode.option.STREAMING = Streaming
voice.config.parakeetstt.modelName.label = Model Name
voice.config.parakeetstt.modelName.description = ASR model or bundle GGUF file inside <code>$OPENHAB_USERDATA/parakeet/</code>
voice.config.parakeetstt.preloadModel.label = Preload Model
voice.config.parakeetstt.preloadModel.description = Keep the ASR and VAD models loaded in memory. When enabled, models are only reloaded on configuration changes. When disabled, models are loaded and unloaded on each recognition run.
voice.config.parakeetstt.singleUtteranceMode.label = Single Utterance Mode
voice.config.parakeetstt.singleUtteranceMode.description = When enabled, recognition stops listening after the first utterance completes.
voice.config.parakeetstt.speechPadSeconds.label = Speech Padding Seconds
voice.config.parakeetstt.speechPadSeconds.description = Padding added around speech segments detected by VAD.
voice.config.parakeetstt.stepSeconds.label = Audio Step
voice.config.parakeetstt.stepSeconds.description = Audio chunk duration read from the stream in each processing step.
voice.config.parakeetstt.threads.label = Threads per Backend
voice.config.parakeetstt.threads.description = Number of CPU threads per backend instance (0 uses the library default).
voice.config.parakeetstt.vadModelName.label = VAD Model Name
voice.config.parakeetstt.vadModelName.description = Standalone Silero VAD GGUF file inside <code>$OPENHAB_USERDATA/parakeet/</code>. Optional if the main model is a bundle GGUF containing a 'vad' component or when using streaming mode without VAD.
voice.config.parakeetstt.vadThreshold.label = VAD Threshold
voice.config.parakeetstt.vadThreshold.description = Speech probability threshold (0.05-0.95) for Silero VAD.
