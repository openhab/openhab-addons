# add-on

addon.gme.name = GME Binding
addon.gme.description = Provides electricity market prices from the Italian Gestore dei Mercati Energetici (GME).

# thing types

thing-type.gme.api.label = GME API Account
thing-type.gme.api.description = Connection to the Gestore dei Mercati Energetici market data API.
thing-type.gme.api.channel.password-days-remaining.label = Password Days Remaining
thing-type.gme.api.channel.password-days-remaining.description = Estimated number of days remaining before the GME API password expires.
thing-type.gme.api.channel.password-expiry.label = Password Expiry
thing-type.gme.api.channel.password-expiry.description = Estimated expiry date of the current GME API password.
thing-type.gme.api.channel.password-last-changed.label = Password Last Changed
thing-type.gme.api.channel.password-last-changed.description = Date when the current GME API password was first observed or changed.
thing-type.gme.api.channel.password-status.label = Password Status
thing-type.gme.api.channel.password-status.description = Password age status: OK, CHANGE_SOON or EXPIRED.
thing-type.gme.pun.label = PUN Prices
thing-type.gme.pun.description = Italian PUN electricity market prices from the GME MGP market.
thing-type.gme.pun.channel.current-price.label = Current Price
thing-type.gme.pun.channel.last-update.label = Last Update
thing-type.gme.pun.channel.next-price.label = Next Price
thing-type.gme.pun.channel.tomorrow-available.label = Tomorrow Available
thing-type.gme.pun.group.today.label = Today
thing-type.gme.pun.group.tomorrow.label = Tomorrow

# thing types config

thing-type.config.gme.api.granularity.label = Market Granularity
thing-type.config.gme.api.granularity.description = Granularity requested from the GME MGP market. PT60 preserves hourly pricing; PT30 and PT15 enable finer market time units.
thing-type.config.gme.api.granularity.option.PT60 = PT60 - 60 minutes
thing-type.config.gme.api.granularity.option.PT30 = PT30 - 30 minutes
thing-type.config.gme.api.granularity.option.PT15 = PT15 - 15 minutes
thing-type.config.gme.api.initialPasswordChangedAt.label = Initial Password Change Date
thing-type.config.gme.api.initialPasswordChangedAt.description = Optional date when the current GME API password was changed, in YYYY-MM-DD format. This is only used to initialise password age tracking when no previous tracking information exists.
thing-type.config.gme.api.marketZone.label = Market Zone
thing-type.config.gme.api.marketZone.description = Italian electricity market zone used to retrieve zonal market prices. PUN Index prices are national and are not affected by this setting.
thing-type.config.gme.api.marketZone.option.NORD = NORD - Northern Italy
thing-type.config.gme.api.marketZone.option.CNOR = CNOR - Central-Northern Italy
thing-type.config.gme.api.marketZone.option.CSUD = CSUD - Central-Southern Italy
thing-type.config.gme.api.marketZone.option.SUD = SUD - Southern Italy
thing-type.config.gme.api.marketZone.option.CALA = CALA - Calabria
thing-type.config.gme.api.marketZone.option.SICI = SICI - Sicily
thing-type.config.gme.api.marketZone.option.SARD = SARD - Sardinia
thing-type.config.gme.api.password.label = Password
thing-type.config.gme.api.password.description = Password for the GME API.
thing-type.config.gme.api.refreshInterval.label = Refresh Interval
thing-type.config.gme.api.refreshInterval.description = Interval used to refresh market data.
thing-type.config.gme.api.username.label = Username
thing-type.config.gme.api.username.description = Username for the GME API.

