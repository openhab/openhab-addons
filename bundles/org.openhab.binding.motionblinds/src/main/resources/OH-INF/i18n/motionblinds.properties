# add-on

addon.motionblinds.name = MotionBlinds Binding
addon.motionblinds.description = This is the binding for Wi-Fi motors of Motion Blinds, Dooya and other brands controlled by the Connector app, using the local network API.

# thing types

thing-type.motionblinds.wifi-motor.label = Wi-Fi Motor
thing-type.motionblinds.wifi-motor.description = Blind, curtain or gate motor that is directly connected to Wi-Fi, controlled with the Connector or Motion Blinds app

# thing types config

thing-type.config.motionblinds.wifi-motor.key.label = Key
thing-type.config.motionblinds.wifi-motor.key.description = 16 character key from the app, including dashes. In the Connector or Motion Blinds app go to Settings - About and tap the screen 5 times.
thing-type.config.motionblinds.wifi-motor.macAddress.label = MAC Address
thing-type.config.motionblinds.wifi-motor.macAddress.description = MAC address of the motor, as found by discovery (12 hex digits).
thing-type.config.motionblinds.wifi-motor.refreshInterval.label = Refresh Interval
thing-type.config.motionblinds.wifi-motor.refreshInterval.description = Interval for polling the status. The motor also pushes its status while moving and with a heartbeat about once a minute.
thing-type.config.motionblinds.wifi-motor.tiltSlack.label = Tilt Slack
thing-type.config.motionblinds.wifi-motor.tiltSlack.description = Travel that does not turn the slats when the blind starts to move up from fully lowered, until the bottom rail lifts off. Increase it if tilt 50% from fully lowered turns the slats past open (bottom side visible), decrease it if they stay closed (top side visible).
thing-type.config.motionblinds.wifi-motor.tiltTravel.label = Tilt Travel
thing-type.config.motionblinds.wifi-motor.tiltTravel.description = Travel of the blind that turns the slats from closed on one side to closed on the other side. Increase it if tilt steps at mid-height turn the slats too far, decrease it if they do not turn far enough.

# channel types

channel-type.motionblinds.angle.label = Motor Angle
channel-type.motionblinds.angle.description = Slat angle as estimated by the motor (0-180°). The estimate drifts from the real slats when the blind changes direction; use the tilt channel to control the slats.
channel-type.motionblinds.position.label = Position
channel-type.motionblinds.position.description = Position of the blind: 0% is fully open, 100% is fully closed
channel-type.motionblinds.rssi.label = RSSI
channel-type.motionblinds.rssi.description = Wi-Fi signal strength of the motor
channel-type.motionblinds.tilt.label = Tilt
channel-type.motionblinds.tilt.description = Tilt of the slats at the current height: 0% is closed with the bottom side visible, 50% is open, 100% is closed with the top side visible

# discovery result

discovery.wifi-motor.label = Wi-Fi Motor ({0})

# thing status descriptions

offline.config-error-invalid-mac = MAC address must contain 12 hex digits.
offline.config-error-invalid-key = Key must be 16 characters long (including dashes).
offline.config-error-access-denied = The motor rejected the access token. Check the key.
